# Re-writes data/prospects-2027.js (college stats for the 2027 Class
# prospects, from ESPN) and commits it if anything changed.
name: Refresh prospects

on:
  schedule:
    # 12:00 UTC every Sunday, after Saturday's college games are final.
    - cron: "0 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

# Shares a group with the other refresh jobs so they never push over each other.
concurrency:
  group: refresh-index-html
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh prospect stats from ESPN
        run: node scripts/refresh-prospects.js

      - name: Commit if changed
        run: |
          git add data/prospects-2027.js
          if git diff --cached --quiet; then
            echo "No stat changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh prospect stats from ESPN ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
