# Re-bakes the football scores snapshot (data/nfl-scores.js) from Sleeper and
# commits it if anything changed. The page still pulls live scores on load;
# this keeps the offline fallback current.
name: Refresh scores

on:
  schedule:
    # 10:00 UTC daily (~6am ET), after every night's games have finished,
    # so Thursday, Sunday and Monday games plus stat corrections are picked up.
    - cron: "0 10 * * *"
    # Game-night runs so Sunday and Monday scores land the same night instead
    # of waiting for the morning run (GitHub often starts schedules hours late).
    # 01:00 UTC Monday (~8pm ET Sunday), after the late-afternoon games.
    - cron: "0 1 * * 1"
    # 04:45 UTC Monday and Tuesday (~11:45pm ET), after Sunday and Monday night.
    - cron: "45 4 * * 1,2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-index-html
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Refresh snapshot from Sleeper
        run: node scripts/refresh-scores.js

      - name: Commit if changed
        run: |
          git add data/nfl-scores.js
          if git diff --cached --quiet; then
            echo "No score changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Refresh scores from Sleeper ($(date -u +%Y-%m-%d))"
          git pull --rebase
          git push
