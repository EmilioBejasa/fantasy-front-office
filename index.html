  // Apply a saved light/dark choice (and sport accent) before anything renders, so there's no flash.
  try {
    var savedTheme = localStorage.getItem("ff-valuediff:theme");
    if (savedTheme === "light" || savedTheme === "dark") document.documentElement.dataset.theme = savedTheme;
    if (localStorage.getItem("ff-valuediff:sport") === "nba") document.documentElement.dataset.sport = "nba";
  } catch (e) {}
</script>

<style>
  /* An executive front office: navy and brass, with warm paper in light
     mode and a night-office navy in dark mode. Light is the default; dark
     follows the OS setting unless the theme toggle picked one (data-theme
     on <html>). Data colors (positions, trends, tool hues) stay the same in
     both. */
  :root {
    color-scheme: light;
    --surface-1: #fffdf8;
    --surface-2: #f1ebdd;
    --page: #f5f0e5;
    --text-primary: #14213d;
    --text-secondary: #4a5368;
    --text-muted: #857f70;
    --border: rgba(20, 33, 61, 0.12);
    --grid: #e4dccb;
    --baseline: #c8bfa9;
    --series-blue: #2a78d6;
    --series-red: #e34948;
    --series-neutral: #4a5368;
    --series-amber: #b8860b;
    /* Position colors for the dynasty team-value bars, in fixed order. */
    --pos-qb: #2a78d6;
    --pos-rb: #eb6834;
    --pos-wr: #1baf7a;
    --pos-te: #eda100;
    --pos-pick: #e87ba4;
    --pos-te-strong: #b8860b;
    /* Accent hues (one per tool on the home page and nav) and trend colors. */
    --hue-blue: #2a78d6; --hue-orange: #eb6834; --hue-aqua: #1baf7a; --hue-magenta: #e87ba4;
    --hue-violet: #4a3aa7; --hue-red: #e34948; --hue-yellow: #eda100;
    --trend-up: #0f8a4f;
    /* Office: navy header, brass trim, manila folders. */
    --header-bg: #14213d;
    --header-text: #f5f1e6;
    --brass: #a9822f;
    --brass-grad-a: #8a6420; --brass-grad-b: #c39a3c;
    --folder: #f6ead0;
    /* Sport accent, Sleeper-style: green football, orange basketball
       (data-sport on <html>). Used for the header trim, active nav, main
       buttons, links and hovers; the logo and headline stay brass. */
    --sport-nfl: #178a50; --sport-nba: #c95a12;
    --sport: var(--sport-nfl);
    --sport-btn-a: #2bb672; --sport-btn-b: #178a50;
  }
  :root[data-sport="nba"] { --sport: var(--sport-nba); --sport-btn-a: #f5853a; --sport-btn-b: #d4600f; }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --surface-1: #131d31;
    --surface-2: #1b2740;
    --page: #0b1324;
    --text-primary: #f5f1e6;
    --text-secondary: #c9c2b0;
    --text-muted: #8f8a7c;
    --border: rgba(245, 241, 230, 0.1);
    --grid: #223049;
    --baseline: #2e3d58;
    --series-blue: #3987e5;
    --series-red: #e66767;
    --series-neutral: #c9c2b0;
    --series-amber: #d4a017;
    --pos-qb: #3987e5;
    --pos-rb: #d95926;
    --pos-wr: #199e70;
    --pos-te: #c98500;
    --pos-pick: #d55181;
    --pos-te-strong: #d4a017;
    --hue-blue: #3987e5; --hue-orange: #d95926; --hue-aqua: #199e70; --hue-magenta: #d55181;
    --hue-violet: #9085e9; --hue-red: #e66767; --hue-yellow: #c98500;
    --trend-up: #3ecf8e;
    --header-bg: #0e1830;
    --header-text: #f5f1e6;
    --brass: #d4ae55;
    --brass-grad-a: #d4ae55; --brass-grad-b: #f0d68c;
    --folder: #17223a;
    --sport-nfl: #3ecf8e; --sport-nba: #ff8a3d;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --surface-1: #131d31;
      --surface-2: #1b2740;
      --page: #0b1324;
      --text-primary: #f5f1e6;
      --text-secondary: #c9c2b0;
      --text-muted: #8f8a7c;
      --border: rgba(245, 241, 230, 0.1);
      --grid: #223049;
      --baseline: #2e3d58;
      --series-blue: #3987e5;
      --series-red: #e66767;
      --series-neutral: #c9c2b0;
      --series-amber: #d4a017;
      --pos-qb: #3987e5;
      --pos-rb: #d95926;
      --pos-wr: #199e70;
      --pos-te: #c98500;
      --pos-pick: #d55181;
      --pos-te-strong: #d4a017;
      --hue-blue: #3987e5; --hue-orange: #d95926; --hue-aqua: #199e70; --hue-magenta: #d55181;
      --hue-violet: #9085e9; --hue-red: #e66767; --hue-yellow: #c98500;
      --trend-up: #3ecf8e;
      --header-bg: #0e1830;
      --header-text: #f5f1e6;
      --brass: #d4ae55;
      --brass-grad-a: #d4ae55; --brass-grad-b: #f0d68c;
      --folder: #17223a;
      --sport-nfl: #3ecf8e; --sport-nba: #ff8a3d;
    }
  }
  * { box-sizing: border-box; }
  html { scroll-padding-top: 4.5rem; }
  body { margin: 0; background: var(--page); color: var(--text-primary);
    font: 15px/1.5 Inter, system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; }
  table { font-variant-numeric: tabular-nums; }
  select { font-variant-numeric: tabular-nums; }
  /* Headings in an editorial serif, like a letterhead. */
  h1, main h2, .font-display { font-family: Fraunces, Georgia, "Times New Roman", serif; letter-spacing: -0.01em; }

  /* Site chrome: a navy header with a trim line in the sport color. */
  .site-header { background: color-mix(in srgb, var(--header-bg) 95%, transparent); border-bottom: 2px solid var(--sport);
    padding-top: env(safe-area-inset-top); /* under the status bar when installed on a phone */
    backdrop-filter: saturate(1.4) blur(10px); -webkit-backdrop-filter: saturate(1.4) blur(10px); }
  .brand-text { color: var(--text-primary); }
  .site-header .brand-text { color: var(--header-text); }
  .nav-link { color: var(--text-secondary); transition: background-color .15s, color .15s; }
  .nav-link:hover { background: var(--surface-2); color: var(--text-primary); }
  .site-header .nav-link { color: color-mix(in srgb, var(--header-text) 72%, transparent); }
  .site-header .nav-link:hover { background: rgba(255, 255, 255, 0.08); color: var(--header-text); }
  .site-header .nav-link[aria-current="page"] { background: rgba(255, 255, 255, 0.1); color: var(--header-text);
    box-shadow: inset 0 -2px 0 var(--link-hue, var(--sport)); }
  .site-header .nav-group { color: color-mix(in srgb, var(--header-text) 45%, transparent); }

  /* Brass nameplate logo. */
  .nameplate { background: linear-gradient(180deg, #ead08a, #b88c2e 55%, #d9b960); color: #14213d;
    font: 800 11px/1 Inter, sans-serif; letter-spacing: .1em; padding: 8px 9px; border-radius: 4px;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .55), inset 0 -1px 0 rgba(0, 0, 0, .25), 0 1px 3px rgba(0, 0, 0, .45); }

  /* Manila folder cards with a labeled tab. */
  .folder { position: relative; margin-top: 18px; background: var(--folder) !important; border-top-left-radius: 0 !important; }
  .folder::before { content: attr(data-tab); position: absolute; left: -1px; top: -19px; height: 19px; padding: 5px 12px 0;
    border: 1px solid var(--border); border-bottom: 0; border-radius: 8px 8px 0 0; background: var(--folder);
    font: 700 9.5px/1 Inter, sans-serif; letter-spacing: .12em; text-transform: uppercase; color: var(--text-muted);
    transition: border-color .15s; }
  .card-link { transition: border-color .15s, transform .15s, box-shadow .15s; }
  .card-link:hover { border-color: var(--card-hue, var(--sport)) !important; transform: translateY(-3px);
    box-shadow: 0 10px 26px -14px rgba(0, 0, 0, 0.45); }
  .card-link.folder:hover::before { border-color: var(--card-hue, var(--sport)); }
  .card-link:hover .card-arrow { transform: translateX(3px); }
  .card-arrow { transition: transform .15s; display: inline-block; }

  /* Buttons: the sport color for the main action. */
  .btn-primary { background: linear-gradient(180deg, var(--sport-btn-a), var(--sport-btn-b)); color: #ffffff;
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 6px 16px -8px color-mix(in srgb, var(--sport-btn-b) 80%, transparent);
    transition: transform .15s, box-shadow .15s, filter .15s; }
  .btn-primary:hover { transform: translateY(-1px); filter: brightness(1.06);
    box-shadow: inset 0 1px 0 rgba(255, 255, 255, .35), 0 10px 22px -8px color-mix(in srgb, var(--sport-btn-b) 90%, transparent); }
  .btn-primary:active { transform: translateY(0) scale(.97); }
  .btn-secondary { border: 1px solid var(--border); color: var(--text-primary); background: var(--surface-1);
    transition: background-color .15s, border-color .15s, transform .15s; }
  .btn-secondary:hover { background: var(--surface-2); border-color: var(--sport); transform: translateY(-1px); }
  .btn-secondary:active { transform: translateY(0) scale(.97); }
  .hero-glow { background: radial-gradient(55% 120% at 50% 0%, color-mix(in srgb, var(--sport) 20%, transparent), transparent 70%); }
  .text-gradient { background: linear-gradient(90deg, var(--brass-grad-a), var(--brass-grad-b) 55%, var(--brass-grad-a));
    -webkit-background-clip: text; background-clip: text; color: transparent; }

  /* Shared pill button: filters, toggles, settings. Selected state comes from
     aria-pressed; the color from --pill-accent (the page's color unless a
     trade-side color is passed). */
  /* A page's controls fill with its color, darkened a little so white labels
     stay readable on the lighter hues (yellow, pink). */
  main { --page-accent: color-mix(in srgb, var(--page-hue, var(--sport)) 85%, #000); }
  .pill { --pill-accent: var(--page-accent, var(--sport)); border: 1px solid var(--border); background: var(--surface-1);
    color: var(--text-secondary); cursor: pointer; user-select: none;
    transition: background-color .15s, border-color .15s, color .15s, transform .1s, box-shadow .15s; }
  .pill:hover { border-color: var(--pill-accent); color: var(--text-primary);
    background: color-mix(in srgb, var(--pill-accent) 12%, var(--surface-1)); }
  .pill:active { transform: scale(.94); }
  .pill[aria-pressed="true"] { background: var(--pill-accent); border-color: var(--pill-accent); color: #ffffff; font-weight: 600;
    box-shadow: 0 3px 10px -3px color-mix(in srgb, var(--pill-accent) 70%, transparent); }
  .pill:focus-visible, .btn-primary:focus-visible, .btn-secondary:focus-visible, .nav-link:focus-visible {
    outline: 2px solid var(--sport); outline-offset: 2px; }

  /* Draft board: a Sleeper-style startup board, always dark like Sleeper's,
     with each pick a card in its position color (Sleeper's own palette). */
  .draft-board { background: #0f1724; border: 1px solid #22304a; border-radius: 12px; overflow: auto; max-height: 78vh; }
  .draft-grid { display: grid; gap: 4px; padding: 0 6px 6px; }
  .db-head { position: sticky; top: 0; z-index: 2; background: #0f1724; padding: 8px 2px 6px; text-align: center;
    font: 600 11px/1.2 Inter, sans-serif; color: #c3cde0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db-head span { display: block; font-size: 10px; font-weight: 500; color: #6f7f9c; }
  .db-cell { --db-pos: #3a475e; position: relative; min-width: 0; height: 72px; border-radius: 6px; padding: 5px 6px;
    background: var(--db-pos); color: #101624; overflow: hidden; text-decoration: none; display: flex; flex-direction: column;
    transition: opacity .15s, transform .12s, box-shadow .12s; }
  .db-cell:hover { transform: translateY(-1px); box-shadow: 0 6px 14px -6px rgba(0, 0, 0, .7); z-index: 1; }
  .db-cell.empty { background: #172236; }
  .db-cell.dim { opacity: .18; }
  .db-cell.hit { box-shadow: 0 0 0 2px #ffffff, 0 0 14px rgba(255, 255, 255, .45); z-index: 1; }
  .db-first { font-size: 10.5px; line-height: 1.15; opacity: .82; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 30px; }
  .db-last { font-size: 13.5px; font-weight: 800; line-height: 1.15; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .db-meta { margin-top: auto; display: flex; justify-content: space-between; align-items: baseline; gap: 4px;
    font-size: 9.5px; font-weight: 600; line-height: 1; opacity: .85; white-space: nowrap; overflow: hidden; }
  .db-pick { position: absolute; top: 5px; right: 7px; font-size: 10px; font-weight: 700; opacity: .7; }
  .db-cell.empty .db-pick { color: #6f7f9c; opacity: 1; }

  /* Player profiles: name links, round headshots, the points-by-week bars. */
  .player-link { color: var(--text-primary); text-decoration: underline; text-decoration-color: transparent;
    text-underline-offset: 3px; transition: text-decoration-color .15s, color .15s; }
  .player-link:hover { text-decoration-color: var(--sport); }
  .headshot { position: relative; flex-shrink: 0; border-radius: 9999px; overflow: hidden; background: var(--surface-2);
    box-shadow: 0 0 0 2px var(--ring, var(--border)); }
  .headshot img { width: 100%; height: 100%; object-fit: cover; }
  .pts-chart { position: relative; display: flex; align-items: flex-end; gap: 4px; height: 160px;
    border-bottom: 1px solid var(--border); }
  .pts-col { position: relative; flex: 1; height: 100%; min-width: 0; padding: 0; border: 0; background: transparent; cursor: default; }
  .pts-col:focus-visible { outline: 2px solid var(--sport); outline-offset: 2px; }
  .pts-col[data-active="true"] { background: color-mix(in srgb, var(--text-primary) 6%, transparent); border-radius: 4px 4px 0 0; }
  .pts-bar { position: absolute; left: 18%; right: 18%; bottom: 0; border-radius: 4px 4px 0 0; }
  .pts-proj { position: absolute; left: 6%; right: 6%; height: 2px; margin-bottom: -1px; border-radius: 1px; background: var(--text-primary); }
  .pts-none { position: absolute; bottom: 4px; left: 0; right: 0; text-align: center; font-size: 11px; color: var(--text-muted); }
  .pts-avg { position: absolute; left: 0; right: 0; border-top: 1px dashed var(--text-muted); pointer-events: none; }
  .pts-labels { display: flex; gap: 4px; }
  .pts-labels span { flex: 1; min-width: 0; text-align: center; font-size: 10.5px; color: var(--text-muted); font-variant-numeric: tabular-nums; }

  /* Position badge (QB / RB / WR / TE / Pick), tinted with the position color. */
  .pos-badge { display: inline-block; font-size: 11px; font-weight: 700; line-height: 1; padding: 3px 6px; border-radius: 5px;
    letter-spacing: .02em; color: color-mix(in srgb, var(--pos) 72%, var(--text-primary));
    background: color-mix(in srgb, var(--pos) 16%, transparent); vertical-align: 1px; white-space: nowrap; }

  .row-hover > td { transition: background-color .12s; }
  .row-hover:hover > td { background: color-mix(in srgb, var(--sport) 10%, transparent); }
  .row-btn { transition: background-color .15s; border-radius: 8px; }
  .row-btn:hover { background: var(--surface-2); }
  .menu-item { transition: background-color .1s; }
  .menu-item:hover { background: color-mix(in srgb, var(--sport) 14%, var(--surface-1)); }
  .icon-btn-danger { color: var(--text-muted); transition: color .15s, background-color .15s; }
  .icon-btn-danger:hover { color: var(--series-red); background: color-mix(in srgb, var(--series-red) 12%, transparent); }

  /* Segmented controls (PillGroup): a soft track with a sliding highlight. */
  .segmented { position: relative; display: inline-flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px;
    border-radius: 11px; background: var(--surface-2); border: 1px solid var(--border); max-width: 100%; }
  .segmented-scroll { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; }
  .segmented-scroll::-webkit-scrollbar { display: none; }
  .segmented-scroll .seg { flex-shrink: 0; }
  .seg-indicator { position: absolute; left: 0; top: 0; border-radius: 8px; background: var(--pill-accent);
    box-shadow: 0 1px 2px rgba(0, 0, 0, .18), 0 4px 12px -4px color-mix(in srgb, var(--pill-accent) 70%, transparent);
    transition: transform .22s cubic-bezier(.3, .7, .4, 1), width .22s, height .22s, background-color .22s; }
  .seg { position: relative; z-index: 1; border: 0; background: transparent; color: var(--text-secondary); border-radius: 8px;
    padding: 4px 11px; font-size: 12px; font-weight: 500; line-height: 1.45; white-space: nowrap; cursor: pointer;
    transition: color .15s, background-color .15s, transform .1s; }
  .seg:hover:not([aria-pressed="true"]) { color: var(--text-primary); background: color-mix(in srgb, var(--pill-accent) 14%, transparent); }
  .seg[aria-pressed="true"] { color: #ffffff; font-weight: 600; }
  .seg:active { transform: scale(.95); }
  .seg:focus-visible { outline: 2px solid var(--sport); outline-offset: 1px; }

  /* Sport switch (a segmented control) inside the navy header. */
  .site-header .segmented { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.14); }
  .site-header .seg { color: color-mix(in srgb, var(--header-text) 72%, transparent); }
  .site-header .seg:hover:not([aria-pressed="true"]) { color: var(--header-text); background: rgba(255, 255, 255, 0.08); }
  .site-header .seg[aria-pressed="true"] { color: #14213d; }

  /* Header dropdowns. */
  .nav-trigger { display: flex; align-items: center; gap: 4px; padding: 6px 12px; border-radius: 8px; font-size: 14px; font-weight: 500;
    color: color-mix(in srgb, var(--header-text) 75%, transparent); transition: background-color .15s, color .15s; }
  .nav-trigger:hover, .nav-trigger[aria-expanded="true"] { color: var(--header-text); background: rgba(255, 255, 255, 0.08); }
  .nav-trigger[data-active="true"] { color: var(--header-text); box-shadow: inset 0 -2px 0 var(--sport); }
  .nav-trigger svg { transition: transform .2s; }
  .nav-trigger[aria-expanded="true"] svg { transform: rotate(180deg); }
  .nav-trigger:focus-visible { outline: 2px solid var(--sport); outline-offset: 2px; }
  .nav-menu > div { animation: menu-in .14s ease-out; }
  @keyframes menu-in { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }
  .menu-row { transition: background-color .12s; }
  .menu-row:hover, .menu-row[aria-current="page"] { background: var(--surface-2); }

  /* "About this data" disclosure under page titles. */
  .about-data summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; font-size: 12px;
    font-weight: 600; color: var(--text-secondary); padding: 3px 10px 3px 8px; border-radius: 999px; border: 1px solid var(--border);
    background: var(--surface-1); transition: border-color .15s, color .15s; }
  .about-data summary::-webkit-details-marker { display: none; }
  .about-data summary::before { content: "i"; display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px;
    border-radius: 50%; font: italic 700 10px/1 Georgia, serif; color: #14213d; background: var(--brass); }
  .about-data summary:hover { border-color: var(--sport); color: var(--text-primary); }
  .about-data[open] summary { border-color: var(--sport); }

  /* Softer panels: rounder corners, lighter edges and a gentle shadow instead of hard boxes. */
  main .rounded-lg.border { border-radius: 14px; border-color: color-mix(in srgb, var(--border) 70%, transparent) !important;

// Earliest game a player can come back for: the first team game after the
// four-game minimum from `sinceWeek` (a bye week doesn't count as a game, and
// isn't a return week either), or null if season-ending.
function irReturnWeek(entry, team) {
  if (entry.seasonEnding) return null;
  let games = 0;
  for (let w = entry.sinceWeek; w <= 18; w++) {
    if (BYE_WEEKS[team] === w) continue;
    if (games === IR_MIN_GAMES) return w;
    games++;
  }
  return null;
}

// Only weeks with real scores get a "By Week" tab — no point
// offering later weeks as choices when none of them have real
// scores yet. The season grid still shows all 18 weeks as columns (blank
// until played), since that's meant to show the whole season's shape at a
// glance.
const playedWeeks = (scores) => Object.keys(scores).map(Number).sort((a, b) => a - b);

/* ---------------- weekly scores (live) ---------------- */
// Starts from the baked-in WEEKLY_SCORES/DID_NOT_PLAY snapshot, then pulls
// every week played so far straight from Sleeper (shared logic in
// scripts/lib/sleeper-scores.js) and swaps each week in as it arrives. Each
// week's trimmed result is cached in localStorage: finished weeks for a few
// hours (stat corrections still trickle in), the current week for a few
// minutes so in-progress games stay fresh.
const LIVE_SCORES_CACHE_KEY = "ff-valuediff:live-scores-v5";
const LIVE_SCORES_TTL_MS = { done: 6 * 60 * 60 * 1000, current: 5 * 60 * 1000 };

// Live extras replace baked ones with the same id; baked ones from weeks the
// live fetch hasn't returned yet are kept.
function mergeExtraPlayers(baked, live) {
  const byId = new Map(baked.map((p) => [p.id, p]));
  for (const p of live) byId.set(p.id, p);
  return [...byId.values()];
}

function useLiveScores(players) {
  const [data, setData] = useState({
    scores: WEEKLY_SCORES, dnp: DID_NOT_PLAY, teamsPlayed: {}, details: {}, allowed: {}, players: [...players, ...EXTRA_PLAYERS],
    status: "loading", updatedOn: WEEKLY_SCORES_UPDATED_ON,
  });

  useEffect(() => {
    if (!window.SleeperScores) {
      setData((d) => ({ ...d, status: "error", message: "scripts/lib/sleeper-scores.js didn't load" }));
      return;
    }
    const { fetchState, fetchWeek, weeksToFetch, mergeExtras } = window.SleeperScores;
    let cancelled = false;
    let cache = {};
    try { cache = JSON.parse(localStorage.getItem(LIVE_SCORES_CACHE_KEY) || "{}"); } catch (e) {}

    // Weeks fetched so far; each arrival re-merges the extras across them all.
    const live = {};
    const apply = (week, wk) => {
      if (wk.teamsPlayed.length === 0) return; // not started yet
      live[week] = wk;
      const merged = mergeExtras(live);
      setData((d) => ({
        ...d,
        scores: { ...d.scores, ...merged.scores },
        dnp: { ...d.dnp, [week]: wk.dnp },
        teamsPlayed: { ...d.teamsPlayed, [week]: wk.teamsPlayed },
        details: { ...d.details, [week]: wk.details || {} },
        allowed: { ...d.allowed, [week]: wk.allowed || {} },
        players: [...players, ...mergeExtraPlayers(EXTRA_PLAYERS, merged.players)],
      }));
    };

    (async () => {
      const state = await fetchState();
      const season = state.season;
      if (cache.season !== season) cache = { season, weeks: {} };

      await Promise.all(weeksToFetch(state).map(async (week) => {
        const ttl = week < state.week ? LIVE_SCORES_TTL_MS.done : LIVE_SCORES_TTL_MS.current;
        const hit = cache.weeks[week];
        const wk = hit && Date.now() - hit.fetchedAt < ttl ? hit : { ...(await fetchWeek(season, week, players)), fetchedAt: Date.now() };
        cache.weeks[week] = wk;
        if (!cancelled) apply(week, wk);
      }));

      try { localStorage.setItem(LIVE_SCORES_CACHE_KEY, JSON.stringify(cache)); } catch (e) {}
      if (!cancelled) setData((d) => ({ ...d, status: "live", updatedOn: new Date().toLocaleString() }));
    })().catch((err) => {
      if (!cancelled) setData((d) => ({ ...d, status: "error", message: err.message }));
    });

    return () => { cancelled = true; };
  }, [players]);

  return data;
}

/* ---------------- sleeper trending (live) ---------------- */
// Unlike the hand-curated list above, this part IS live: Sleeper's API sends
// an open CORS header (unlike BeatADP), so a browser tab can call it
// directly — no refresh script or extension needed. Two endpoints:
// - /players/nfl/trending/add — which player IDs are being added across
//   Sleeper leagues right now, and how many times in the lookback window.
// - /players/nfl — every player Sleeper knows about, to turn those IDs into
//   names/teams/positions. Sleeper's own docs say this second one is a
//   large (~5MB+) payload meant to be cached, not called per-request — so
//   it's trimmed to skill positions (QB/RB/WR/TE) and cached in localStorage
//   before being reused. It also carries injury designations, which feed the
//   live injury report on the Injuries tab and change daily during the week,
//   so the cache is kept for 6 hours rather than a full day.
const SLEEPER_PLAYERS_CACHE_KEY = "ff-valuediff:sleeper-players-cache-v3";
const SLEEPER_PLAYERS_CACHE_TTL_MS = 6 * 60 * 60 * 1000;
// data/nfl-players.js is the same trimmed map, re-baked every 3 hours by
// scripts/refresh-players.js (~30KB gzipped instead of ~2.5MB). Older than
// this and the page goes to Sleeper itself, in case the Action stopped.
const NFL_PLAYERS_FILE_MAX_AGE_MS = 12 * 60 * 60 * 1000;
const SLEEPER_TRENDING_LOOKBACK_HOURS = 24;
const SLEEPER_TRENDING_LIMIT = 15;
const SKILL_POSITIONS = ["QB", "RB", "WR", "TE"];

// Loads one of the generated data/*.js files on demand (a <script> tag rather
// than fetch, so it works from a double-clicked file too). Resolves to the
// global it sets, or null if it's missing.
const dataScripts = {};
// scripts/build.js swaps in a new id on every deploy, so a fresh data file is
// never hidden behind a cached copy; "dev" (the source page) leaves URLs bare.
const BUILD_ID = "dev";
function loadDataScript(src, name) {
  return dataScripts[src] || (dataScripts[src] = new Promise((resolve) => {
    const tag = document.createElement("script");
    tag.src = BUILD_ID === "dev" ? src : `${src}?v=${BUILD_ID}`;
    tag.onload = () => resolve(window[name] || null);
    tag.onerror = () => resolve(null);
    document.head.appendChild(tag);
  }));
}

async function fetchSleeperPlayerMap() {
  try {
    const cached = JSON.parse(localStorage.getItem(SLEEPER_PLAYERS_CACHE_KEY) || "null");
    if (cached && Date.now() - cached.fetchedAt < SLEEPER_PLAYERS_CACHE_TTL_MS) return cached.players;
  } catch (e) {}

  const file = await loadDataScript("data/nfl-players.js", "NFL_PLAYERS");
  const fresh = file && Date.now() - file.fetchedAt < NFL_PLAYERS_FILE_MAX_AGE_MS;
  // Cached under the file's own time, so it's rechecked once that's 6 hours old.
  const fetchedAt = fresh ? file.fetchedAt : Date.now();
  const trimmed = fresh ? file.players : await window.SleeperPlayers.fetchPlayers();
  try {
    localStorage.setItem(SLEEPER_PLAYERS_CACHE_KEY, JSON.stringify({ fetchedAt, players: trimmed }));
  } catch (e) {
    // Quota exceeded or storage unavailable — fine, this session just won't cache it.
  }
  return trimmed;
}

async function fetchSleeperTrending(direction) {
  const url = `https://api.sleeper.app/v1/players/nfl/trending/${direction}?lookback_hours=${SLEEPER_TRENDING_LOOKBACK_HOURS}&limit=${SLEEPER_TRENDING_LIMIT * 3}`;
  const res = await fetch(url);
  if (!res.ok) throw new Error(`Sleeper trending fetch failed (${res.status})`);
  return res.json();
}

function SleeperTrending() {
  const [direction, setDirection] = useState("add");
  const [state, setState] = useState({ status: "loading", rows: [] });
  const { ownerOf, hideRostered } = useRostered("nfl");

  useEffect(() => {
    let cancelled = false;
    setState({ status: "loading", rows: [] });

    Promise.all([fetchSleeperTrending(direction), fetchSleeperPlayerMap()])
      .then(([trending, playerMap]) => {
        if (cancelled) return;
        const rows = trending
          .map((t) => ({ ...playerMap[t.player_id], id: t.player_id, count: t.count }))
          // Trending includes D/STs and non-skill players too — that entry
          // just won't have matched anything in the trimmed player map.
          .filter((r) => r.name);
        setState({ status: "ready", rows });
      })
      .catch((err) => {
        if (cancelled) return;
        setState({ status: "error", rows: [], message: err.message });
      });

    return () => { cancelled = true; };
  }, [direction]);

  return (
    <div className="rounded-lg border p-4" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <div className="flex items-center justify-between flex-wrap gap-2 mb-1">
        <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
          Trending on Sleeper <span className="font-normal" style={{ color: "var(--text-muted)" }}>· live</span>
        </h3>
        <PillGroup options={[{ key: "add", label: "Adds" }, { key: "drop", label: "Drops" }]} value={direction} onChange={setDirection} />
      </div>
      <p className="text-xs mb-3" style={{ color: "var(--text-muted)" }}>
        Real-time — how many Sleeper fantasy teams have {direction === "add" ? "added" : "dropped"} each player
        in the last {SLEEPER_TRENDING_LOOKBACK_HOURS}h, straight from Sleeper's public API. This is raw
        community activity, not a vetted pick — no reasoning behind why a name is moving, unlike the hand-curated
        list below.
      </p>

      {state.status === "loading" && (
        <p className="text-sm py-4 text-center" style={{ color: "var(--text-muted)" }}>Loading live data from Sleeper…</p>
      )}
      {state.status === "error" && (
        <p className="text-sm py-4 text-center" style={{ color: "var(--text-muted)" }}>
          Couldn't reach Sleeper's API ({state.message}). This needs the page served over http(s) with network
          access — it won't work from a plain double-clicked file.
        </p>
      )}
      {state.status === "ready" && (
        <div className="flex flex-wrap gap-2">
          {state.rows.filter((r) => !(hideRostered && ownerOf(r.id))).slice(0, SLEEPER_TRENDING_LIMIT).map((r, i) => (
            <div key={i} className="rounded-md border px-2.5 py-1.5 text-xs flex items-center gap-2"
              style={{ borderColor: "var(--border)" }}>
              <PlayerLink id={r.id}>{r.name}</PlayerLink>
              <span style={{ color: "var(--text-muted)" }}>{r.position} · {r.team}{r.status ? ` · ${r.status}` : ""}<RosteredTag owner={ownerOf(r.id)} /></span>
              <span className="tabular-nums font-semibold" style={{ color: direction === "add" ? "var(--series-blue)" : "var(--series-red)" }}>
                {r.count.toLocaleString()}
              </span>
            </div>
          ))}
        </div>
      )}
    </div>
  );
}

  const sortedTargets = useMemo(

/* ---------------- weekly scores page ---------------- */
// Weeks with a real entry in WEEKLY_SCORES show actual results; every week
// 1-18 still gets a tab (unlike Waiver Wire's played-weeks-only tabs) since
// each week's bye list is known for the whole season in advance, even before
// that week's games have happened.
// Per-cell state for one player in one week of the season grid: a real
// score, that team's real bye week, a week inside an IR stint, a played week
// they sat out, or a week that hasn't been played yet — each renders
// differently (number / "BYE" / "IR" / "OUT" / blank) rather than collapsing
// "no number" into one meaning.
function isOnIr(player, w) {
  const entry = INJURED_BY_ID[player.id];
  if (!entry || w < entry.sinceWeek) return false;
  const back = irReturnWeek(entry, player.team);
  return back === null || w < back;
}

function weekCell(player, w, data) {
  if (BYE_WEEKS[player.team] === w) return { type: "bye" };
  const wk = data.scores[w];
  if (wk && wk[player.id] !== undefined) return { type: "score", value: wk[player.id] };
  if (isOnIr(player, w)) return { type: "ir" };
  if ((data.dnp[w] || []).includes(player.id)) return { type: "out" };
  return { type: "blank" };
}

const CELL_LABEL = { bye: "BYE", ir: "IR", out: "OUT", blank: "–" };
const CELL_COLOR = { ir: "var(--series-red)", out: "var(--series-amber)" };

// Modeled on FantasyPros' own "Weekly Fantasy Football Leaders" report
// (RK / Player / POS / GP / Wk1…Wk18 / AVG / TTL, sortable by AVG or TTL) —
// same shape, backed by this app's own real-results-only WEEKLY_SCORES.
function SortHeader({ label, active, onClick, className = "" }) {
  return (
    <th className={`text-right px-3 py-2 text-xs font-semibold sticky top-0 z-20 select-none cursor-pointer ${className}`}
      onClick={onClick}
      style={{ color: active ? "var(--text-primary)" : "var(--text-muted)", background: "var(--surface-1)" }}>
      {label} {active && <span style={{ color: "var(--page-accent, var(--sport))" }}>▾</span>}
    </th>
  );
}

function SeasonGrid({ players, positionFilter, data }) {
  const [sortBy, setSortBy] = useState("ttl");

  const rows = useMemo(() => {
    const withTotals = players
      .filter((p) => positionFilter === "ALL" || p.position === positionFilter)
      .map((p) => {
        const cells = ALL_WEEKS.map((w) => weekCell(p, w, data));
        const gp = cells.filter((c) => c.type === "score").length;
        const ttl = cells.reduce((sum, c) => sum + (c.type === "score" ? c.value : 0), 0);
        const avg = gp > 0 ? ttl / gp : null;
        return { ...p, cells, gp, ttl, avg };
      });
    return withTotals.sort((a, b) => {
      if (sortBy === "avg") return (b.avg ?? -1) - (a.avg ?? -1);
      return b.ttl - a.ttl;
    });
  }, [players, positionFilter, sortBy, data]);

  return (
    <>
    <LabeledControl label="Sort">
      <PillGroup options={[{ key: "ttl", label: "Total" }, { key: "avg", label: "Average" }]} value={sortBy} onChange={setSortBy} />
    </LabeledControl>
    <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
      <table className="border-collapse text-sm" style={{ minWidth: "100%" }}>
        <thead>
          <tr style={{ borderBottom: "1px solid var(--border)" }}>
            <th className="text-right px-2 py-2 text-xs font-semibold sticky top-0 left-0 z-20"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)" }}>RK</th>
            <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-20"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)", left: "2.5rem" }}>Player</th>
            <th className="text-left px-2 py-2 text-xs font-semibold sticky top-0 z-10"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)" }}>Pos</th>
            <th className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10"
              style={{ color: "var(--text-muted)", background: "var(--surface-1)" }}>GP</th>
            {ALL_WEEKS.map((w) => (
              <th key={w} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10"
                style={{ color: "var(--text-muted)", background: "var(--surface-1)", minWidth: "2.75rem" }}>
                {w}
              </th>
            ))}
            <SortHeader label="TTL" active={sortBy === "ttl"} onClick={() => setSortBy("ttl")} />
            <SortHeader label="AVG" active={sortBy === "avg"} onClick={() => setSortBy("avg")} />
          </tr>
        </thead>
        <tbody>
          {rows.map((p, i) => {
            const rowBg = i % 2 === 1 ? "var(--page)" : "var(--surface-1)";
            return (
              <tr key={p.id} className="border-b" style={{ borderColor: "var(--border)", background: rowBg }}>
                <td className="px-2 py-1.5 text-right tabular-nums sticky left-0"
                  style={{ color: "var(--text-muted)", background: rowBg }}>{i + 1}</td>
                <td className="px-3 py-1.5 whitespace-nowrap sticky z-0" style={{ background: rowBg, left: "2.5rem" }}>
                  <PlayerLink id={p.id} name={p.name} pos={p.position}>{p.name}</PlayerLink>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{p.team}</span>
                </td>
                <td className="px-2 py-1.5"><PosBadge pos={p.position} /></td>
                <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{p.gp}</td>
                {p.cells.map((c, wi) => (
                  <td key={wi} className="px-2 py-1.5 text-right tabular-nums"
                    style={{
                      color: c.type === "score" ? "var(--text-primary)" : (CELL_COLOR[c.type] || "var(--text-muted)"),
                      fontWeight: CELL_COLOR[c.type] ? 600 : 400,
                      fontSize: c.type === "score" ? undefined : "0.75rem",
                    }}>
                    {c.type === "score" ? c.value.toFixed(1) : CELL_LABEL[c.type]}
                  </td>
                ))}
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: sortBy === "ttl" ? "var(--text-primary)" : "var(--text-secondary)", fontWeight: sortBy === "ttl" ? 600 : 400 }}>
                  {p.ttl.toFixed(1)}
                </td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: sortBy === "avg" ? "var(--text-primary)" : "var(--text-secondary)", fontWeight: sortBy === "avg" ? 600 : 400 }}>
                  {p.avg === null ? "–" : p.avg.toFixed(1)}
                </td>
              </tr>
            );
          })}
        </tbody>
      </table>
    </div>
    </>
  );
}

const WEEKLY_VIEWS = [
  { key: "byWeek", label: "By Week" },
  { key: "grid", label: "Season Grid" },
];

// RB/WR ahead of QB/TE, ALL last rather than first — matches how this app's
// audience actually scans a position filter (skill positions people are
// picking waivers/streamers for first, the full unfiltered view last).
const POSITIONS = ["RB", "WR", "QB", "TE", "ALL"];

// Position colors for filters and badges, like most fantasy sites (TE uses
// a deeper gold so white text on a selected pill stays readable).
const POS_PILL_COLOR = {
  QB: "var(--pos-qb)", RB: "var(--pos-rb)", WR: "var(--pos-wr)", TE: "var(--pos-te-strong)", PICK: "var(--pos-pick)",
  PG: "var(--hue-blue)", SG: "var(--hue-magenta)", SF: "var(--hue-aqua)", PF: "var(--hue-orange)", C: "var(--hue-violet)",
  G: "var(--hue-blue)", F: "var(--hue-aqua)",
};
const posPillColor = (pos) => POS_PILL_COLOR[pos] || "var(--series-blue)";
const POSITION_OPTIONS = POSITIONS.map((p) => ({ key: p, label: p }));

function PosBadge({ pos, rank }) {
  return (
    <span className="pos-badge" style={{ "--pos": posPillColor(pos) }}>
      {pos === "PICK" ? "PICK" : `${pos}${rank ?? ""}`}
    </span>
  );
}

function WeeklyScores({ players, data }) {
  const [view, setView] = useState("byWeek");
  // Open on the most recent week with results.
  const weeks = playedWeeks(data.scores);
  const latestWeek = weeks[weeks.length - 1] ?? 1;
  const [pickedWeek, setWeek] = useState(null);
  // Follow the latest week (it can change once live data arrives) until a
  // week is picked by hand.
  const week = pickedWeek ?? latestWeek;
  const [positionFilter, setPositionFilter] = useState("RB");

  const scores = data.scores[week];
  const byeTeams = useMemo(
    () => Object.keys(BYE_WEEKS).filter((team) => BYE_WEEKS[team] === week).sort(),
    [week]
  );

  const ranked = useMemo(() => {
    if (!scores) return [];
    return players
      .filter((p) => positionFilter === "ALL" || p.position === positionFilter)
      .filter((p) => !byeTeams.includes(p.team))
      .map((p) => ({ ...p, cell: weekCell(p, week, data), usage: data.details?.[week]?.[p.id] }))
      .filter((p) => ["score", "ir", "out"].includes(p.cell.type))
      // Scorers first by points, then players who sat out (IR before OUT).
      .sort((a, b) => {
        const rank = (c) => (c.type === "score" ? 0 : c.type === "ir" ? 1 : 2);
        return rank(a.cell) - rank(b.cell) || (b.cell.value ?? 0) - (a.cell.value ?? 0) || a.name.localeCompare(b.name);
      });
  }, [players, scores, week, positionFilter, byeTeams, data]);

  const onBye = useMemo(
    () => players.filter((p) => byeTeams.includes(p.team)),
    [players, byeTeams]
  );

  // Teams with a game this week that hasn't been played yet (live data only).
  const yetToPlay = data.teamsPlayed[week]
    ? Object.keys(BYE_WEEKS).filter((t) => !byeTeams.includes(t) && !data.teamsPlayed[week].includes(t)).sort()
    : [];

  return (
    <div className="flex flex-col gap-5">
      <header>
        <h2 className="text-2xl sm:text-3xl font-bold tracking-tight" style={{ color: "var(--text-primary)" }}>Weekly Scores</h2>
        <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>
          Every player in the database, by actual PPR fantasy points — one week at a time, or as a full
          Week 1-18 season grid with a running total.
        </p>
        <AboutData>
          {data.status === "live"
            ? <>Live from Sleeper's stats API (updated {data.updatedOn}), refreshed every time the page loads.</>
            : data.status === "loading"
              ? <>Loading live results from Sleeper… showing the saved {data.updatedOn} snapshot until then.</>
              : <>Couldn't reach Sleeper ({data.message}), so this is the saved {data.updatedOn} snapshot.</>}{" "}
          Weeks that haven't been played show nothing except byes and IR stints. A player who didn't play shows <strong>OUT</strong> instead of 0,
          or <strong>IR</strong> for weeks on injured reserve or PUP. IR runs through the earliest week the player can
          return (four games minimum), or the rest of the season for season-ending injuries.
        </AboutData>
      </header>

      <div className="flex items-center justify-between flex-wrap gap-3">
        <PillGroup options={WEEKLY_VIEWS} value={view} onChange={setView} />
        <PillGroup options={POSITION_OPTIONS} value={positionFilter} onChange={setPositionFilter} />
      </div>

      {view === "grid" ? (
        <SeasonGrid players={players} positionFilter={positionFilter} data={data} />
      ) : (
        <>
          <div>
            <PillGroup options={weeks.map((w) => ({ key: w, label: `Wk ${w}` }))} value={week} onChange={setWeek} scroll />
          </div>

          <div className="rounded-lg border px-3 py-2 text-sm" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
            <span className="font-medium" style={{ color: "var(--text-primary)" }}>Byes, Week {week}: </span>
            {byeTeams.length === 0 ? (
              <span style={{ color: "var(--text-muted)" }}>none — every team plays this week.</span>
            ) : (
              <span style={{ color: "var(--text-secondary)" }}>{byeTeams.join(", ")}</span>
            )}
            {yetToPlay.length > 0 && (
              <div className="mt-1">
                <span className="font-medium" style={{ color: "var(--text-primary)" }}>Still to play: </span>
                <span style={{ color: "var(--text-secondary)" }}>{yetToPlay.join(", ")}</span>
                <span style={{ color: "var(--text-muted)" }}> — their players are left blank until the game's in.</span>
              </div>
            )}
          </div>

          {!scores ? (
            <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", color: "var(--text-muted)" }}>
              Week {week} hasn't been played yet, so there are no real scores to show. Check the bye list above —
              that part of the season is already fixed regardless of what's happened on the field.
            </div>
          ) : (
            <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
              <table className="w-full border-collapse text-sm">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--border)" }}>
                    <th className="text-right px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>#</th>
                    <th className="text-left px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>Player</th>
                    <th className="text-left px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>Pos</th>
                    <th className="text-left px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>Team</th>
                    {/* Usage, from the live feed only (blank on the saved snapshot). */}
                    {[["Opp", "text-left"], ["Snap %", "text-right"], ["Tgt", "text-right"], ["Car", "text-right"]].map(([h, align]) => (
                      <th key={h} className={`${align} px-3 py-2 text-xs font-semibold hidden sm:table-cell`} style={{ color: "var(--text-muted)" }}>{h}</th>
                    ))}
                    <th className="text-right px-3 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>FPTS</th>
                  </tr>
                </thead>
                <tbody>
                  {ranked.map((p, i) => (
                    <tr key={p.id} className="border-b" style={{ borderColor: "var(--border)" }}>
                      <td className="px-3 py-2 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{p.cell.type === "score" ? i + 1 : ""}</td>
                      <td className="px-3 py-2"><PlayerLink id={p.id} name={p.name} pos={p.position}>{p.name}</PlayerLink></td>
                      <td className="px-3 py-2"><PosBadge pos={p.position} /></td>
                      <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{p.team}</td>
                      <td className="px-3 py-2 hidden sm:table-cell" style={{ color: "var(--text-secondary)" }}>{p.usage?.opp ? `vs ${p.usage.opp}` : ""}</td>
                      {["snap", "tgt", "car"].map((k) => (
                        <td key={k} className="px-3 py-2 text-right tabular-nums hidden sm:table-cell" style={{ color: "var(--text-secondary)" }}>
                          {p.usage && p.usage[k] != null ? `${p.usage[k]}${k === "snap" ? "%" : ""}` : ""}
                        </td>
                      ))}
                      <td className="px-3 py-2 text-right font-semibold tabular-nums"
                        style={{ color: p.cell.type === "score" ? "var(--text-primary)" : CELL_COLOR[p.cell.type] }}>
                        {p.cell.type === "score" ? p.cell.value.toFixed(1) : CELL_LABEL[p.cell.type]}
                      </td>
                    </tr>
                  ))}
                </tbody>
              </table>
            </div>
          )}

          {scores && onBye.length > 0 && (
            <div>
              <h3 className="text-sm font-semibold mb-1" style={{ color: "var(--text-primary)" }}>On bye this week</h3>
              <div className="flex flex-wrap gap-1.5">
                {onBye
                  .filter((p) => positionFilter === "ALL" || p.position === positionFilter)
                  .map((p) => (
                    <span key={p.id} className="rounded-full border px-2.5 py-1 text-xs"
                      style={{ borderColor: "var(--border)", color: "var(--text-muted)" }}>
                      <PlayerLink id={p.id} name={p.name} pos={p.position} className="">{p.name}</PlayerLink> <span style={{ color: "var(--text-muted)" }}>({p.team})</span>
                    </span>
                  ))}
              </div>
            </div>
          )}
        </>
      )}
    </div>
  );
}

/* ---------------- injured reserve page ---------------- */
// Everyone in INJURED_RESERVE, in two tables: IR/PUP stints ordered by the
// earliest week each player can return (soonest first), then season-ending
// injuries in their own section below.
function InjuryTable({ rows, showReturn }) {
  const headers = ["Player", "Pos", "Team", "Status", "Injury", "Since", ...(showReturn ? ["Earliest return"] : [])];
  return (
    <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <table className="w-full border-collapse text-sm">
        <thead>
          <tr style={{ borderBottom: "1px solid var(--border)" }}>
            {headers.map((h, i) => (
              <th key={h} className={`${i >= 5 ? "text-right" : "text-left"} px-3 py-2 text-xs font-semibold`}
                style={{ color: "var(--text-muted)" }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.map((r) => (
            <tr key={r.id} className="border-b" style={{ borderColor: "var(--border)" }}>
              <td className="px-3 py-2 whitespace-nowrap"><PlayerLink id={r.player.id} name={r.player.name} pos={r.player.position}>{r.player.name}</PlayerLink></td>
              <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{r.player.position}</td>
              <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{r.player.team}</td>
              <td className="px-3 py-2 whitespace-nowrap">
                <span className="rounded-full px-2 py-0.5 text-xs font-semibold border"
                  style={{ borderColor: "var(--border)", color: r.seasonEnding ? "var(--series-red)" : "var(--series-amber)" }}>
                  {r.seasonEnding ? "Out for season" : r.list}
                </span>
              </td>
              <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{r.injury}</td>
              <td className="px-3 py-2 text-right tabular-nums whitespace-nowrap" style={{ color: "var(--text-secondary)" }}>
                {r.sinceWeek === 1 ? "Preseason" : `Wk ${r.sinceWeek}`}

              {showReturn && (
                <td className="px-3 py-2 text-right tabular-nums whitespace-nowrap font-semibold" style={{ color: "var(--text-primary)" }}>
                  Wk {r.back}

              )}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

// Live: every player in the pool (plus the waiver targets) whose current
// Sleeper designation is Questionable, Doubtful, Out or not active. IR/PUP
// players are left to the hand-kept lists below. Sleeper's designations
// follow the official injury reports (Wednesday to Friday); early in the week
// they're carried over from the last game, which is why the latest game's
// result is shown alongside.
const REPORT_STATUSES = ["Questionable", "Doubtful", "Out", "NA"];
const REPORT_STATUS_LABEL = { NA: "Not active" };
const REPORT_STATUS_COLOR = {
  Questionable: "var(--series-amber)",
  Doubtful: "var(--series-red)",
  Out: "var(--series-red)",
  NA: "var(--text-muted)",
};

function InjuryReport({ players, positionFilter, data, sectionTitle }) {
  const [state, setState] = useState({ status: "loading", rows: [] });

  const pool = useMemo(() => {
    const { normalizeName } = window.SleeperScores;
    const key = (p) => `${normalizeName(p.name)}|${p.position}`;
    const known = new Set(players.map(key));
    return [...players, ...WAIVER_TARGETS.filter((t) => !known.has(key(t)))];
  }, [players]);

  useEffect(() => {
    let cancelled = false;
    fetchSleeperPlayerMap()
      .then((sleeperPlayers) => {
        if (cancelled) return;
        const matched = window.SleeperScores.matchSleeperIds(pool, sleeperPlayers);
        const rows = pool
          .filter((p) => matched[p.id])
          .map((p) => ({ player: p, sleeper: sleeperPlayers[matched[p.id]] }))
          .filter((r) => REPORT_STATUSES.includes(r.sleeper.status));
        setState({ status: "ready", rows });
      })
      .catch((err) => {
        if (!cancelled) setState({ status: "error", rows: [], message: err.message });
      });
    return () => { cancelled = true; };
  }, [pool]);

  const lastWeek = playedWeeks(data.scores).slice(-1)[0];
  const rows = state.rows
    .filter((r) => positionFilter === "ALL" || r.player.position === positionFilter)
    .sort((a, b) =>
      REPORT_STATUSES.indexOf(a.sleeper.status) - REPORT_STATUSES.indexOf(b.sleeper.status) ||
      a.player.name.localeCompare(b.player.name));

  // How the player's most recent week went: points, OUT, or blank if their
  // game hasn't been played yet.
  const lastGame = (p) => {
    if (!lastWeek) return "–";
    const cell = weekCell(p, lastWeek, data);
    if (cell.type === "score") return `${cell.value.toFixed(1)} pts`;
    return cell.type === "blank" ? "–" : CELL_LABEL[cell.type];
  };

  const headers = ["Player", "Pos", "Team", "Status", "Injury", lastWeek ? `Wk ${lastWeek}` : "Last game"];
  const message = (text) => (
    <div className="rounded-lg border p-6 text-center text-sm" style={{ borderColor: "var(--border)", color: "var(--text-muted)" }}>
      {text}
    </div>
  );

  return (
    <section className="flex flex-col gap-2">
      {sectionTitle("This Week's Injury Report", rows.length)}
      {state.status === "loading" ? message("Loading the latest designations from Sleeper…")
        : state.status === "error" ? message(`Couldn't reach Sleeper (${state.message}). The live injury report needs the page served over http(s).`)
        : rows.length === 0 ? message("No one at this position is questionable, doubtful or out right now.")
        : (
          <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
            <table className="w-full border-collapse text-sm">
              <thead>
                <tr style={{ borderBottom: "1px solid var(--border)" }}>
                  {headers.map((h, i) => (
                    <th key={h} className={`${i === 5 ? "text-right" : "text-left"} px-3 py-2 text-xs font-semibold`}
                      style={{ color: "var(--text-muted)" }}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {rows.map(({ player, sleeper }) => (
                  <tr key={player.id} className="border-b" style={{ borderColor: "var(--border)" }}>
                    <td className="px-3 py-2"><PlayerLink id={player.id} name={player.name} pos={player.position}>{player.name}</PlayerLink></td>
                    <td className="px-3 py-2"><PosBadge pos={player.position} /></td>
                    <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>{player.team}</td>
                    <td className="px-3 py-2 font-semibold" style={{ color: REPORT_STATUS_COLOR[sleeper.status] }}>
                      {REPORT_STATUS_LABEL[sleeper.status] || sleeper.status}
                    </td>
                    <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>
                      {[sleeper.injury, sleeper.notes].filter(Boolean).join(" — ") || "Undisclosed"}
                    </td>
                    <td className="px-3 py-2 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{lastGame(player)}</td>
                  </tr>
                ))}
              </tbody>
            </table>
          </div>
        )}
      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        Official injury reports come out Wednesday through Friday. Until then, a designation may be carried over
        from the last game, so the last column shows how that game went.
      </p>
    </section>
  );
}

function InjuredReserve({ players, reportPlayers, data }) {
  const [positionFilter, setPositionFilter] = useState("ALL");

    const byName = (a, b) => a.player.name.localeCompare(b.player.name);
    return {
      onIr: rows.filter((r) => !r.seasonEnding).sort((a, b) => a.back - b.back || byName(a, b)),

        <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>

        </p>
        <AboutData>
          The weekly injury report is live from Sleeper. The IR lists are as of {INJURED_RESERVE_UPDATED_ON}, from
          Sleeper&apos;s injury designations and team news. "Earliest return" is the
          first week the player is eligible to come back, counting four team games from the start of the stint and
          skipping byes; many players take longer. Edit <code>INJURED_RESERVE</code> in <code>index.html</code> as
          players are placed on or activated from IR.
        </AboutData>
      </header>

      <div>
        <PillGroup options={POSITION_OPTIONS} value={positionFilter} onChange={setPositionFilter} />

      <section className="flex flex-col gap-2">

/* ---------------- dynasty values (live) ---------------- */
// League settings shared by the dynasty tabs. FantasyCalc serves a separate
// value set for each mode / QB format / league size / scoring combination;
// TE premium isn't one of its options, so that's applied on top here (see
// applyTePremium). Saved per browser.
const DYNASTY_SETTINGS_KEY = "ff-valuediff:dynasty-settings-v1";
const DEFAULT_DYNASTY_SETTINGS = { mode: "dynasty", qb: "sf", teams: 12, ppr: 1, tep: 0, raw: false };
const SETTING_OPTIONS = {
  mode: [{ key: "dynasty", label: "Dynasty" }, { key: "redraft", label: "Redraft" }],
  qb: [{ key: "1qb", label: "1QB" }, { key: "sf", label: "Superflex" }],
  teams: [8, 10, 12, 14, 16].map((n) => ({ key: n, label: n === 16 ? "16+" : String(n) })),
  ppr: [{ key: 1, label: "PPR" }, { key: 0.5, label: "Half" }, { key: 0, label: "Std" }],
  tep: [{ key: 0, label: "No TEP" }, { key: 0.5, label: "+0.5" }, { key: 1, label: "+1.0" }, { key: 1.5, label: "+1.5" }],
};
const SETTING_LABELS = { mode: "Format", qb: "QB", teams: "Teams", ppr: "Scoring", tep: "TE premium" };

function readSavedSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(DYNASTY_SETTINGS_KEY) || "null");
    if (saved) return { ...DEFAULT_DYNASTY_SETTINGS, ...saved };
    // Carry over the 1QB/Superflex choice saved before there were more settings.
    if (localStorage.getItem("ff-valuediff:dynasty-format") === "1qb") return { ...DEFAULT_DYNASTY_SETTINGS, qb: "1qb" };
  } catch (e) {}
  return DEFAULT_DYNASTY_SETTINGS;
}

// "12-team PPR Superflex dynasty, TE premium +0.5"
function describeSettings(s) {
  const tep = s.tep ? `, TE premium +${s.tep}` : "";
  const scoring = { 1: "PPR", 0.5: "half-PPR", 0: "standard" }[s.ppr];
  return `${s.teams >= 16 ? "16+" : s.teams}-team ${scoring} ${s.qb === "sf" ? "Superflex" : "1QB"} ${s.mode}${tep}`;
}

// FantasyCalc only goes up to 14 teams, so bigger leagues use its 14-team values.
const apiSettingsKey = (s) => `${s.mode}-${s.qb}-${Math.min(s.teams, 14)}-${s.ppr}`;
const DYNASTY_CACHE_KEY = (key) => `ff-valuediff:dynasty-values-v3:${key}`;
const DYNASTY_CACHE_TTL_MS = 2 * 60 * 60 * 1000;
// The baked snapshot is 12-team PPR dynasty; other settings fall back to it
// (flagged as approximate) until their own values load.
const isBakedSettings = (s) => s.mode === "dynasty" && Math.min(s.teams, 14) === 12 && s.ppr === 1;

const expandDynastyRows = (rows) =>
  (rows || []).map((r) => Object.fromEntries(DYNASTY_FIELDS.map((k, i) => [k, r[i]])));

// A counter that ticks when the tab comes back into view and every
// `intervalMs` while it's visible, so live data can re-check its cache while
// a page is left open. Hooks put it in their effect deps.
const REFRESH_INTERVAL_MS = 30 * 60 * 1000;
function useRefreshTick(intervalMs = REFRESH_INTERVAL_MS) {
  const [tick, setTick] = useState(0);
  useEffect(() => {
    const bump = () => { if (document.visibilityState === "visible") setTick((t) => t + 1); };
    const timer = setInterval(bump, intervalMs);
    document.addEventListener("visibilitychange", bump);
    return () => { clearInterval(timer); document.removeEventListener("visibilitychange", bump); };
  }, [intervalMs]);
  return tick;
}

// Starts from the baked DYNASTY_VALUES snapshot, then pulls fresh values from
// FantasyCalc (shared logic in scripts/lib/fantasycalc.js), cached per
// settings combination in localStorage for 2 hours. A page left open re-checks
// on useRefreshTick and swaps in new values quietly, keeping the old ones on
// screen meanwhile. `enabled: false` skips the fetch (and just returns the
// snapshot).
function useDynastyValues(settings, { enabled = true } = {}) {
  const key = apiSettingsKey(settings);
  const baked = useMemo(() => expandDynastyRows(DYNASTY_VALUES[settings.qb]), [settings.qb]);
  const exact = isBakedSettings(settings);
  const [data, setData] = useState({ rows: baked, status: "loading", updatedOn: DYNASTY_VALUES_UPDATED_ON, approximate: !exact });
  const tick = useRefreshTick();
  // The settings key whose live values are on screen, if any.
  const liveKey = useRef(null);

  useEffect(() => {
    if (!enabled) return;
    let cancelled = false;
    try {
      const cached = JSON.parse(localStorage.getItem(DYNASTY_CACHE_KEY(key)) || "null");
      if (cached && Date.now() - cached.fetchedAt < DYNASTY_CACHE_TTL_MS) {
        if (liveKey.current === key) return; // already showing these
        liveKey.current = key;
        setData({ rows: cached.rows, status: "live", updatedOn: new Date(cached.fetchedAt).toLocaleString(), approximate: false });
        return;
      }
    } catch (e) {}

    // A background refresh keeps the current live values up until new ones land.
    const refreshing = liveKey.current === key;
    if (!refreshing) {
      liveKey.current = null;
      setData({ rows: baked, status: "loading", updatedOn: DYNASTY_VALUES_UPDATED_ON, approximate: !exact });
    }
    if (!window.FantasyCalc) {
      setData((d) => ({ ...d, status: "error", message: "scripts/lib/fantasycalc.js didn't load" }));
      return;
    }
    window.FantasyCalc.fetchValues({
      dynasty: settings.mode === "dynasty", superflex: settings.qb === "sf", teams: settings.teams, ppr: settings.ppr,
    })
      .then((rows) => {
        if (cancelled) return;
        try {
          localStorage.setItem(DYNASTY_CACHE_KEY(key), JSON.stringify({ fetchedAt: Date.now(), rows }));
        } catch (e) {}
        liveKey.current = key;
        setData({ rows, status: "live", updatedOn: new Date().toLocaleString(), approximate: false });
      })
      .catch((err) => {
        // A failed background refresh just leaves the last live values up.
        if (!cancelled && !refreshing) setData((d) => ({ ...d, status: "error", message: err.message }));
      });
    return () => { cancelled = true; };
  }, [key, baked, enabled, tick]);

  const market = useMemo(() => applyMarketValues(data.rows, settings), [data.rows, settings.mode, settings.qb]);
  const tepRows = useMemo(() => applyTePremium(market.rows, settings.tep), [market.rows, settings.tep]);
  return { ...data, rows: tepRows, settings, source: market.source, sourceUpdatedOn: market.updatedOn };
}

// Default values: KeepTradeCut's (data/market-values.js, baked daily from
// Dynasty Daddy), on FantasyCalc's player list. Dynasty uses KTC's dynasty
// values, with its redraft values as redraftValue; redraft uses KTC redraft
// for both. KTC has no league-size or scoring options, so those settings only
// change the fallbacks. Players KTC doesn't list keep FantasyCalc's value,
// rescaled to KTC's scale by the KTC ÷ FantasyCalc ratio of the players
// nearest them in value. FantasyCalc's "2027 1st" is KTC's mid 1st. KTC's
// 30-day change replaces FantasyCalc's trend where it has one. FantasyCalc's
// own values stay on each row (fcValue, fcRedraftValue) for the trade
// calculator's consensus. Without the baked file, FantasyCalc's values stand.
const VALUE_SOURCE = { key: "ktc", label: "KeepTradeCut", url: "https://keeptradecut.com/trade-calculator" };
const RESCALE_NEIGHBORS = 10;

// fc → market-scale value, from [fcValue, marketValue] pairs of listed players.
function marketRescaler(pairs) {
  const sorted = pairs.filter(([f, m]) => f > 0 && m > 0).sort((a, b) => a[0] - b[0]);
  if (sorted.length < RESCALE_NEIGHBORS) return null;
  return (fc) => {
    let lo = 0, hi = sorted.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (sorted[mid][0] < fc) lo = mid + 1; else hi = mid; }
    const from = Math.max(0, Math.min(lo - RESCALE_NEIGHBORS / 2, sorted.length - RESCALE_NEIGHBORS));
    const ratios = sorted.slice(from, from + RESCALE_NEIGHBORS).map(([f, m]) => m / f).sort((a, b) => a - b);
    return Math.round(fc * ratios[RESCALE_NEIGHBORS >> 1]);
  };
}

// Best first, with overall and position ranks to match (picks keep theirs).
function rankRows(rows) {
  const posCount = {};
  return [...rows].sort((a, b) => b.value - a.value).map((r, i) => ({
    ...r,
    overallRank: i + 1,
    posRank: r.position === "PICK" ? r.posRank : (posCount[r.position] = (posCount[r.position] || 0) + 1),
  }));
}

function applyMarketValues(rows, settings) {
  const bundle = window.MARKET_VALUES;
  const dynasty = settings.mode === "dynasty";
  const main = bundle?.values[dynasty ? "ktc" : "ktcRedraft"]?.[settings.qb];
  if (!main) return { rows, source: null };
  const redraft = bundle.values.ktcRedraft?.[settings.qb] || {};
  const trends = (dynasty && bundle.trends?.ktc?.[settings.qb]) || {};
  const pairs = (vals, field) =>
    rows.filter((r) => r.position !== "PICK" && vals[r.id] && r[field] > 0).map((r) => [r[field], vals[r.id]]);
  const scaleMain = marketRescaler(pairs(main, "value"));
  const scaleRedraft = marketRescaler(pairs(redraft, "redraftValue"));
  if (!scaleMain) return { rows, source: null };

  const out = rows.map((r) => {
    const listed = main[r.position === "PICK" ? marketPickKey(r.name) : r.id];
    const value = listed ?? scaleMain(r.value);
    const rv = r.position === "PICK" ? null : redraft[r.id];
    return {
      ...r, value, fcValue: r.value, fcRedraftValue: r.redraftValue, ktcListed: listed != null,
      redraftValue: !dynasty ? value
        : rv ?? (r.redraftValue != null && scaleRedraft ? scaleRedraft(r.redraftValue) : r.redraftValue),
      trend30: trends[r.id] ?? r.trend30,
    };
  });
  return { rows: rankRows(out), source: VALUE_SOURCE, updatedOn: bundle.updatedOn };
}

// TE premium: neither KTC's baked values nor FantasyCalc's have TE premium, so
// this estimates it (on both, fcValue included).
// A bonus per TE catch helps high-volume TEs most, so the boost scales with
// how good the TE is: the top TE gets the full boost, a fringe TE about half.
// Boosts per +0.5 / +1.0 / +1.5 points per catch are this app's own estimate
// (in line with how much TE premium lifts TEs on KTC and DynastyDaddy).
const TEP_BOOST = { 0.5: 0.10, 1: 0.20, 1.5: 0.30 };

function applyTePremium(rows, tep) {
  const boost = TEP_BOOST[tep];
  if (!boost) return rows;
  const topTe = Math.max(1, ...rows.filter((r) => r.position === "TE").map((r) => r.value));
  return rankRows(rows.map((r) => {
    if (r.position !== "TE") return r;
    const lift = 1 + boost * (0.5 + 0.5 * (r.value / topTe));
    return { ...r, value: Math.round(r.value * lift), fcValue: r.fcValue != null ? Math.round(r.fcValue * lift) : r.fcValue };
  }));
}

// Live Sleeper designations (Questionable, Out, IR…) by Sleeper player_id —
// the same id dynasty rows use, so no name matching is needed. Reuses the
// cached /players/nfl map behind the trending panel and injury report.
function useSleeperStatuses() {
  const [map, setMap] = useState({});
  useEffect(() => {
    let cancelled = false;
    fetchSleeperPlayerMap().then((m) => { if (!cancelled) setMap(m); }).catch(() => {});
    return () => { cancelled = true; };

  return map;
}

function DynastyStatusLine({ data }) {
  const what = describeSettings(data.settings);
  const tep = data.settings.tep ? " TE premium is this app's estimate on top of those values." : "";
  const snapshot = data.approximate
    ? <>the saved {data.updatedOn} snapshot of 12-team PPR dynasty values, not your exact settings</>
    : <>the saved {data.updatedOn} snapshot</>;
  const fc = data.status === "live" ? <>live from FantasyCalc for {what} leagues (updated {data.updatedOn})</>
    : data.status === "loading" ? <>loading from FantasyCalc, {snapshot} until then</>
    : <>FantasyCalc's {snapshot}, since it couldn't be reached ({data.message})</>;
  if (data.source) {
    return (
      <>
        Values are <a href={data.source.url} target="_blank" rel="noopener noreferrer" className="underline">{data.source.label}</a>'s
        {" "}{data.settings.qb === "sf" ? "Superflex" : "1QB"} {data.settings.mode} values (updated {data.sourceUpdatedOn}, via Dynasty
        Daddy). KTC doesn't change them for league size or scoring. Players KTC doesn't list use FantasyCalc's value, rescaled to
        KTC's scale; the player list itself is {fc}.{tep}
      </>
    );
  }
  if (data.status === "live") return <>Live from FantasyCalc for {what} leagues (updated {data.updatedOn}), rechecked every 2 hours.{tep}</>;
  return data.status === "loading"
    ? <>Loading {what} values from FantasyCalc… showing {snapshot} until then.{tep}</>
    : <>Couldn't reach FantasyCalc ({data.message}), so this is {snapshot}.{tep}</>;
}

// Segmented control: one rounded track per group of options, with a
// highlight that slides to the selected option (measured from the DOM, so it
// also works when a long group like the week list wraps). Every group fills
// with its page's color (--page-accent), so a page's controls all match; only
// the Football | Basketball switches pass `sportColors` to use each option's
// own color. `scroll` keeps a long row (week pickers) on one line that scrolls
// sideways instead of wrapping, with the selected option scrolled into view.
function PillGroup({ options, value, onChange, scroll = false, sportColors = false }) {
  const fill = (o) => (sportColors && o?.color) || "var(--page-accent, var(--sport))";
  const trackRef = useRef(null);
  const [indicator, setIndicator] = useState(null);
  const activeIndex = options.findIndex((o) => o.key === value);

  React.useLayoutEffect(() => {
    const track = trackRef.current;
    if (!track) return;
    const measure = () => {
      const btn = track.querySelectorAll("button.seg")[activeIndex];
      setIndicator(btn ? { left: btn.offsetLeft, top: btn.offsetTop, width: btn.offsetWidth, height: btn.offsetHeight } : null);
    };
    measure();
    const btn = track.querySelectorAll("button.seg")[activeIndex];
    if (scroll && btn && track.scrollWidth > track.clientWidth) {
      track.scrollLeft = btn.offsetLeft - (track.clientWidth - btn.offsetWidth) / 2;
    }
    if (typeof ResizeObserver === "undefined") return;
    const ro = new ResizeObserver(measure);
    ro.observe(track);
    return () => ro.disconnect();
  }, [activeIndex, options.length]);

  return (
    <div ref={trackRef} className={`segmented${scroll ? " segmented-scroll" : ""}`} role="group">
      {indicator && (
        <span className="seg-indicator" aria-hidden="true"
          style={{
            transform: `translate(${indicator.left}px, ${indicator.top}px)`, width: indicator.width, height: indicator.height,
            "--pill-accent": fill(options[activeIndex]),
          }} />
      )}
      {options.map((o) => (
        <button key={o.key} type="button" onClick={() => onChange(o.key)} className="seg" aria-pressed={value === o.key}
          style={{ "--pill-accent": fill(o) }}>
          {o.label}
        </button>
      ))}
    </div>
  );
}

const inputStyle = { borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-primary)" };

const fmtValue = (v) => (v == null ? "–" : v.toLocaleString());

// Rough contender/rebuilder lean from how FantasyCalc's redraft value (this
// season only) compares with dynasty value (this season and beyond). Only
// for players worth a real roster spot: deep bench players' redraft values
// are mostly 0, which says nothing. A redraft value of 0 also covers players
// out for the season, whose value really is all future.
function dynastyWindow(r) {
  if (r.position === "PICK" || r.value < 1500 || r.redraftValue == null) return null;
  if (r.redraftValue >= r.value * 1.15) return "Win-now";
  if (r.redraftValue < r.value * 0.5 && r.age <= 25) return "Future";
  return null;
}
const WINDOW_COLOR = { "Win-now": "var(--hue-orange)", Future: "var(--hue-violet)" };

const DYNASTY_SORTS = { value: (a, b) => b.value - a.value, age: (a, b) => (a.age ?? 99) - (b.age ?? 99), trend: (a, b) => b.trend30 - a.trend30 };

/* ---------------- draft board ---------------- */
// A Sleeper-style draft board "drafted" straight down a value list: 1.01 is
// the most valuable player, and so on, snaking (or not) across one column per
// team. Football and basketball each feed it their own players and values.
const SLEEPER_POS_COLOR = {
  QB: "#ff2a6d", RB: "#00ceb8", WR: "#58a7ff", TE: "#ffae58", PICK: "#b98cff",
  PG: "#58a7ff", SG: "#00ceb8", SF: "#ffae58", PF: "#ff2a6d", C: "#b98cff", G: "#58a7ff", F: "#ffae58",
};
const BOARD_ORDER_OPTIONS = [{ key: "snake", label: "Snake" }, { key: "linear", label: "Linear" }];
const roundOptions = (ns) => ns.map((n) => ({ key: n, label: String(n) }));

// "Amon-Ra St. Brown" → ["Amon-Ra", "St. Brown"]
function splitName(name) {
  const i = name.indexOf(" ");
  return i < 0 ? ["", name] : [name.slice(0, i), name.slice(i + 1)];
}

// The board itself plus its Rounds / Order / Highlight / search controls.
// `players` must already be sorted best first; `stat(p)` is the number shown
// in each card's corner and `tip(p)` the hover text; `matchPos(p, pos)` says
// whether a player counts for the Highlight filter. `extraControls` go in the
// controls row before Highlight.
function BoardGrid({ sport, players, teams, roundChoices, defaultRounds, highlightOptions, matchPos, stat, tip, extraControls }) {
  const [pickedRounds, setRounds] = useState(defaultRounds);
  const rounds = roundChoices.some((o) => o.key === pickedRounds) ? pickedRounds : defaultRounds;
  const [order, setOrder] = useState("snake");
  const [pickedHighlight, setHighlight] = useState("ALL");
  const highlight = highlightOptions.some((o) => o.key === pickedHighlight) ? pickedHighlight : "ALL";
  const [query, setQuery] = useState("");

  // One { label, player } per pick, in board order (row by row).
  const cells = useMemo(() => {
    const out = [];
    for (let round = 0; round < rounds; round++) {
      const row = Array(teams);
      for (let slot = 0; slot < teams; slot++) {
        const col = order === "snake" && round % 2 === 1 ? teams - 1 - slot : slot;
        row[col] = { label: `${round + 1}.${String(slot + 1).padStart(2, "0")}`, player: players[round * teams + slot] || null };
      }
      out.push(...row);
    }
    return out;
  }, [players, rounds, teams, order]);

  // A new board (rounds, order, teams, picks on/off) starts back at 1.01.
  const boardRef = useRef(null);
  useEffect(() => { boardRef.current?.scrollTo(0, 0); }, [cells]);

  const q = query.trim().toLowerCase();

  return (
    <>
      <div className="flex items-end flex-wrap gap-x-4 gap-y-2">
        <LabeledControl label="Rounds"><PillGroup options={roundChoices} value={rounds} onChange={setRounds} /></LabeledControl>
        <LabeledControl label="Order"><PillGroup options={BOARD_ORDER_OPTIONS} value={order} onChange={setOrder} /></LabeledControl>
        {extraControls}
        <LabeledControl label="Highlight"><PillGroup options={highlightOptions} value={highlight} onChange={setHighlight} /></LabeledControl>
        <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Find a player"
          className="rounded-md border px-3 py-1.5 text-sm w-full sm:w-48 sm:ml-auto" style={inputStyle} />
      </div>

      <div className="draft-board" ref={boardRef}>
        <div className="draft-grid" style={{ gridTemplateColumns: `repeat(${teams}, minmax(86px, 1fr))` }}>
          {Array.from({ length: teams }, (_, t) => (
            <div key={`h${t}`} className="db-head">Team {t + 1}<span>Pick {t + 1}</span></div>
          ))}
          {cells.map(({ label, player: p }) => {
            if (!p) return <div key={label} className="db-cell empty"><span className="db-pick">{label}</span></div>;
            const [first, last] = splitName(p.name);
            const dim = highlight !== "ALL" && !matchPos(p, highlight);
            const hit = q && p.name.toLowerCase().includes(q);
            return (
              <a key={label} href={playerHash(sport, p.id)} onClick={() => window.scrollTo(0, 0)}
                className={`db-cell${dim ? " dim" : ""}${hit ? " hit" : ""}`}
                style={{ "--db-pos": SLEEPER_POS_COLOR[p.position] }} title={`${label} · ${tip(p)}`}>
                <span className="db-pick">{label}</span>
                <span className="db-first">{first}</span>
                <span className="db-last">{last}</span>
                <span className="db-meta">
                  <span>{p.position === "PICK" ? "PICK" : `${p.position}-${p.team || "FA"}`}</span>
                  <span>{stat(p)}</span>
                </span>
              </a>
            );
          })}
        </div>
      </div>
    </>
  );
}

// Football: the Value Board's values (KeepTradeCut by default) for the shared
// league settings, so it updates whenever they do. Dynasty boards can mix in
// rookie picks (on by default, with a toggle to leave them off). Dynasty
// startups run deep, so dynasty boards go to 30 rounds.
const BOARD_HIGHLIGHT_OPTIONS = ["ALL", "QB", "RB", "WR", "TE"].map((p) => ({ key: p, label: p }));
const BOARD_PICK_HIGHLIGHT = { key: "PICK", label: "Picks" };
const BOARD_PICKS_OPTIONS = [{ key: "on", label: "On" }, { key: "off", label: "Off" }];

// The picks a startup would draft: Early/Mid/Late picks where FantasyCalc
// values them by slot, the plain round pick only for years it doesn't.
function boardPicks(rows) {
  const picks = rows.filter((r) => r.position === "PICK").map((r) => ({ r, p: window.FantasyCalc?.parsePick(r.name) }));
  const slotted = new Set(picks.filter(({ p }) => p?.slot).map(({ p }) => `${p.year}-${p.round}`));
  return picks.filter(({ p }) => !p || p.slot || !slotted.has(`${p.year}-${p.round}`)).map(({ r }) => r);
}
const FOOTBALL_ROUNDS = { dynasty: roundOptions([10, 15, 20, 25, 30]), redraft: roundOptions([5, 10, 15, 20]) };
