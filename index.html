// Catches a crash while drawing one room (say, a malformed row from a live
// feed), so it shows a message in place of that room instead of blanking the
// whole site. Keyed by page, so opening another room starts fresh.
class RoomBoundary extends React.Component {
  constructor(props) {
    super(props);
    this.state = { error: null };
  }
  static getDerivedStateFromError(error) {
    return { error };
  }
  componentDidCatch(error, info) {
    console.error(`[FFO] ${this.props.room} crashed:`, error, info.componentStack);
  }
  render() {
    if (!this.state.error) return this.props.children;
    return (
      <div role="alert" className="rounded-lg border p-6 flex flex-col gap-3 items-start" style={{ borderColor: "var(--series-red)", background: "var(--surface-1)" }}>
        <h2 className="text-lg font-semibold" style={{ color: "var(--text-primary)" }}>The {this.props.room} hit a problem</h2>
        <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
          Something in this room's data didn't load the way it expected. The rest of the site still works. Reloading
          usually fixes it; if not, the live data it reads may be having a bad moment.
        </p>
        <p className="text-xs font-mono" style={{ color: "var(--text-muted)" }}>{String(this.state.error.message || this.state.error)}</p>
        <div className="flex gap-2">
          <button type="button" onClick={() => window.location.reload()} className="btn-primary rounded-lg px-4 py-2 text-sm font-semibold">Reload</button>
          <button type="button" onClick={this.props.onHome} className="btn-secondary rounded-lg px-4 py-2 text-sm font-semibold">Go to the Lobby</button>
        </div>
      </div>
    );
  }
}

function App() {
  const [page, navigate] = useRoute();
  const [sport, setSport] = useSport(page);
  const [theme, toggleTheme] = useTheme();
  const players = samplePlayers;
  const rawScores = useLiveScores(players);
  // League settings are shared by every dynasty tab and remembered per browser.
  const [settings, setSettings] = useState(readSavedSettings);
  useEffect(() => {
    try { localStorage.setItem(DYNASTY_SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }, [settings]);
  const dynasty = useDynastyValues(settings);
  const sleeperPlayers = useSleeperStatuses(true);
  const resolveNflId = useMemo(() => nflIdResolver(sleeperPlayers), [sleeperPlayers]);
  // The scores, with teams and the IR list kept current from Sleeper (the IR
  // list drives the IR cells too).
  const liveScores = useMemo(() => {
    const pool = withCurrentTeams(rawScores.players, sleeperPlayers, resolveNflId);
    const injured = mergeInjuredList({ pool, scores: rawScores.scores, sleeperPlayers, resolve: resolveNflId });
    return { ...rawScores, players: pool, injured, injuredById: Object.fromEntries(injured.map((r) => [r.id, r])) };
  }, [rawScores, sleeperPlayers, resolveNflId]);
  const currentPlayers = useMemo(() => withCurrentTeams(players, sleeperPlayers, resolveNflId), [players, sleeperPlayers, resolveNflId]);
  // The 2027 class is about rookie picks, which only exist in dynasty values,
  // so in redraft mode it loads the dynasty set separately.
  const classSettings = useMemo(() => ({ ...settings, mode: "dynasty", tep: 0 }), [settings]);
  const classValues = useDynastyValues(classSettings, { enabled: settings.mode !== "dynasty" });
  // Basketball: loaded the first time a basketball page opens.
  const [nbaSettings, setNbaSettings] = useState(readSavedNbaSettings);
  useEffect(() => {
    try { localStorage.setItem(NBA_SETTINGS_KEY, JSON.stringify(nbaSettings)); } catch (e) {}
  }, [nbaSettings]);
  const current = PAGE_BY_KEY[page];
  // The player search can ask for basketball data from a football page.
  const [searchOpen, setSearchOpen] = useState(false);
  useSearchShortcut(() => setSearchOpen(true));
  const [nbaWanted, setNbaWanted] = useState(false);
  const nba = useNbaData(current.sport === "nba" || nbaWanted);
  const nbaProps = { data: nba, settings: nbaSettings, setSettings: setNbaSettings };
  const myLeague = useMyLeagueState();
  const alerts = useRosterAlerts(myLeague, { nfl: sleeperPlayers, nba: nba.status === "live" ? nba.players : null });

  return (
    <NflIdContext.Provider value={resolveNflId}>
    <MyLeagueContext.Provider value={myLeague}>
    <div className="has-tab-bar min-h-screen flex flex-col">
      {/* An in-page jump, not a link: the hash is the router's. */}
      <a href="#main" className="skip-link" onClick={(e) => { e.preventDefault(); document.getElementById("main")?.focus(); }}>Skip to content</a>
      <SiteHeader page={page} navigate={navigate} sport={sport} setSport={setSport} theme={theme} toggleTheme={toggleTheme}
        onSearch={() => setSearchOpen(true)} alerts={alerts} />
      {/* Each page's own color (its folder and nav color) fills its controls. */}
      <main id="main" tabIndex={-1} className="flex-1 w-full max-w-6xl mx-auto px-4 py-8 flex flex-col gap-2 outline-none" style={{ "--page-hue": PAGE_STYLE[page]?.hue }}>
        {current.group && (
          <p className="text-xs font-semibold uppercase tracking-wider" style={{ color: PAGE_STYLE[page].hue }}>
            {current.short} <span style={{ color: "var(--text-muted)" }}>· {SPORT_LABEL[current.sport]} · {current.group}</span>
          </p>
        )}
        <RoomBoundary key={page} room={current.short} onHome={() => navigate("home")}>
        {page === "home" && <HomePage navigate={navigate} scores={liveScores} dynasty={dynasty} sport={sport} setSport={setSport} />}
        {page === "weekly" && <WeeklyScores players={liveScores.players} data={liveScores} />}
        {page === "waivers" && <WaiverTargets scores={liveScores} sleeperPlayers={sleeperPlayers} values={dynasty.rows} />}
        {page === "injuries" && <InjuredReserve players={currentPlayers} reportPlayers={liveScores.players} data={liveScores} />}
        {page === "nfl-rankings" && <NflRankings settings={settings} setSettings={setSettings} scores={liveScores} />}
        {page === "leagues" && <MyLeagues settings={settings} setSettings={setSettings} navigate={navigate} />}
        {page === "draftboard" && <DraftBoard data={dynasty} settings={settings} setSettings={setSettings} />}
        {page === "player" && <NflProfile dynasty={dynasty} settings={settings} />}
        {page === "trade" && <TradeCalculator data={dynasty} settings={settings} setSettings={setSettings} />}
        {page === "class2027" && (
          <DynastyClass2027 data={settings.mode === "dynasty" ? dynasty : classValues} settings={settings} setSettings={setSettings} />
        )}
        {page === "prospect" && <ProspectProfile data={settings.mode === "dynasty" ? dynasty : classValues} settings={settings} />}
        {current.sport === "nba" && (
          <NbaGate data={nba}>
            {page === "nba-weekly" && <NbaScoreboard {...nbaProps} />}
            {page === "nba-waivers" && <NbaWaivers {...nbaProps} />}
            {page === "nba-injuries" && <NbaInjuries {...nbaProps} />}
            {page === "nba-leagues" && <NbaLeagues {...nbaProps} />}
            {page === "nba-rankings" && <NbaRankings {...nbaProps} />}
            {page === "nba-draftboard" && <NbaDraftBoard {...nbaProps} />}
            {page === "nba-player" && <NbaProfile {...nbaProps} />}
            {page === "nba-trade" && <NbaTrade {...nbaProps} />}
          </NbaGate>
        )}
        </RoomBoundary>
      </main>
      <SiteFooter navigate={navigate} />
      <MobileTabBar sport={sport} page={page} navigate={navigate} />
      {searchOpen && (
        <PlayerSearch sport={sport} dynasty={dynasty} sleeperPlayers={sleeperPlayers} nba={nba}
          onNeedNba={() => setNbaWanted(true)} onClose={() => setSearchOpen(false)} />
      )}
    </div>
    </MyLeagueContext.Provider>
    </NflIdContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
