}

/* ---------------- trade calculator ---------------- */
// How a trade is judged when it isn't one-for-one, blending the two ways the
// big market calculators handle it:
//
// a) Stud adjustment (KeepTradeCut / DynastyDaddy style). Every asset counts
//    toward its side's "trade score" at 20-40% of its value — more the closer
//    it is to the best asset in this trade and to the best asset in the
//    league — so a pile of filler can't add up to a star. The side with the
//    lower score is then "behind by" the value of the one extra player it
//    would need to catch up.
// b) Roster-spot credit (FantasyCalc style). The side getting fewer players
//    can fill each open roster spot from waivers, so it's credited with the
//    value of the player it would pick up: about the (teams × 25)th-best
//    player, a slightly better one for each extra spot. Bigger leagues have
//    worse free agents, so the credit shrinks and depth matters more.
//
// The constants were tuned against reference trades (a 2-for-1 of equal
// value favors the 1 side by ~15-20% in a 12-team league; four mid players
// don't beat a star on volume), landing between FantasyCalc (credit only)
// and KTC (a much steeper stud premium). They're this app's own rule of
// thumb, not any site's exact formula.
const TRADE_FORMULA = {
  floor: 0.2, trade: 0.1, tradeExp: 3, overall: 0.1, overallExp: 3,
  rosterSpots: 25, // roster spots per team, to find the waiver-level player
  spotStep: 10,    // each extra spot, the pickup is this many ranks better
};
// "Fair" within 5% of the bigger side (or 250 value, for small trades);
// "slightly favors" up to 15%.
const TRADE_FAIR_PCT = 0.05;
const TRADE_FAIR_MIN = 250;
const TRADE_SLIGHT_PCT = 0.15;
const TRADE_SIDES = ["A", "B"];
const SIDE_COLOR = { A: "var(--hue-blue)", B: "var(--hue-orange)" };

const sumOf = (values) => values.reduce((s, v) => s + v, 0);

// Share of an asset's value that counts toward its side's trade score.
const studShare = (p, best, top) =>
  TRADE_FORMULA.floor + TRADE_FORMULA.trade * Math.pow(p / best, TRADE_FORMULA.tradeExp) +
  TRADE_FORMULA.overall * Math.pow(p / top, TRADE_FORMULA.overallExp);

const tradeScore = (values, best, top) => values.reduce((s, p) => s + p * studShare(p, best, top), 0);

// Rank and value of the waiver-level player for the k-th open roster spot.
function replacementPlayer(playerValues, teams, k = 1, spots = TRADE_FORMULA.rosterSpots) {
  const rank = Math.max(1, Math.min(teams * spots - (k - 1) * TRADE_FORMULA.spotStep, playerValues.length));
  return { rank, value: playerValues[rank - 1] || 0 };
}

// sideValues: [[values A gets], [values B gets]].
// ctx: { topValue, playerValues (non-pick values, best first), teams, raw,
//        rosterSpots (default 25), fairMin (default TRADE_FAIR_MIN) }.
function evaluateTrade(sideValues, ctx) {
  const sums = sideValues.map(sumOf);
  const stud = [0, 0];
  const credit = [0, 0];
  const complete = sideValues[0].length > 0 && sideValues[1].length > 0;

  if (complete && !ctx.raw) {
    const best = Math.max(...sideValues[0], ...sideValues[1]);
    const scores = sideValues.map((v) => tradeScore(v, best, ctx.topValue));
    const ahead = scores[0] >= scores[1] ? 0 : 1;
    const behind = 1 - ahead;
    // Value of the one extra player the side behind would need to catch up
    // (found by bisection, as KTC does — the extra player can change which
    // asset is the best in the trade).
    let lo = 0, hi = ctx.topValue * 3;
    for (let i = 0; i < 40; i++) {
      const m = (lo + hi) / 2;
      const vals = [...sideValues[behind], m];
      tradeScore(vals, Math.max(best, m), ctx.topValue) < scores[ahead] ? (lo = m) : (hi = m);
    }
    const needed = (lo + hi) / 2;
    // Shown as a positive adjustment on whichever side makes the adjusted
    // totals differ by exactly `needed`.
    const extra = needed - (sums[ahead] - sums[behind]);
    if (extra > 0) stud[ahead] = extra; else stud[behind] = -extra;

    const diff = sideValues[0].length - sideValues[1].length;
    const fewer = diff < 0 ? 0 : 1;
    for (let k = 1; k <= Math.abs(diff); k++) credit[fewer] += replacementPlayer(ctx.playerValues, ctx.teams, k, ctx.rosterSpots).value;
  }

  const adjusted = sums.map((s, i) => s + stud[i] + credit[i]);
  const gap = adjusted[0] - adjusted[1];
  const bigger = Math.max(...adjusted, 1);
  const pct = Math.abs(gap) / bigger;
  const verdict = !complete ? "incomplete"
    : Math.abs(gap) <= Math.max(TRADE_FAIR_PCT * bigger, ctx.fairMin ?? TRADE_FAIR_MIN) ? "fair"
      : pct <= TRADE_SLIGHT_PCT ? "slight" : "favors";
  return { sums, stud, credit, adjusted, gap, pct, winner: gap >= 0 ? 0 : 1, verdict };
}

// The trade is kept in the URL hash (#trade=<ids>|<ids>) so it survives a
// reload and can be shared as a link. Ids are Sleeper player_ids or
// FantasyCalc pick ids, neither of which contain "," or "|".
function readTradeHash(key = "trade") {
  const m = new RegExp(`^#${key}=([^|]*)\\|?(.*)$`).exec(window.location.hash);
  if (!m) return [[], []];
  return [m[1], m[2]].map((s) => s.split(",").filter(Boolean).map(decodeURIComponent));
}

function writeTradeHash(sides, key = "trade", emptyHash = "#/trade") {
  const hash = sides[0].length || sides[1].length
    ? `#${key}=${sides.map((ids) => ids.map(encodeURIComponent).join(",")).join("|")}`
    : emptyHash;
  lastTradeHashes[key] = hash === emptyHash ? null : hash;
  try { window.history.replaceState(null, "", hash); } catch (e) {}
}

function AssetPicker({ rows, exclude, onPick }) {
  const [query, setQuery] = useState("");
  const [open, setOpen] = useState(false);
  const matches = useMemo(() => {
    const q = query.trim().toLowerCase();
    if (!q) return [];
    return rows.filter((r) => !exclude.has(r.id) && r.name.toLowerCase().includes(q)).slice(0, 8);
  }, [rows, query, exclude]);
  const pick = (r) => { onPick(r.id); setQuery(""); };

  return (
    <div className="relative">
      <input type="search" value={query} placeholder="Add a player or pick"
        onChange={(e) => { setQuery(e.target.value); setOpen(true); }}
        onFocus={() => setOpen(true)} onBlur={() => setOpen(false)}
        onKeyDown={(e) => { if (e.key === "Enter" && matches[0]) { e.preventDefault(); pick(matches[0]); } }}
        className="rounded-md border px-3 py-1.5 text-sm w-full" style={inputStyle} />
      {open && matches.length > 0 && (
        <ul className="absolute z-30 left-0 right-0 mt-1 rounded-md border overflow-hidden shadow-lg"
          style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
          {matches.map((r) => (
            <li key={r.id}>
              {/* mousedown, not click, so the pick lands before the input's blur closes the list */}
              <button type="button" onMouseDown={(e) => { e.preventDefault(); pick(r); }}
                className="menu-item w-full text-left px-3 py-1.5 text-sm flex justify-between gap-2">
                <span>
                  <span style={{ color: "var(--text-primary)" }}>{r.name}</span>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>
                    {r.position === "PICK" ? "Pick" : `${r.position} · ${r.team || "FA"}`}
                  </span>
                </span>
                <span className="tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmtValue(r.value)}</span>
              </button>
            </li>
          ))}
        </ul>
      )}
    </div>
  );
}

      ) : (
        <ul className="flex flex-col gap-1.5">
          {assets.map((a, i) => (

              style={{ borderColor: "var(--border)" }}>
              <span className="min-w-0 truncate">
                <PlayerLink sport={sport} id={a.id} pos={a.position}>{a.name}</PlayerLink>{" "}
                <span className="text-xs" style={{ color: "var(--text-muted)" }}>
                  {a.position === "PICK" ? "Pick" : `${a.position}${a.posRank ?? ""} · ${a.team || "FA"}${a.age ? ` · ${a.age}` : ""}`}
                </span>
              </span>
              <span className="flex items-center gap-2 shrink-0">
                <span className="tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmtValue(a.value)}</span>
                <button type="button" onClick={() => onRemove(i)} aria-label={`Remove ${a.name}`}
                  className="icon-btn-danger text-xs px-1.5 py-0.5 rounded">✕</button>
              </span>
            </li>
          ))}
        </ul>
      )}
      {assets.length > 0 && (
        <div className="flex flex-col gap-0.5 pt-2 border-t" style={{ borderColor: "var(--border)" }}>
          {line("Player value", fmtValue(result.sums[index]))}
          {result.stud[index] > 0 && line("Stud adjustment", `+${fmtValue(Math.round(result.stud[index]))}`)}
          {result.credit[index] > 0 && line("Roster spot credit", `+${fmtValue(Math.round(result.credit[index]))}`)}
          {line("Adjusted total", fmtValue(Math.round(result.adjusted[index])), true)}
        </div>
      )}
    </div>
  );
}

function TradeVerdict({ sport = "nfl", sides, byId, rows, ctx, result }) {
  // Three assets (not already in the deal) that come closest to evening it
  // out if added to the side getting less, re-running the full formula.
  const suggestions = useMemo(() => {
    if (result.verdict === "fair" || result.verdict === "incomplete") return [];
    const loser = 1 - result.winner;
    const inDeal = new Set([...sides[0], ...sides[1]]);
    const values = sides.map((ids) => ids.map((id) => byId[id]?.value || 0));
    return rows
      .filter((r) => !inDeal.has(r.id))
      .map((r) => {
        const next = values.map((v, i) => (i === loser ? [...v, r.value] : v));
        return { r, miss: Math.abs(evaluateTrade(next, ctx).gap) };
      })
      .sort((x, y) => x.miss - y.miss)
      .slice(0, 3)
      .map((x) => x.r);
  }, [sides, byId, rows, ctx, result]);

  if (!sides[0].length && !sides[1].length) return null;
  const { adjusted, gap, pct, winner, verdict } = result;
  const winnerName = `Team ${TRADE_SIDES[winner]}`;
  const headline = { incomplete: "Add something to both sides", fair: "Fair trade", slight: `Slightly favors ${winnerName}`, favors: `Favors ${winnerName}` }[verdict];
  const waiver = replacementPlayer(ctx.playerValues, ctx.teams, 1, ctx.rosterSpots);

  return (
    <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2">
        <p className="text-base font-semibold" style={{ color: "var(--text-primary)" }}>
          {headline}
          {verdict !== "incomplete" && verdict !== "fair" && (
            <span className="font-normal text-sm" style={{ color: "var(--text-muted)" }}>
              {" "}by {Math.round(Math.abs(gap)).toLocaleString()} ({Math.round(pct * 100)}%)
            </span>
          )}
        </p>
        <p className="text-xs tabular-nums" style={{ color: "var(--text-secondary)" }}>
          Adjusted: A {Math.round(adjusted[0]).toLocaleString()} · B {Math.round(adjusted[1]).toLocaleString()}
        </p>
      </div>
      <div className="flex h-3 gap-0.5" role="img" aria-label={`Team A ${Math.round(adjusted[0])}, Team B ${Math.round(adjusted[1])}`}>
        {TRADE_SIDES.map((s, i) => (
          <div key={s} title={`Team ${s}: ${Math.round(adjusted[i]).toLocaleString()}`}
            style={{
              width: `${(adjusted[i] / Math.max(adjusted[0] + adjusted[1], 1)) * 100}%`, background: SIDE_COLOR[s],
              borderRadius: i === 0 ? "4px 0 0 4px" : "0 4px 4px 0",
            }} />
        ))}
      </div>
      {suggestions.length > 0 && (
        <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
          To even it out, Team {TRADE_SIDES[1 - winner]} could also get{" "}
          {suggestions.map((r, i) => (
            <span key={r.id}>
              {i > 0 && (i === suggestions.length - 1 ? " or " : ", ")}
              <strong><PlayerLink sport={sport} id={r.id} pos={r.position} className="">{r.name}</PlayerLink></strong>{" "}
              <span className="tabular-nums" style={{ color: "var(--text-muted)" }}>({fmtValue(r.value)})</span>
            </span>
          ))}.
        </p>
      )}
      <details className="text-xs" style={{ color: "var(--text-muted)" }}>
        <summary className="cursor-pointer select-none" style={{ color: "var(--text-secondary)" }}>How this is calculated</summary>
        {ctx.raw ? (
          <p className="mt-2">Raw values is on, so each side is just the sum of its values with no adjustments.</p>
        ) : (
          <div className="mt-2 flex flex-col gap-1.5">
            <p>
              <strong>Stud adjustment</strong> (like KeepTradeCut and DynastyDaddy): each player counts toward a trade score at
              between {Math.round(TRADE_FORMULA.floor * 100)}% (filler) and{" "}
              {Math.round((TRADE_FORMULA.floor + TRADE_FORMULA.trade + TRADE_FORMULA.overall) * 100)}%
              (the best player in the league) of their value, so a pile of lesser pieces can't add up to a star. The side with the
              lower score is behind by the value of the one extra player it would need to catch up.
            </p>
            <p>
              <strong>Roster spot credit</strong> (like FantasyCalc): the side getting fewer players can fill each open spot from
              waivers. In a {ctx.teams >= 16 ? "16+" : ctx.teams}-team league that's about the {waiver.rank}th-best player, worth{" "}
              {fmtValue(waiver.value)} right now. Bigger leagues have worse free agents, so the credit shrinks and depth matters more.
            </p>
            <p>
              Within {Math.round(TRADE_FAIR_PCT * 100)}% is fair; up to {Math.round(TRADE_SLIGHT_PCT * 100)}% slightly favors one side. These weights are this
              app's own blend of the two approaches, not any one site's exact formula.
            </p>
          </div>
        )}
      </details>
    </div>
  );
}

/* ---------------- league team values (Sleeper) ---------------- */
// Every team in a Sleeper league ranked by the dynasty value of its roster
// plus the rookie picks it owns. Sleeper's league endpoints are public and
// CORS-open, the same API the rest of the app uses. Sleeper only lists picks
// that have changed hands (/traded_picks), so every team starts out owning
// its own picks for the next three drafts and trades are applied on top.
const SLEEPER_API = "https://api.sleeper.app/v1";
const DYNASTY_LEAGUE_KEY = "ff-valuediff:dynasty-league";
const LEAGUE_PICK_ROUNDS = 4; // FantasyCalc values rounds 1-4
const POS_KEYS = ["QB", "RB", "WR", "TE", "PICK"];
const POS_COLOR = { QB: "var(--pos-qb)", RB: "var(--pos-rb)", WR: "var(--pos-wr)", TE: "var(--pos-te)", PICK: "var(--pos-pick)" };
const POS_LABEL = { QB: "QB", RB: "RB", WR: "WR", TE: "TE", PICK: "Picks" };
// Which positions can fill each Sleeper lineup slot (K/DEF/IDP aren't valued).
const SLOT_ELIGIBLE = {
  QB: ["QB"], RB: ["RB"], WR: ["WR"], TE: ["TE"],
  FLEX: ["RB", "WR", "TE"], WRRB_FLEX: ["WR", "RB"], REC_FLEX: ["WR", "TE"], SUPER_FLEX: ["QB", "RB", "WR", "TE"],
};
// 1 → "1st", 12 → "12th", 23 → "23rd"
const ordinal = (n) => n + (["th", "st", "nd", "rd"][(n % 100 - 20) % 10] || ["th", "st", "nd", "rd"][n % 100] || "th");

async function sleeperGet(path) {
  const res = await fetch(SLEEPER_API + path);
  if (!res.ok) throw new Error(`Sleeper request failed (${res.status})`);
  return res.json();
}

const isSuperflexLeague = (league) => {
  const slots = league.roster_positions || [];
  return slots.includes("SUPER_FLEX") || slots.filter((p) => p === "QB").length >= 2;
};

const nearestOption = (value, options) =>
  options.reduce((best, o) => (Math.abs(o - value) < Math.abs(best - value) ? o : best), options[0]);

// The league settings that matter for values, read from a Sleeper league:
// settings.type is 0 for redraft, 1 keeper, 2 dynasty, 3 guillotine (keepers
// value the future, so they get dynasty values; guillotine is season-long);
// `rec` is points per catch and `bonus_rec_te` the TE premium on top.
function settingsFromLeague(league) {
  const scoring = league.scoring_settings || {};
  return {
    mode: [1, 2].includes(league.settings?.type) ? "dynasty" : "redraft",
    qb: isSuperflexLeague(league) ? "sf" : "1qb",
    teams: nearestOption(league.total_rosters || 12, [8, 10, 12, 14, 16]),
    ppr: nearestOption(scoring.rec ?? 1, [0, 0.5, 1]),
    tep: nearestOption(scoring.bonus_rec_te || 0, [0, 0.5, 1, 1.5]),
  };
}

// Best possible starting lineup by value: fill the strictest slots first
// (QB/RB/WR/TE), then flex spots, each with the best player left who fits.
// Returns [{ slot, player }] (player null when nobody fits).
function bestLineup(players, rosterPositions) {
  const slots = (rosterPositions || []).filter((s) => SLOT_ELIGIBLE[s])
    .sort((x, y) => SLOT_ELIGIBLE[x].length - SLOT_ELIGIBLE[y].length);
  const left = [...players].sort((a, b) => b.value - a.value);
  return slots.map((slot) => {
    const i = left.findIndex((p) => SLOT_ELIGIBLE[slot].includes(p.position));
    return { slot, player: i >= 0 ? left.splice(i, 1)[0] : null };
  });
}

// `sidelined(player)` is sidelinedReason for this league's current week.
// `lineup` (ranks, trade ideas) leaves out players who are out long-term;
// `weekLineup` also leaves out this week's Outs and byes, and `sidelinedStarters`
// lists who'd otherwise start, and why.
function buildLeagueTeams(raw, rows, byId, sidelined = () => null) {
  const { league, rosters, users, traded } = raw;
  const teamName = {};
  for (const r of rosters) {
    const u = users.find((x) => x.user_id === r.owner_id);
    teamName[r.roster_id] = u ? (u.metadata?.team_name || u.display_name) : `Team ${r.roster_id}`;
  }

  // Generic FantasyCalc pick rows by year and round. Years FantasyCalc doesn't
  // list yet borrow the latest year it does.
  const pickRows = {};
  for (const r of rows) {
    const p = r.position === "PICK" && window.FantasyCalc.parsePick(r.name);
    if (p && !p.slot) pickRows[`${p.year}-${p.round}`] = r;
  }
  const pickYears = [...new Set(Object.keys(pickRows).map((k) => Number(k.split("-")[0])))].sort();
  const pickRow = (year, round) =>
    pickRows[`${year}-${round}`] || pickRows[`${pickYears.filter((y) => y <= year).pop() ?? pickYears[0]}-${round}`];

  // This season's draft still counts until it's been held.
  const season = Number(league.season);
  const first = ["pre_draft", "drafting"].includes(league.status) ? season : season + 1;
  const years = [first, first + 1, first + 2];
  const rounds = Math.min(league.settings?.draft_rounds || LEAGUE_PICK_ROUNDS, LEAGUE_PICK_ROUNDS);
  const pickOwner = {};
  for (const y of years) for (let rd = 1; rd <= rounds; rd++) for (const r of rosters) pickOwner[`${y}-${rd}-${r.roster_id}`] = r.roster_id;
  for (const t of traded) {
    const k = `${t.season}-${t.round}-${t.roster_id}`;
    if (k in pickOwner) pickOwner[k] = t.owner_id;
  }

  const teams = rosters.map((r) => {
    const players = (r.players || []).map((id) => byId[id]).filter(Boolean);
    const picks = Object.entries(pickOwner)
      .filter(([, owner]) => owner === r.roster_id)
      .map(([k]) => {
        const [y, rd, orig] = k.split("-").map(Number);
        const row = pickRow(y, rd);
        return {
          id: row?.id, position: "PICK", value: row?.value || 0,
          name: `${y} ${ordinal(rd)}${orig !== r.roster_id ? ` (via ${teamName[orig]})` : ""}`,
        };
      })
      .filter((p) => p.id);
    const assets = [...players, ...picks].sort((a, b) => b.value - a.value);
    const byPos = Object.fromEntries(POS_KEYS.map((k) => [k, assets.filter((a) => a.position === k).reduce((s, a) => s + a.value, 0)]));
    const why = Object.fromEntries(players.map((p) => [p.id, sidelined(p)]));
    const lineup = bestLineup(players.filter((p) => !why[p.id]?.longTerm), league.roster_positions);
    const weekLineup = bestLineup(players.filter((p) => !why[p.id]), league.roster_positions);
    const sidelinedStarters = bestLineup(players, league.roster_positions)
      .filter((l) => l.player && why[l.player.id]).map((l) => ({ player: l.player, reason: why[l.player.id] }));
    const st = r.settings || {};
    return {
      rosterId: r.roster_id, ownerIds: [r.owner_id, ...(r.co_owners || [])], name: teamName[r.roster_id], assets, byPos, lineup,
      weekLineup, sidelinedStarters, sidelined: why, longTermOut: new Set(players.filter((p) => why[p.id]?.longTerm).map((p) => p.id)),
      total: assets.reduce((s, a) => s + a.value, 0),
      starters: lineup.reduce((s, l) => s + (l.player?.value || 0), 0),
      record: { wins: st.wins || 0, losses: st.losses || 0, ties: st.ties || 0, pf: (st.fpts || 0) + (st.fpts_decimal || 0) / 100 },
    };
  });
  return teams.sort((a, b) => b.total - a.total);
}

function LeagueValues({ rows, byId, settings, setSettings, onAdd }) {
  const [input, setInput] = useState(() => { try { return localStorage.getItem(DYNASTY_LEAGUE_KEY) || ""; } catch (e) { return ""; } });
  const [leagues, setLeagues] = useState(null);
  const [raw, setRaw] = useState(null);
  const [status, setStatus] = useState({ state: "idle" });
  const [expanded, setExpanded] = useState(null);

  const loadLeague = async (leagueId) => {
    setStatus({ state: "loading" });
    setExpanded(null);
    try {
      const [league, rosters, users, traded] = await Promise.all([
        sleeperGet(`/league/${leagueId}`), sleeperGet(`/league/${leagueId}/rosters`),
        sleeperGet(`/league/${leagueId}/users`), sleeperGet(`/league/${leagueId}/traded_picks`),
      ]);
      if (!league) throw new Error("no Sleeper league with that ID");
      const synced = settingsFromLeague(league);
      setSettings((s) => ({ ...s, ...synced }));
      setRaw({ league, rosters: rosters || [], users: users || [], traded: traded || [] });
      setStatus({ state: "ready" });
    } catch (err) {
      setStatus({ state: "error", message: err.message });
    }
  };

  const submit = async (e) => {
    e.preventDefault();
    const value = input.trim();
    if (!value) return;
    try { localStorage.setItem(DYNASTY_LEAGUE_KEY, value); } catch (err) {}
    setLeagues(null);
    if (/^\d{9,}$/.test(value)) return loadLeague(value);
    setStatus({ state: "loading" });
    try {
      const user = await sleeperGet(`/user/${encodeURIComponent(value)}`);
      if (!user) throw new Error(`no Sleeper user named "${value}"`);
      const state = await sleeperGet("/state/nfl");
      const list = (await sleeperGet(`/user/${user.user_id}/leagues/nfl/${state.league_season || state.season}`)) || [];
      if (list.length === 0) throw new Error(`"${value}" isn't in any leagues this season`);
      if (list.length === 1) return loadLeague(list[0].league_id);
      setLeagues(list);
      setStatus({ state: "idle" });
    } catch (err) {
      setStatus({ state: "error", message: err.message });
    }
  };

  const teams = useMemo(() => (raw ? buildLeagueTeams(raw, rows, byId) : []), [raw, rows, byId]);
  const maxTotal = teams[0]?.total || 1;

  return (
    <section className="flex flex-col gap-3">
      <header>
        <h3 className="text-base font-semibold" style={{ color: "var(--text-primary)" }}>League team values</h3>
        <p className="text-xs mt-1" style={{ color: "var(--text-muted)" }}>
          Enter a Sleeper username or league ID to rank every team by the value of its roster plus the rookie picks it
          owns (the next three drafts, rounds 1-{LEAGUE_PICK_ROUNDS}, valued as mid-round picks). "Starters" is the best
          lineup the roster can field. Loading a league switches the settings above to match it (format, QB, team count,
          scoring and TE premium). Use +A / +B on
          any player to add them to the trade above.
        </p>
      </header>

      <form onSubmit={submit} className="flex gap-2 flex-wrap">
        <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Sleeper username or league ID"
          className="rounded-md border px-3 py-1.5 text-sm flex-1" style={{ ...inputStyle, minWidth: "12rem" }} />
        <button type="submit" className="btn-primary rounded-md px-4 py-1.5 text-sm font-semibold">Load</button>
      </form>

      {leagues && (
        <div className="flex flex-col gap-1.5">
          <p className="text-xs" style={{ color: "var(--text-muted)" }}>Pick a league:</p>
          <PillGroup options={leagues.map((l) => ({ key: l.league_id, label: l.name }))}
            value={raw?.league.league_id} onChange={loadLeague} />
        </div>
      )}

      {status.state === "loading" && <p className="text-sm py-3" style={{ color: "var(--text-muted)" }}>Loading from Sleeper…</p>}
      {status.state === "error" && (
        <p className="text-sm py-3" style={{ color: "var(--text-muted)" }}>
          Couldn't load that ({status.message}). This needs the page served over http(s) with network access.
        </p>
      )}

      {status.state === "ready" && raw && (
        <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
          <div className="flex items-baseline justify-between flex-wrap gap-2">
            <p className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
              {raw.league.name}{" "}
              <span className="font-normal" style={{ color: "var(--text-muted)" }}>
                · settings synced from this league: {describeSettings(settings)}
              </span>
            </p>
            <div className="flex items-center gap-3 flex-wrap">
              {POS_KEYS.map((k) => (
                <span key={k} className="text-xs flex items-center gap-1" style={{ color: "var(--text-secondary)" }}>
                  <span className="inline-block w-2.5 h-2.5 rounded-sm" style={{ background: POS_COLOR[k] }} />{POS_LABEL[k]}
                </span>
              ))}
            </div>
          </div>

          <ol className="flex flex-col">
            {teams.map((t, i) => (
              <li key={t.rosterId} className="border-b last:border-b-0" style={{ borderColor: "var(--border)" }}>
                <button type="button" onClick={() => setExpanded(expanded === t.rosterId ? null : t.rosterId)}
                  className="row-btn w-full text-left py-2 px-1 grid gap-x-3 gap-y-1 items-center"
                  style={{ gridTemplateColumns: "1.5rem minmax(0, 1fr) auto" }}>
                  <span className="text-sm tabular-nums text-right" style={{ color: "var(--text-muted)" }}>{i + 1}</span>
                  <span className="text-sm font-medium truncate" style={{ color: "var(--text-primary)" }}>
                    {expanded === t.rosterId ? "▾ " : "▸ "}{t.name}
                  </span>
                  <span className="text-sm tabular-nums text-right" style={{ color: "var(--text-primary)" }}>
                    <strong>{fmtValue(t.total)}</strong>{" "}
                    <span className="text-xs font-normal" style={{ color: "var(--text-muted)" }}>· starters {fmtValue(t.starters)}</span>
                  </span>
                  <span />
                  <span className="col-span-2">
                    <span className="flex h-2.5 gap-0.5" style={{ width: `${(t.total / maxTotal) * 100}%` }}>
                      {POS_KEYS.filter((k) => t.byPos[k] > 0).map((k, j, arr) => (
                        <span key={k} title={`${POS_LABEL[k]}: ${fmtValue(t.byPos[k])}`}
                          style={{
                            width: `${(t.byPos[k] / t.total) * 100}%`, background: POS_COLOR[k],
                            borderTopLeftRadius: j === 0 ? 4 : 0, borderBottomLeftRadius: j === 0 ? 4 : 0,
                            borderTopRightRadius: j === arr.length - 1 ? 4 : 0, borderBottomRightRadius: j === arr.length - 1 ? 4 : 0,
                          }} />
                      ))}
                    </span>
                  </span>
                </button>

                {expanded === t.rosterId && (
                  <div className="pb-3 pl-9 flex flex-col gap-2">
                    <p className="text-xs tabular-nums" style={{ color: "var(--text-secondary)" }}>
                      {POS_KEYS.map((k) => `${POS_LABEL[k]} ${fmtValue(t.byPos[k])}`).join(" · ")}
                    </p>
                    <ul className="flex flex-col gap-1">
                      {t.assets.map((a, j) => (
                        <li key={`${a.id}-${j}`} className="flex items-center justify-between gap-2 text-sm">
                          <span className="min-w-0 truncate">
                            <span className="inline-block w-2 h-2 rounded-sm mr-1.5" style={{ background: POS_COLOR[a.position] }} />
                            <PlayerLink id={a.id} pos={a.position} className="">{a.name}</PlayerLink>{" "}
                            <span className="text-xs" style={{ color: "var(--text-muted)" }}>
                              {a.position === "PICK" ? "Pick" : `${a.position}${a.posRank}${a.age ? ` · ${a.age}` : ""}`}
                            </span>
                          </span>
                          <span className="flex items-center gap-1.5 shrink-0">
                            <span className="tabular-nums text-xs" style={{ color: "var(--text-secondary)" }}>{fmtValue(a.value)}</span>
                            {TRADE_SIDES.map((s, si) => (
                              <button key={s} type="button" onClick={() => onAdd(si, a.id)} title={`Add to what Team ${s} gets`}
                                className="pill text-xs rounded px-1.5 font-semibold" style={{ "--pill-accent": SIDE_COLOR[s] }}>
                                +{s}
                              </button>
                            ))}
                          </span>
                        </li>
                      ))}
                    </ul>
                  </div>
                )}
              </li>
            ))}
          </ol>
        </div>
      )}
    </section>
  );
}

/* ---------------- my leagues ---------------- */
// Every Sleeper league a user is in, each read with its own settings: its
// format, size, QB slots, scoring and TE premium pick which FantasyCalc
// values are used (settingsFromLeague), and its lineup slots decide each
// team's starters (bestLineup). Any league can be looked at as dynasty or
// redraft. Settings FantasyCalc has no option for are listed, not modeled.
const SLEEPER_USER_KEY = "ff-valuediff:sleeper-user";
const LEAGUES_HASH = "#/leagues";
const LEAGUE_TYPE_LABEL = { 0: "Redraft", 1: "Keeper", 2: "Dynasty", 3: "Guillotine" };
const SLOT_LABEL = { FLEX: "Flex", WRRB_FLEX: "W/R flex", REC_FLEX: "W/T flex", SUPER_FLEX: "Superflex", DEF: "DEF", K: "K" };
const IDP_SLOTS = ["DL", "LB", "DB", "IDP_FLEX"];
const ROOM_POSITIONS = ["QB", "RB", "WR", "TE"];

const leagueIdFromHash = () => (/^#\/leagues\/(\d+)/.exec(window.location.hash) || [])[1] || null;

// "QB, 2 RB, 3 WR, TE, 2 Flex, Superflex"
function lineupSummary(rosterPositions) {
  const counts = {};
  for (const s of rosterPositions || []) if (s !== "BN") counts[s] = (counts[s] || 0) + 1;
  return Object.entries(counts).map(([s, n]) => `${n > 1 ? `${n} ` : ""}${SLOT_LABEL[s] || s.replace(/_/g, " ")}`).join(", ");
}

// "Dynasty · 12 teams · Superflex · PPR · TEP +0.5"
function leagueTags(league) {
  const s = settingsFromLeague(league);
  return [
    LEAGUE_TYPE_LABEL[league.settings?.type] || "Redraft", league.settings?.best_ball ? "Best ball" : null, `${league.total_rosters} teams`,
    s.qb === "sf" ? "Superflex" : "1QB", { 1: "PPR", 0.5: "Half PPR", 0: "Standard" }[s.ppr], s.tep ? `TEP +${s.tep}` : null,
  ].filter(Boolean).join(" · ");
}

// Each league setting, what it is, and how (or whether) it's used here.
function leagueRules(league, mode) {
  const scoring = league.scoring_settings || {};
  const slots = league.roster_positions || [];
  const s = settingsFromLeague(league);
  const qbSlots = slots.filter((p) => p === "QB").length;
  const rec = scoring.rec ?? 0;
  const passTd = scoring.pass_td ?? 4;
  const count = (k) => slots.filter((p) => p === k).length;
  const unvalued = [count("K") && "K", count("DEF") && "DEF", slots.some((p) => IDP_SLOTS.includes(p)) && "IDP"].filter(Boolean);
  const type = league.settings?.type;
  return [
    { label: "Format", value: LEAGUE_TYPE_LABEL[type] || "Redraft",
      use: mode === s.mode ? `${mode === "dynasty" ? "Dynasty" : "Redraft"} values${type === 1 ? " (keepers value the future)" : ""}`
        : `Viewing as ${mode} instead` },
    ...(league.settings?.best_ball ? [{ label: "Best ball", value: "Yes", use: "Lineups set themselves, so the best lineup below is how teams score" }] : []),
    { label: "Teams", value: league.total_rosters,
      use: `KTC values don't change with league size (FantasyCalc's fallbacks use ${league.total_rosters > 14 ? "14-team, its largest" : `${s.teams}-team`})` },
    { label: "QB", value: slots.includes("SUPER_FLEX") ? "Superflex" : qbSlots >= 2 ? `${qbSlots}QB` : "1QB",
      use: s.qb === "sf" ? "Superflex values" : "1QB values" },
    { label: "Receptions", value: `${rec} pt${rec === 1 ? "" : "s"} per catch`,
      use: `KTC values don't change with scoring (FantasyCalc's fallbacks use ${{ 1: "PPR", 0.5: "Half-PPR", 0: "Standard" }[s.ppr]}${rec !== s.ppr ? ", the closest match" : ""})` },
    { label: "TE premium", value: scoring.bonus_rec_te ? `+${scoring.bonus_rec_te} per catch` : "None",
      use: s.tep ? "TE values boosted (this app's estimate)" : "–" },
    { label: "Passing TD", value: `${passTd} pts`,
      use: passTd > 4 ? "Not modeled: values assume 4, so QBs are worth a bit more here than shown" : "Standard" },
    { label: "Starters", value: lineupSummary(slots), use: "Each team's best lineup fills these slots" },
    { label: "Roster", value: [`${count("BN")} bench`, league.settings?.reserve_slots && `${league.settings.reserve_slots} IR`,
      league.settings?.taxi_slots && `${league.settings.taxi_slots} taxi`].filter(Boolean).join(" · "), use: "For reference" },
    ...(unvalued.length ? [{ label: "Not valued", value: unvalued.join(", "), use: "Trade values only cover QB, RB, WR and TE" }] : []),
  ];
}

// Rank of each team (1 = best) by `f`.
const rankTeams = (teams, f) =>
  Object.fromEntries([...teams].sort((a, b) => f(b) - f(a)).map((t, i) => [t.rosterId, i + 1]));

// Dynasty lean. Where the team stands this season comes first: one the
// projected standings give LEAN_CONTEND_ODDS or better to make the playoffs
// is a contender even with a bottom-half roster, and one at LEAN_TANK_ODDS or
// worse should sell even with a top-half roster. Without projections (season
// over, or they didn't load), after LEAN_MIN_GAMES games: a winning record in
// a playoff spot, or the bottom third of the standings. Otherwise it's how
// good the lineup is this season (redraft values) against the whole roster's
// long-term value. `standing`: { playoffs (odds or null), seed, games, winPct, playoffTeams }.
const LEAN_CONTEND_ODDS = 0.6;
const LEAN_TANK_ODDS = 0.2;
const LEAN_MIN_GAMES = 3;

function teamLean(nowRank, futureRank, n, standing) {
  if (standing) {
    const { playoffs, seed, games, winPct, playoffTeams } = standing;
    const topHalf = futureRank <= Math.ceil(n / 2);
    const where = playoffs != null ? `${Math.round(playoffs * 100)}% playoff odds` : `${ordinal(seed)} in the standings`;
    const worth = `${ordinal(futureRank)} of ${n} in roster value`;
    const contending = playoffs != null ? playoffs >= LEAN_CONTEND_ODDS
      : games >= LEAN_MIN_GAMES && seed <= playoffTeams && winPct > 0.5;
    const tanking = playoffs != null ? playoffs <= LEAN_TANK_ODDS
      : games >= LEAN_MIN_GAMES && seed > n - Math.floor(n / 3);
    if (contending) return { label: "Contender", color: "var(--hue-orange)",
      tip: topHalf
        ? `In the playoff hunt (${where}) with one of the more valuable rosters. Win-now veterans and depth at your weakest spot are worth paying for.`
        : `The roster is only ${worth}, but you're in the playoff hunt (${where}). Make the push: buy win-now veterans with picks and prospects who won't help this year.` };
    if (tanking) return { label: "Rebuilding", color: "var(--hue-violet)",
      tip: topHalf
        ? `The roster is ${worth}, but this season is slipping away (${where}). Sell veterans whose value won't last until you contend again, for picks and young players.`
        : `This season is slipping away (${where}) and the long-term value is thin too (${worth}). Sell older starters for picks and young players.` };
  }
  if (nowRank <= Math.ceil(n / 3)) return { label: "Contender", color: "var(--hue-orange)",
    tip: "Your lineup is one of the best this season. Win-now veterans and depth at your weakest spot are worth paying for." };
  if (nowRank > Math.floor((2 * n) / 3)) return { label: "Rebuilding", color: "var(--hue-violet)",
    tip: futureRank <= Math.ceil(n / 2)
      ? "The lineup trails this season, but the roster holds long-term value. Sell older starters for picks and young players."
      : "The lineup trails this season and the long-term value is thin too. Sell older starters for picks and young players." };
  return { label: "In the mix", color: "var(--text-secondary)",
    tip: "A middle-of-the-pack lineup. Pick a direction: buy to contend, or sell veterans to build for later." };
}

// Trade targets: players on other teams worth going after, each with an
// offer from the team's own roster that this app's trade formula
// (evaluateTrade) calls fair, or a slight overpay. What counts as better
// depends on the team:
// - redraft, or a dynasty team in the mix: the most lineup value gained
//   (the best lineup in the league's slots, before and after);
// - a dynasty contender: the same, but on this season's (redraft) values;
// - a dynasty rebuilder: young players (24 and under, no picks), and
//   players 27 and under who are out for the season but back next year
//   (bought while their value is down), paid for with veterans (26 and up),
//   the bigger the age drop the better. A season-long injury counts as
//   INJURED_BONUS_YEARS of extra age drop, since this season is all a
//   rebuilder gives up.
// A target can come alone or with a second player from the same team (for
// one asset back), which is how a thin roster turns one star into two
// starters. Offers that also help the other team's lineup rank higher, since
// they're likelier to be accepted.
// Targets are grouped by position (QB, RB, WR, TE), several to a position.
// Within a position each partner and each offered asset shows up once; across
// all positions an asset is offered at most TARGETS_PER_ASSET times.
const TARGETS_PER_POSITION = 3;
const TARGETS_PER_ASSET = 3;
const OFFER_POOL = 14; // the team's most valuable tradeable assets, offered alone or in pairs
const SECOND_POOL = 8;  // the other team's players considered as a second piece
const TARGET_MIN_VALUE = 500;
const TARGET_MIN_GAIN = 250; // lineup gain needed, or 10% of the target's value if more
const PICK_AGE = 21; // a rookie pick counts as a 21-year-old when comparing ages
const INJURED_MAX_AGE = 27;
const INJURED_BONUS_YEARS = 3;
// Injuries that end a season, read from Sleeper's injury body part ("Knee - ACL").
const SEASON_ENDING_INJURY = /ACL|Achilles/i;

// Sleeper ids of players out for the season who should be back next year:
// season-ending entries in the hand-kept INJURED_RESERVE list, plus anyone
// Sleeper has on IR or PUP with a torn ACL or Achilles. (Low redraft value
// alone isn't a sign: rookies on short IR stints have that too.)
function outForYearIds(rows, sleeperPlayers, resolve) {
  const ids = new Set();
  for (const r of INJURED_RESERVE) {
    if (!r.seasonEnding) continue;
    if (r.id.startsWith("sl-")) { ids.add(r.id.slice(3)); continue; } // extra players carry their Sleeper id
    const p = samplePlayers.find((x) => x.id === r.id);
    const id = p && resolve(r.id, p.name, p.position);
    if (id) ids.add(id);
  }
  for (const r of rows) {
    const sp = sleeperPlayers[r.id];
    if (sp && ["IR", "PUP"].includes(sp.status) && SEASON_ENDING_INJURY.test(sp.injury || "")) ids.add(r.id);
  }
  return ids;
}

const lineupTotal = (assets, slots, val) =>
  bestLineup(assets.filter((a) => a.position !== "PICK").map((a) => ({ ...a, value: val(a) })), slots)
    .reduce((s, l) => s + (l.player?.value || 0), 0);
const avgAge = (assets) => sumOf(assets.map((a) => (a.position === "PICK" ? PICK_AGE : a.age ?? 26))) / assets.length;

// Deals are built around the trade partner: every offer has to fix
// something for them (partnerHelps), and the score leans hardest on how much
// it does, then on taking from a room where they have plenty, then on this
// team's own needs. Fit factors are multiplied into each deal's score;
// ranges run from a position room that's the league's strongest to its
// weakest.
const FIT = {
  partnerNeed: [0.45, 1.9],  // the partner's room at what's offered to them
  surplus: [1.35, 0.7],      // the partner's room at what's taken from them (strong = can spare it)
  need: [0.8, 1.3],          // this team's own room at the target's position
  rebuildNeed: [0.9, 1.15],  // rebuilders care less about this season's holes
  window: { opposite: 1.35, same: 0.75 }, // contender <-> rebuilder, or two of a kind
  age: { fits: 1.15, clashes: 0.75 },     // a team in the mix, by its core's age
};
const PARTNER_WEAK = 0.6; // a room in the league's bottom 40% counts as a hole
// A team in the mix leans young or win-now by its lineup's value-weighted age.
const YOUNG_CORE_AGE = 25.5;
const OLD_CORE_AGE = 27.5;
const lerp = ([lo, hi], t) => lo + (hi - lo) * t;
const weightedBy = (assets, f) => sumOf(assets.map((a) => a.value * f(a))) / Math.max(1, sumOf(assets.map((a) => a.value)));

// leanOf(team) is the team's dynasty lean (teamLean), or null in redraft.
function suggestTrades(team, teams, league, rows, mode, leanOf, outForYear = new Set()) {
  const slots = league.roster_positions;
  const lean = leanOf(team);
  const rebuild = mode === "dynasty" && lean?.label === "Rebuilding";
  const val = mode === "dynasty" && lean?.label === "Contender" ? (a) => a.redraftValue ?? a.value : (a) => a.value;
  // Players out long-term (on either roster) can't help a lineup.
  const out = new Set(teams.flatMap((t) => [...(t.longTermOut || [])]));
  const lineupOf = (assets) => lineupTotal(assets.filter((a) => !out.has(a.id)), slots, val);
  // The same context the Trade Desk uses for this league, so "Open in Trade
  // Desk" shows the same verdict.
  const ctx = {
    topValue: rows[0]?.value || 1,
    playerValues: rows.filter((r) => r.position !== "PICK").map((r) => r.value),
    teams: settingsFromLeague(league).teams,
  };

  const pool = team.assets.filter((a) => (rebuild ? a.position !== "PICK" && (a.age ?? 0) >= 26 : true)).slice(0, OFFER_POOL);
  const offers = [];
  pool.forEach((a, i) => { offers.push([a]); pool.slice(i + 1).forEach((b) => offers.push([a, b])); });
  const base = lineupOf(team.assets);

  // Position room ranks (1 = strongest), as 0 (strongest) to 1 (weakest).
  const n = teams.length;
  const posRank = {};
  for (const pos of ROOM_POSITIONS) {
    [...teams].sort((a, b) => b.byPos[pos] - a.byPos[pos]).forEach((t, i) => { (posRank[t.rosterId] ||= {})[pos] = i + 1; });
  }
  const weakness = (t, pos) => (n > 1 && posRank[t.rosterId][pos] ? (posRank[t.rosterId][pos] - 1) / (n - 1) : 0.5);
  const needFit = (get) => weightedBy(get, (a) => lerp(rebuild ? FIT.rebuildNeed : FIT.need, weakness(team, a.position)));
  // What the offer does for the partner: players count by how weak the
  // partner is at their position; picks and young players count fully for a
  // rebuilding partner and barely for a contender.
  const forPartner = (a, other) => {
    const theirLean = leanOf(other)?.label;
    if (a.position === "PICK") return theirLean === "Rebuilding" ? 1 : theirLean === "Contender" ? 0 : 0.5;
    // A player out long-term fills no hole this season; a rebuilder might still stash a young one.
    if (out.has(a.id)) return theirLean === "Rebuilding" && (a.age ?? 99) <= INJURED_MAX_AGE ? 0.5 : 0;
    if (theirLean !== "Rebuilding") return weakness(other, a.position);
    // A rebuilder wants youth; a veteran only half-fixes a hole for them.
    return (a.age ?? 99) <= 24 ? 1 : (a.age ?? 99) >= 27 ? weakness(other, a.position) * 0.4 : weakness(other, a.position);
  };
  const partnerFit = (give, other) => weightedBy(give, (a) => lerp(FIT.partnerNeed, forPartner(a, other)));
  const surplusFit = (get, other) => weightedBy(get, (a) => lerp(FIT.surplus, weakness(other, a.position)));
  // An offer has to fix something for them: fill a hole, bring a rebuilder
  // youth or picks, or make a contender's lineup better.
  const partnerHelps = (give, other, theirGain) =>
    give.some((a) => forPartner(a, other) > PARTNER_WEAK) || (leanOf(other)?.label === "Contender" && theirGain > 0);
  const windowFit = (other) => {
    const mine = lean?.label, theirs = leanOf(other)?.label;
    if (!mine || !theirs) return 1;
    if ((mine === "Contender" && theirs === "Rebuilding") || (mine === "Rebuilding" && theirs === "Contender")) return FIT.window.opposite;
    return mine === theirs && mine !== "In the mix" ? FIT.window.same : 1;
  };
  // A team in the mix leans the way its core already does.
  const starters = team.lineup.map((l) => l.player).filter(Boolean);
  const coreAge = weightedBy(starters, (a) => a.age ?? 26);
  const ageLean = lean?.label === "In the mix" ? (coreAge < YOUNG_CORE_AGE ? "young" : coreAge > OLD_CORE_AGE ? "win-now" : null) : null;
  const ageFit = (get) => (!ageLean ? 1 : weightedBy(get, (a) => {
    const age = a.age ?? 26;
    if (ageLean === "young") return age <= 26 ? FIT.age.fits : age >= 29 ? FIT.age.clashes : 1;
    return age >= 27 ? FIT.age.fits : age <= 23 ? FIT.age.clashes : 1;
  }));

  const found = [];
  for (const other of teams) {
    if (other === team) continue;
    const theirBase = lineupOf(other.assets);
    const otherWindow = windowFit(other);
    for (const p of other.assets) {
      if (p.value < TARGET_MIN_VALUE) continue;
      const injured = rebuild && outForYear.has(p.id) && (p.age ?? 99) <= INJURED_MAX_AGE;
      if (p.position === "PICK" || (rebuild && !injured && !(p.age && p.age <= 24))) continue;
      if (!rebuild && outForYear.has(p.id)) continue; // no help to this season's lineup
      if (!rebuild && lineupOf([...team.assets, p]) <= base) continue; // wouldn't even start
      const seconds = rebuild ? [] : other.assets
        .filter((q) => q !== p && q.position !== "PICK" && q.value >= TARGET_MIN_VALUE && q.value <= p.value).slice(0, SECOND_POOL);
      const packages = [[p], ...seconds.map((q) => [p, q])];
      let best = null;
      for (const get of packages) {
        const getSum = sumOf(get.map((a) => a.value));
        for (const give of offers) {
          if (get.length > 1 && give.length > 1) continue; // 2-for-2s are left to the Trade Desk
          const giveSum = sumOf(give.map((a) => a.value));
          if (giveSum < getSum * 0.6 || giveSum > getSum * 1.8) continue;
          const result = evaluateTrade([get.map((a) => a.value), give.map((a) => a.value)], ctx);
          if (!(result.verdict === "fair" || (result.verdict === "slight" && result.winner === 1))) continue;
          const gain = lineupOf([...team.assets.filter((a) => !give.includes(a)), ...get]) - base;
          if (!rebuild && gain < Math.max(TARGET_MIN_GAIN, p.value * 0.1)) continue; // not worth the shake-up
          const theirGain = lineupOf([...other.assets.filter((a) => !get.includes(a)), ...give]) - theirBase;
          if (!partnerHelps(give, other, theirGain)) continue;
          const ageDrop = avgAge(give) - avgAge(get);
          const youthGain = ageDrop + (injured ? INJURED_BONUS_YEARS : 0);
          if (rebuild && youthGain < 2) continue;
          const raw = rebuild ? youthGain * getSum / 10 + (getSum - giveSum) * 0.5 + theirGain * 0.5 : gain + theirGain * 0.5;
          const score = raw * partnerFit(give, other) * surplusFit(get, other) * needFit(get) * otherWindow * ageFit(get);
          if (!best || score > best.score) best = { get, give, partner: other, gain, theirGain, ageDrop, injured, result, score };
        }
      }
      if (best) found.push(best);
    }
  }

  // Spread the ideas out: several per position, each from a different
  // partner and with a different offer, no player targeted twice, and no
  // asset offered more than TARGETS_PER_ASSET times overall.
  const perAsset = new Map();
  const targeted = new Set();
  const byPos = Object.fromEntries(ROOM_POSITIONS.map((pos) => [pos, []]));
  for (const s of found.sort((a, b) => b.score - a.score)) {
    const group = byPos[s.get[0].position];
    if (!group || group.length >= TARGETS_PER_POSITION) continue;
    if (group.some((g) => g.partner === s.partner || g.give.some((a) => s.give.includes(a)))) continue;
    if (s.give.some((a) => (perAsset.get(a) || 0) >= TARGETS_PER_ASSET) || s.get.some((a) => targeted.has(a))) continue;
    s.give.forEach((a) => perAsset.set(a, (perAsset.get(a) || 0) + 1));
    s.get.forEach((a) => targeted.add(a));
    group.push(s);
  }
  const picked = ROOM_POSITIONS.flatMap((pos) => byPos[pos]);
  // Who the new player pushes out of the lineup (besides anyone traded away).
  const startersOf = (assets) => bestLineup(assets.filter((a) => a.position !== "PICK").map((a) => ({ ...a, value: val(a), orig: a })), slots)
    .map((l) => l.player?.orig).filter(Boolean);
  const before = startersOf(team.assets);
  const rankOf = (t, pos) => posRank[t.rosterId]?.[pos];
  // Positions in order of this team's need, weakest room first.
  const positions = [...ROOM_POSITIONS].sort((a, b) => weakness(team, b) - weakness(team, a))
    .map((pos) => ({ pos, rank: rankOf(team, pos) }));
  return {
    rebuild, n, ageLean, positions, list: picked.map((s) => {
      const after = startersOf([...team.assets.filter((a) => !s.give.includes(a)), ...s.get]);
      // Why it works for them first: the hole the offer fills, the room they
      // can spare the target from, and their window; then the need it fills here.
      const main = s.get[0];
      const theirLean = leanOf(s.partner)?.label;
      const fills = [];
      for (const a of s.give) {
        if (a.position === "PICK" || forPartner(a, s.partner) <= PARTNER_WEAK || weakness(s.partner, a.position) <= PARTNER_WEAK) continue;
        const f = fills.find((x) => x.pos === a.position);
        if (f) f.names.push(a.name); else fills.push({ names: [a.name], pos: a.position, rank: rankOf(s.partner, a.position) });
      }
      const youth = theirLean === "Rebuilding" ? s.give.filter((a) => a.position === "PICK" || (a.age ?? 99) <= 24).map((a) => a.name) : [];
      const sellsVeteran = s.get.some((a) => (a.age ?? 0) >= 26);
      return {
        ...s, benched: before.filter((a) => !after.includes(a) && !s.give.includes(a)),
        fills, youth: youth.filter((nm) => !fills.some((f) => f.names.includes(nm))), sellsVeteran,
        spare: weakness(s.partner, main.position) <= 1 - PARTNER_WEAK ? { pos: main.position, rank: rankOf(s.partner, main.position) } : null,
        partnerLean: windowFit(s.partner) === FIT.window.opposite ? theirLean : null,
        need: weakness(team, main.position) > PARTNER_WEAK ? { pos: main.position, rank: rankOf(team, main.position) } : null,
      };
    }),
  };
}

/* ---------------- projected standings ---------------- */
// This season's standings for a Sleeper league (dynasty or not): the record,
// points for, points against and max points for so far, straight from
// Sleeper, plus where they're headed. The rest of the regular season is
// played out from Sleeper's weekly projections, scored in the league's own
// scoring, against the league's real schedule:
// - each future week a team scores its best projected lineup (in the
//   league's slots, K/DEF/IDP included) times how close to its best lineup
//   it has started so far (PF ÷ max PF, kept between 75% and 100%); that
//   best lineup is its projected max PF;
// - a week already under way uses the lineups actually set, with points
//   already scored in place of projections;
// - players out for the season (seasonOverIds) score nothing: Sleeper's
//   weekly projections sit out the four-game IR minimum but then bring a
//   player back, season-ending or not;
// - STANDINGS_SIMS seasons are simulated (each team-week drawn around its
//   projection, STANDINGS_SPREAD of it either way as one standard deviation)
//   for playoff odds and the average record and points.
// Seeds go by wins, then points for, like Sleeper's default.
const STANDINGS_SIMS = 2000;
const STANDINGS_SPREAD = 0.18;
const PROJ_SLOTS = {
  ...SLOT_ELIGIBLE, K: ["K"], DEF: ["DEF"],
  DL: ["DL"], LB: ["LB"], DB: ["DB"], IDP_FLEX: ["DL", "LB", "DB"],
};

// One week of Sleeper projections for the given positions, as
// { player_id: { pos: [fantasy positions], position, name, team, opp, status, stats } }.
// Kept for the visit, since a week is a couple of MB and every league reuses it.
const weekProjectionCache = new Map();
function fetchWeekProjections(season, week, positions) {
  const key = `${season}-${week}-${positions.join(",")}`;
  if (!weekProjectionCache.has(key)) {
    const qs = positions.map((p) => `position[]=${p}`).join("&");
    const promise = fetch(`https://api.sleeper.com/projections/nfl/${season}/${week}?season_type=regular&${qs}`)
      .then((res) => { if (!res.ok) throw new Error(`Sleeper projections failed (${res.status})`); return res.json(); })
      .then((list) => Object.fromEntries((list || []).filter((r) => r.stats).map((r) => [r.player_id, {
        pos: r.player?.fantasy_positions || [r.player?.position], position: r.player?.position || null,
        name: [r.player?.first_name, r.player?.last_name].filter(Boolean).join(" "),
        team: r.team || r.player?.team || null, opp: r.opponent || null, status: r.player?.injury_status || null,
        stats: r.stats,
      }])));
    promise.catch(() => weekProjectionCache.delete(key));
    weekProjectionCache.set(key, promise);
  }
  return weekProjectionCache.get(key);
}

// A projected stat line in the league's scoring.
const scoreStats = (stats, scoring) =>
  Object.entries(stats).reduce((s, [k, v]) => s + (typeof v === "number" && scoring[k] ? scoring[k] * v : 0), 0);

// Best lineup by points: strictest slots first, each with the best player left who fits.
function bestLineupPoints(players, slots) {
  const left = [...players].sort((a, b) => b.pts - a.pts);
  let total = 0;
  for (const slot of slots) {
    const i = left.findIndex((p) => p.pos.some((x) => PROJ_SLOTS[slot].includes(x)));
    if (i >= 0) total += left.splice(i, 1)[0].pts;
  }
  return total;
}

const pointsOf = (st, key) => (st?.[key] || 0) + (st?.[`${key}_decimal`] || 0) / 100;

// Standard normal draw (Box-Muller).
const randomNormal = () => Math.sqrt(-2 * Math.log(1 - Math.random())) * Math.cos(2 * Math.PI * Math.random());

// Standard normal CDF (Abramowitz-Stegun 7.1.26, good to about 1e-7).
function normalCdf(z) {
  const t = 1 / (1 + 0.3275911 * Math.abs(z) / Math.SQRT2);
  const erf = 1 - t * (0.254829592 + t * (-0.284496736 + t * (1.421413741 + t * (-1.453152027 + t * 1.061405429))))
    * Math.exp(-z * z / 2);
  return z >= 0 ? (1 + erf) / 2 : (1 - erf) / 2;
}

// A team's week from the lineup it has set: points already scored, plus
// projections for the starters still to play (`open`), slot by slot.
function starterProjection(entry, ptsOf) {
  let mean = 0, open = 0;
  const rows = (entry?.starters || []).map((id) => {
    const scored = entry.players_points?.[id] || 0;
    const proj = scored ? 0 : ptsOf(id);
    mean += scored || proj;
    open += proj;
    return { id, scored, proj };
  });
  return { mean, open, rows };
}

// Odds that team a outscores team b, each drawn around its projection with
// STANDINGS_SPREAD of its unplayed points as one standard deviation (as in the sims).
function winOdds(a, b) {
  const sd = STANDINGS_SPREAD * Math.hypot(a.open, b.open);
  const diff = a.mean - b.mean;
  if (sd < 0.01) return diff > 0 ? 1 : diff < 0 ? 0 : 0.5;
  return normalCdf(diff / sd);
}

// Sleeper ids of players out for the season: season-ending entries in the
// hand-kept INJURED_RESERVE list, plus anyone Sleeper has on IR or PUP with a
// torn ACL or Achilles.
function seasonOverIds(sleeperPlayers, resolve) {
  const ids = new Set();
  for (const r of INJURED_RESERVE) {
    if (!r.seasonEnding) continue;
    if (r.id.startsWith("sl-")) { ids.add(r.id.slice(3)); continue; } // extra players carry their Sleeper id
    const p = samplePlayers.find((x) => x.id === r.id);
    const id = p && resolve(r.id, p.name, p.position);
    if (id) ids.add(id);
  }
  for (const [id, sp] of Object.entries(sleeperPlayers)) {
    if (["IR", "PUP"].includes(sp.status) && SEASON_ENDING_INJURY.test(sp.injury || "")) ids.add(id);
  }
  return ids;
}

// Why a player can't start (or null), the same designations as the Injuries
// page: out for the season (seasonOverIds), or on Sleeper's IR, PUP or
// suspended list, all `longTerm`; or just this week, ruled Out (or NA) or on
// a bye. Doubtful and Questionable players still start.
const LONG_TERM_STATUS = { IR: "IR", PUP: "PUP", Sus: "Suspended" };
const byeWeekOf = (team) => BYE_WEEKS[team] ?? BYE_WEEKS[{ WAS: "WSH", WSH: "WAS" }[team]];
function sidelinedReason(p, sleeperPlayers, seasonOver, week) {
  if (seasonOver.has(p.id)) return { label: "Out for season", longTerm: true };
  const status = sleeperPlayers[p.id]?.status;
  if (LONG_TERM_STATUS[status]) return { label: LONG_TERM_STATUS[status], longTerm: true };
  if (status === "Out" || status === "NA") return { label: "Out", longTerm: false };
  if (week && byeWeekOf(p.team) === week) return { label: "Bye", longTerm: false };
  return null;
}

// Loads the remaining schedule and projections, then simulates the season.
function useProjectedStandings(raw, enabled) {
  const resolve = React.useContext(NflIdContext);
  const sleeperPlayers = useSleeperStatuses();
  const seasonOver = useMemo(() => seasonOverIds(sleeperPlayers, resolve), [sleeperPlayers, resolve]);
  const [state, setState] = useState({ status: "idle" });
  useEffect(() => {
    if (!enabled || !raw) return;
    let cancelled = false;
    const { league, rosters } = raw;
    const st = league.settings || {};
    const lastScored = st.last_scored_leg || 0;
    const firstReg = st.start_week || 1;
    const lastReg = (st.playoff_week_start || 15) - 1;
    const weeks = [];
    for (let w = Math.max(lastScored + 1, firstReg); w <= lastReg; w++) weeks.push(w);

    const now = rosters.map((r) => ({
      rosterId: r.roster_id, wins: r.settings?.wins || 0, losses: r.settings?.losses || 0, ties: r.settings?.ties || 0,
      pf: pointsOf(r.settings, "fpts"), pa: pointsOf(r.settings, "fpts_against"), maxPf: pointsOf(r.settings, "ppts"),
    }));
    if (!weeks.length) { setState({ status: "ready", now, projected: null, weeks }); return; }

    setState({ status: "loading", now, weeks });
    (async () => {
      const slots = (league.roster_positions || []).filter((s) => PROJ_SLOTS[s]);
      const positions = [...new Set(slots.flatMap((s) => PROJ_SLOTS[s]))];
      const scoring = league.scoring_settings || {};
      const [schedules, projections] = await Promise.all([
        Promise.all(weeks.map((w) => sleeperGet(`/league/${league.league_id}/matchups/${w}`).then((m) => m || []))),
        Promise.all(weeks.map((w) => fetchWeekProjections(league.season, w, positions))),
      ]);
      if (cancelled) return;

      // Each team's expected points, spread and max PF per remaining week.
      const efficiency = Object.fromEntries(now.map((t) =>
        [t.rosterId, t.maxPf > 0 ? Math.min(1, Math.max(0.75, t.pf / t.maxPf)) : 0.9]));
      const games = weeks.map((w, wi) => {
        const proj = projections[wi];
        const ptsOf = (id) => (proj[id] && !seasonOver.has(id) ? scoreStats(proj[id].stats, scoring) : 0);
        const entries = schedules[wi];
        const started = entries.some((e) => (e.points || 0) > 0);
        const teams = {};
        for (const r of rosters) {
          const e = entries.find((x) => x.roster_id === r.roster_id);
          const taxi = new Set(r.taxi || []);
          const pool = (r.players || []).filter((id) => !taxi.has(id) && proj[id])
            .map((id) => ({ pts: started ? (e?.players_points?.[id] || ptsOf(id)) : ptsOf(id), pos: proj[id].pos }));
          const maxPf = bestLineupPoints(pool, slots);
          if (started && e) {
            // Under way: real lineups, real points where scored, projections for the rest.
            const { mean, open } = starterProjection(e, ptsOf);
            teams[r.roster_id] = { mean, sd: open * STANDINGS_SPREAD, maxPf: Math.max(maxPf, mean) };
          } else {
            const mean = maxPf * efficiency[r.roster_id];
            teams[r.roster_id] = { mean, sd: mean * STANDINGS_SPREAD, maxPf };
          }
        }
        const byMatchup = {};
        for (const e of entries) if (e.matchup_id) (byMatchup[e.matchup_id] ||= []).push(e.roster_id);
        return { teams, pairs: Object.values(byMatchup).filter((p) => p.length === 2) };
      });

      // Simulate the rest of the season.
      const ids = now.map((t) => t.rosterId);
      const n = ids.length;
      const playoffTeams = Math.min(st.playoff_teams || 0, n);
      const median = !!st.league_average_match;
      const sum = Object.fromEntries(ids.map((id) => [id, { wins: 0, losses: 0, ties: 0, pf: 0, pa: 0, playoffs: 0, top: 0, seed: 0 }]));
      for (let s = 0; s < STANDINGS_SIMS; s++) {
        const tally = Object.fromEntries(now.map((t) => [t.rosterId, { ...t }]));
        for (const g of games) {
          const score = {};
          for (const id of ids) { const t = g.teams[id]; score[id] = Math.max(0, t.mean + t.sd * randomNormal()); tally[id].pf += score[id]; }
          for (const [a, b] of g.pairs) {
            tally[a].pa += score[b]; tally[b].pa += score[a];
            if (score[a] > score[b]) { tally[a].wins++; tally[b].losses++; }
            else if (score[b] > score[a]) { tally[b].wins++; tally[a].losses++; }
            else { tally[a].ties++; tally[b].ties++; }
          }
          if (median) {
            const sorted = ids.map((id) => score[id]).sort((x, y) => x - y);
            const mid = (sorted[Math.floor((n - 1) / 2)] + sorted[Math.ceil((n - 1) / 2)]) / 2;
            for (const id of ids) { if (score[id] > mid) tally[id].wins++; else if (score[id] < mid) tally[id].losses++; else tally[id].ties++; }
          }
        }
        const order = [...ids].sort((a, b) =>
          (tally[b].wins + tally[b].ties / 2) - (tally[a].wins + tally[a].ties / 2) || tally[b].pf - tally[a].pf);
        order.forEach((id, i) => {
          const t = tally[id], acc = sum[id];
          acc.wins += t.wins; acc.losses += t.losses; acc.ties += t.ties; acc.pf += t.pf; acc.pa += t.pa; acc.seed += i + 1;
          if (i < playoffTeams) acc.playoffs++;
          if (i === 0) acc.top++;
        });
      }
      const projected = Object.fromEntries(ids.map((id) => {
        const acc = sum[id];
        const maxPf = now.find((t) => t.rosterId === id).maxPf + games.reduce((s, g) => s + g.teams[id].maxPf, 0);
        return [id, {
          wins: acc.wins / STANDINGS_SIMS, losses: acc.losses / STANDINGS_SIMS, ties: acc.ties / STANDINGS_SIMS,
          pf: acc.pf / STANDINGS_SIMS, pa: acc.pa / STANDINGS_SIMS, maxPf,
          playoffs: acc.playoffs / STANDINGS_SIMS, top: acc.top / STANDINGS_SIMS, seed: acc.seed / STANDINGS_SIMS,
        }];
      }));
      setState({ status: "ready", now, projected, weeks, playoffTeams, underway: games.length && schedules[0].some((e) => (e.points || 0) > 0) });
    })().catch((err) => { if (!cancelled) setState({ status: "error", message: err.message, now, weeks }); });
    return () => { cancelled = true; };
  }, [raw, enabled, seasonOver]);
  return state;
}

const fmtPts = (x) => x.toLocaleString(undefined, { minimumFractionDigits: 1, maximumFractionDigits: 1 });
const fmtRecord = (w, l, t) => `${w}-${l}${t ? `-${t}` : ""}`;
// An average simulated record, rounded to whole games that still add up.
function roundRecord(p) {
  const games = Math.round(p.wins + p.losses + p.ties);
  const wins = Math.round(p.wins), ties = Math.round(p.ties);
  return fmtRecord(wins, Math.max(0, games - wins - ties), ties);
}

function ProjectedStandings({ proj, raw, teams, myTeam, team, onView }) {
  const [view, setView] = useState("projected");
  const nameOf = Object.fromEntries(teams.map((t) => [t.rosterId, t]));
  const now = proj.now || [];
  const projected = proj.projected;
  const showProjected = view === "projected" && projected;
  const playoffTeams = proj.playoffTeams || Math.min(raw.league.settings?.playoff_teams || 0, now.length);
  const rows = [...now].sort(showProjected
    ? (a, b) => projected[a.rosterId].seed - projected[b.rosterId].seed
    : (a, b) => (b.wins + b.ties / 2) - (a.wins + a.ties / 2) || b.pf - a.pf);
  const pct = (x) => (x >= 0.995 ? ">99%" : x > 0 && x < 0.005 ? "<1%" : `${Math.round(x * 100)}%`);
  const weeks = proj.weeks || [];
  const th = "px-2 py-2 text-xs font-semibold whitespace-nowrap";
  const thStyle = { color: "var(--text-muted)" };
  const td = "px-2 py-1.5 tabular-nums text-right whitespace-nowrap";

  const aside = !weeks.length ? "Regular season complete"
    : proj.status === "loading" ? "Projecting the rest of the season…"
    : `Weeks ${weeks[0]}-${weeks[weeks.length - 1]} projected${proj.underway ? ` (week ${weeks[0]} under way)` : ""}`;

  return (
    <ProfileSection title="Standings" aside={aside}>
      <div className="flex items-center justify-between gap-3 flex-wrap">
        {weeks.length > 0 && (
          <PillGroup options={[{ key: "projected", label: "End of season" }, { key: "current", label: "Today" }]}
            value={view} onChange={setView} />
        )}
        {playoffTeams > 0 && (
          <span className="text-xs" style={{ color: "var(--text-muted)" }}>Top {playoffTeams} make the playoffs</span>
        )}
      </div>
      {proj.status === "error" && (
        <p className="text-xs" style={{ color: "var(--series-red)" }}>
          Couldn't load Sleeper's projections ({proj.message}), so these are today's standings only.
        </p>
      )}
      <div className="overflow-x-auto -mx-1">
        <table className="w-full text-sm border-collapse">
          <thead>
            <tr style={{ borderBottom: "1px solid var(--border)" }}>
              <th className={`${th} text-right`} style={thStyle}>#</th>
              <th className={`${th} text-left`} style={thStyle}>Team</th>
              <th className={`${th} text-right`} style={thStyle}>Record</th>
              <th className={`${th} text-right`} style={thStyle} title="Points for">PF</th>
              <th className={`${th} text-right`} style={thStyle} title="Points against">PA</th>
              <th className={`${th} text-right`} style={thStyle} title="Max points for: the best lineup each week could have scored">Max PF</th>
              {showProjected && <th className={`${th} text-right`} style={thStyle} title="Chance of a playoff spot">Playoffs</th>}
              {showProjected && <th className={`${th} text-right`} style={thStyle} title="Chance of the 1 seed">1 seed</th>}
            </tr>
          </thead>
          <tbody>
            {rows.map((t, i) => {
              const p = showProjected ? projected[t.rosterId] : null;
              const info = nameOf[t.rosterId];
              const mine = info && info === myTeam;
              const cutoff = playoffTeams > 0 && i === playoffTeams - 1 && i < rows.length - 1;
              const sub = (a, b) => <span className="block text-xs font-normal" style={{ color: "var(--text-muted)" }}>{a} {b}</span>;
              return (
                <tr key={t.rosterId} className="row-hover"
                  style={{ borderBottom: cutoff ? "2px dashed var(--sport)" : "1px solid var(--border)",
                    background: info && info === team ? "var(--surface-2)" : undefined }}>
                  <td className={td} style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                  <td className="px-2 py-1.5 text-left">
                    <button type="button" onClick={() => info && onView(t.rosterId)} title={info ? `View ${info.name}` : undefined}
                      className={`text-left ${mine ? "font-bold" : "font-medium"}`} style={{ color: "var(--text-primary)" }}>
                      {info?.name || `Team ${t.rosterId}`}
                      {mine && <span className="text-xs font-normal" style={{ color: "var(--sport)" }}> (you)</span>}
                    </button>
                  </td>
                  {p ? (
                    <>
                      <td className={td} title={`Average simulated record: ${p.wins.toFixed(1)}-${p.losses.toFixed(1)}${p.ties >= 0.05 ? `-${p.ties.toFixed(1)}` : ""}`}>
                        <strong>{roundRecord(p)}</strong>{sub("now", fmtRecord(t.wins, t.losses, t.ties))}
                      </td>
                      <td className={td}>{fmtPts(p.pf)}{sub("now", fmtPts(t.pf))}</td>
                      <td className={td}>{fmtPts(p.pa)}{sub("now", fmtPts(t.pa))}</td>
                      <td className={td}>{fmtPts(p.maxPf)}{sub("now", fmtPts(t.maxPf))}</td>
                      <td className={td}><strong>{pct(p.playoffs)}</strong></td>
                      <td className={td}>{pct(p.top)}</td>
                    </>
                  ) : (
                    <>
                      <td className={td}><strong>{fmtRecord(t.wins, t.losses, t.ties)}</strong></td>
                      <td className={td}>{fmtPts(t.pf)}</td>
                      <td className={td}>{fmtPts(t.pa)}</td>
                      <td className={td}>{fmtPts(t.maxPf)}</td>
                    </>
                  )}
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        {showProjected
          ? <>End-of-season numbers average {STANDINGS_SIMS.toLocaleString()} simulated seasons on the league's real schedule,
            using Sleeper's weekly projections in this league's scoring. Each team is assumed to keep starting as close to its
            best lineup as it has so far (PF ÷ max PF); max PF assumes the best lineup every week. Seeds go by wins, then
            points for. Rosters are today's, so trades, waivers and injuries will move this.</>
          : <>Record, points for, points against and max points for (the best lineup each week could have scored), straight
            from Sleeper through the last scored week.{weeks.length > 0 && proj.status === "loading" && " Projections are loading…"}</>}
      </p>
    </ProfileSection>
  );
}

// A team's roster, opened from the power rankings: its QB, RB, WR and TE
// (best first) and, in dynasty, its picks, with values and injury tags.
/* ---------------- Film Room: weekly rankings and start/sit ---------------- */
// Every skill player ranked by Sleeper's projection for the week, in the
// shared scoring setting (Sleeper's own pts_ppr / pts_half_ppr / pts_std),
// plus TE premium as the setting's bonus per TE catch. Players on bye have no
// projection, so they don't appear.
const PROJ_PTS_KEY = { 1: "pts_ppr", 0.5: "pts_half_ppr", 0: "pts_std" };
const projectedPoints = (stats, position, settings) =>
  (stats[PROJ_PTS_KEY[settings.ppr] || "pts_ppr"] || 0) + (position === "TE" ? (settings.tep || 0) * (stats.rec || 0) : 0);
const FILM_ROOM_LIMIT = 150;

// Sleeper's season schedule (date, home, away per game; no kickoff times),
// fetched once per visit: {week: {team: {opp, home, date}}}.
let nflSchedule = null;
function fetchNflSchedule(season) {
  return nflSchedule || (nflSchedule = fetch(`https://api.sleeper.app/schedule/nfl/regular/${season}`)
    .then((res) => (res.ok ? res.json() : [])).catch(() => [])
    .then((games) => {
      const out = {};
      for (const g of games || []) {
        const wk = out[g.week] || (out[g.week] = {});
        const home = TEAM_ALIASES_NFL[g.home] || g.home, away = TEAM_ALIASES_NFL[g.away] || g.away;
        wk[home] = { opp: away, home: true, date: g.date };
        wk[away] = { opp: home, home: false, date: g.date };
      }
      return out;
    }));
}
const TEAM_ALIASES_NFL = { WAS: "WSH" };

// How generous each defense has been to each position: the average PPR points
// it allows per game, ranked 1 (most) to 32. Built from the live weekly stats.
function defenseRanks(allowed) {
  const totals = {};
  for (const wk of Object.values(allowed || {})) {
    for (const [def, byPos] of Object.entries(wk)) {
      for (const pos of SKILL_POSITIONS) {
        const t = (totals[pos] = totals[pos] || {})[def] || (totals[pos][def] = { pts: 0, games: 0 });
        t.pts += byPos[pos] || 0;
        t.games++;
      }
    }
  }
  const ranks = {};
  for (const [pos, defs] of Object.entries(totals)) {
    Object.entries(defs).map(([def, t]) => [def, t.pts / t.games]).sort((a, b) => b[1] - a[1])
      .forEach(([def, avg], i) => { (ranks[def] = ranks[def] || {})[pos] = { rank: i + 1, avg, of: Object.keys(defs).length }; });
  }
  return ranks;
}

// "@ GB · Sun" plus a matchup tag: the 8 defenses allowing the most to that
// position are a good matchup, the 8 allowing the least a tough one.
function Matchup({ r, game, ranks }) {
  const opp = game?.opp || r.opp;
  if (!opp) return <span style={{ color: "var(--text-muted)" }}>–</span>;
  const day = game?.date ? new Date(game.date + "T12:00:00").toLocaleDateString(undefined, { weekday: "short" }) : null;
  const d = ranks[opp]?.[r.position];
  const tag = d && (d.rank <= 8 ? { label: "Good", color: "var(--trend-up)" } : d.rank > d.of - 8 ? { label: "Tough", color: "var(--series-red)" } : null);
  return (
    <span className="whitespace-nowrap" title={d ? `${opp} allows the ${ordinal(d.rank)}-most points to ${r.position}s (${fmtPts(d.avg)} a game)` : undefined}>
      <span style={{ color: "var(--text-secondary)" }}>{game ? (game.home ? "vs " : "@ ") : ""}{opp}</span>
      {day && <span className="text-xs" style={{ color: "var(--text-muted)" }}> · {day}</span>}
      {tag && <span className="text-[11px] font-semibold ml-1.5" style={{ color: tag.color }}>{tag.label}</span>}
    </span>
  );
}

function NflRankings({ settings, setSettings, scores }) {
  const sleeperPlayers = useSleeperStatuses();
  const resolve = React.useContext(NflIdContext);
  const seasonOver = useMemo(() => seasonOverIds(sleeperPlayers, resolve), [sleeperPlayers, resolve]);
  const [nfl, setNfl] = useState({ status: "loading" });
  useEffect(() => {
    sleeperGet("/state/nfl").then((s) => setNfl({ status: "ready", ...s })).catch((err) => setNfl({ status: "error", message: err.message }));
  }, []);
  const currentWeek = nfl.status === "ready" ? Math.min(18, Math.max(1, nfl.week || 1)) : null;
  const [pickedWeek, setWeek] = useState(null);
  const week = pickedWeek ?? currentWeek;
  const [res, setRes] = useState({ status: "loading" });
  useEffect(() => {
    if (!week) return;
    let cancelled = false;
    setRes({ status: "loading" });
    fetchWeekProjections(nfl.season, week, SKILL_POSITIONS)
      .then((proj) => { if (!cancelled) setRes({ status: "ready", proj }); })
      .catch((err) => { if (!cancelled) setRes({ status: "error", message: err.message }); });
    return () => { cancelled = true; };
  }, [nfl.season, week]);

  const rows = useMemo(() => {
    if (res.status !== "ready") return [];
    const list = Object.entries(res.proj)
      .map(([id, p]) => {
        const sp = sleeperPlayers[id];
        const position = p.position || sp?.position;
        const r = { id, name: sp?.name || p.name, position, team: p.team || sp?.team, opp: p.opp, status: sp?.status || p.status,
          pts: projectedPoints(p.stats, position, settings) };
        r.reason = sidelinedReason(r, sleeperPlayers, seasonOver, week);
        return r;
      })
      .filter((r) => SKILL_POSITIONS.includes(r.position) && r.pts >= 0.5)
      .sort((a, b) => b.pts - a.pts);
    const counts = {};
    for (const r of list) r.posRank = (counts[r.position] = (counts[r.position] || 0) + 1);
    return list;
  }, [res, sleeperPlayers, seasonOver, settings.ppr, settings.tep, week]);
  const byId = useMemo(() => Object.fromEntries(rows.map((r) => [r.id, r])), [rows]);
  const [schedule, setSchedule] = useState({});
  useEffect(() => { if (nfl.season) fetchNflSchedule(nfl.season).then(setSchedule); }, [nfl.season]);
  const ranks = useMemo(() => defenseRanks(scores?.allowed), [scores?.allowed]);
  const gameOf = (r) => schedule[week]?.[r.team];

  const [positionFilter, setPositionFilter] = useState("ALL");
  const shown = rows.filter((r) => positionFilter === "ALL" || r.position === positionFilter).slice(0, FILM_ROOM_LIMIT);

  // Start/Sit: two to four players, best healthy projection starts.
  const [compare, setCompare] = useState([]);
  const pickRows = useMemo(() => rows.map((r) => ({ ...r, value: Number(r.pts.toFixed(1)) })), [rows]);
  const picked = compare.map((id) => byId[id]).filter(Boolean);
  const ranked = [...picked].sort((a, b) => (!!a.reason - !!b.reason) || b.pts - a.pts);
  const best = ranked[0] && !ranked[0].reason ? ranked[0] : null;
