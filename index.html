    try { localStorage.setItem(SPORT_KEY, sport); } catch (e) {}
    if (sport !== saved) setSaved(sport);
  }, [sport]);
  return [sport, setSaved];
}

// Light/dark: follows the OS until the toggle is used, then remembers the choice.
const THEME_KEY = "ff-valuediff:theme";
function useTheme() {
  const prefersDark = () => window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
  const [theme, setTheme] = useState(() => document.documentElement.dataset.theme || (prefersDark() ? "dark" : "light"));
  const toggle = () => {
    const next = theme === "dark" ? "light" : "dark";
    document.documentElement.dataset.theme = next;
    try { localStorage.setItem(THEME_KEY, next); } catch (e) {}
    setTheme(next);
  };
  return [theme, toggle];
}

    document.addEventListener("mousedown", onDoc);
    document.addEventListener("keydown", onKey);
    return () => { document.removeEventListener("mousedown", onDoc); document.removeEventListener("keydown", onKey); };
  }, [open]);

  const enter = () => { clearTimeout(closeTimer.current); if (!open) { openedAt.current = Date.now(); setOpen(true); } };

  return (
    <div ref={ref} className="relative" onMouseEnter={enter} onMouseLeave={leave}>
      <button type="button" className="nav-trigger" aria-haspopup="true" aria-expanded={open} data-active={active}

/* ---------------- Front Desk: player search ---------------- */
// Opens from the header (or Ctrl/Cmd+K, or "/") on any page and jumps to a
// player's profile. Football searches Sleeper's player list plus the dynasty
// values (valued players rank first); basketball loads the NBA data the first
// time it's searched.
const foldName = (s) => (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/[^a-z0-9 ]+/g, "");

// Best matches first: every word of the query starts a word of the name
// ("jef", "jus jef"), then the name merely contains it; within each, the more
// valuable (or productive) player first, so "jef" finds Justin Jefferson.
function searchPlayers(list, query, limit = 10) {
  const q = foldName(query).trim().replace(/\s+/g, " ");
  if (!q) return [];
  const tokens = q.split(" ");
  const hits = [];
  for (const p of list) {
    const words = p.folded.split(" ");
    const score = tokens.every((t) => words.some((w) => w.startsWith(t))) ? 0 : p.folded.includes(q) ? 1 : -1;
    if (score >= 0) hits.push([score, p]);
  }
  return hits.sort((a, b) => a[0] - b[0] || b[1].rank - a[1].rank).slice(0, limit).map((h) => h[1]);
}

function useSearchShortcut(open) {
  useEffect(() => {
    const onKey = (e) => {
      const typing = /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName) || e.target.isContentEditable;
      if ((e.key === "k" && (e.ctrlKey || e.metaKey)) || (e.key === "/" && !typing)) { e.preventDefault(); open(); }
    };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);
}

function PlayerSearch({ sport, dynasty, sleeperPlayers, nba, onNeedNba, onClose }) {
  const [scope, setScope] = useState(sport);
  const [query, setQuery] = useState("");
  const [active, setActive] = useState(0);
  useEffect(() => { if (scope === "nba") onNeedNba(); }, [scope]);
  useEffect(() => {
    const onKey = (e) => { if (e.key === "Escape") onClose(); };
    document.addEventListener("keydown", onKey);
    return () => document.removeEventListener("keydown", onKey);
  }, []);

  const nflList = useMemo(() => {
    const valued = Object.fromEntries(dynasty.rows.filter((r) => r.position !== "PICK").map((r) => [r.id, r]));
    const list = Object.entries(sleeperPlayers).map(([id, p]) =>
      ({ id, name: p.name, position: p.position, team: p.team, status: p.status, value: valued[id]?.value }));
    const listed = new Set(list.map((p) => p.id));
    for (const r of Object.values(valued)) if (!listed.has(r.id)) list.push({ id: r.id, name: r.name, position: r.position, team: r.team, value: r.value });
    return list.map((p) => ({ ...p, rank: p.value || 0, folded: foldName(p.name) }));
  }, [sleeperPlayers, dynasty.rows]);
  const nbaList = useMemo(() => {
    const pts = Object.fromEntries((nba.seasons?.[nba.activeSeason] || []).map((p) => [p.id, p.stats?.pts || 0]));
    return Object.entries(nba.players || {}).map(([id, p]) =>
      ({ id, name: p.name, position: p.position, team: p.team, status: p.status, rank: pts[id] || 0, folded: foldName(p.name) }));
  }, [nba.players, nba.seasons, nba.activeSeason]);

  const results = useMemo(() => searchPlayers(scope === "nba" ? nbaList : nflList, query), [scope, nflList, nbaList, query]);
  useEffect(() => setActive(0), [query, scope]);
  const open = (p) => {
    window.location.hash = playerHash(scope, p.id);
    window.scrollTo(0, 0);
    onClose();
  };
  const onKeyDown = (e) => {
    if (e.key === "ArrowDown") { e.preventDefault(); setActive((i) => Math.min(results.length - 1, i + 1)); }
    else if (e.key === "ArrowUp") { e.preventDefault(); setActive((i) => Math.max(0, i - 1)); }
    else if (e.key === "Enter" && results[active]) { e.preventDefault(); open(results[active]); }
  };
  const nbaLoading = scope === "nba" && nba.status !== "live";
  const muted = { color: "var(--text-muted)" };

  return (
    <div className="search-backdrop fixed inset-0 z-50 flex items-start justify-center px-4 pt-[10vh]"
      onMouseDown={(e) => { if (e.target === e.currentTarget) onClose(); }}>
      <div role="dialog" aria-modal="true" aria-label="Search players"
        className="search-panel w-full max-w-lg rounded-xl border shadow-2xl overflow-hidden"
        style={{ background: "var(--surface-1)", borderColor: "var(--border)" }}>
        <div className="flex items-center gap-2 px-3 py-2.5 border-b" style={{ borderColor: "var(--border)" }}>
          <span style={muted}><Svg>{Icon.search}</Svg></span>
          <input autoFocus value={query} onChange={(e) => setQuery(e.target.value)} onKeyDown={onKeyDown}
            placeholder={`Search ${scope === "nba" ? "basketball" : "football"} players`} aria-label="Player name"
            className="flex-1 min-w-0 bg-transparent outline-none text-base" style={{ color: "var(--text-primary)" }} />
          <PillGroup options={SPORTS.map((s) => ({ key: s.key, label: s.key.toUpperCase(), color: s.color }))} value={scope} onChange={setScope} sportColors />
        </div>
        <ul className="max-h-[60vh] overflow-y-auto p-1.5" role="listbox">
          {results.map((p, i) => (
            <li key={p.id} role="option" aria-selected={i === active}>
              <button type="button" onMouseEnter={() => setActive(i)} onClick={() => open(p)}
                className="menu-row w-full text-left flex items-center gap-3 rounded-lg px-2.5 py-2"
                style={i === active ? { background: "var(--surface-2)" } : undefined}>
                <Headshot sport={scope} id={p.id} pos={p.position} size={32} />
                <span className="min-w-0 flex-1">
                  <span className="block text-sm font-semibold truncate" style={{ color: "var(--text-primary)" }}>{p.name}</span>
                  <span className="flex items-center gap-1.5 text-xs" style={muted}>
                    <PosBadge pos={p.position} /> {p.team || "FA"}
                    {p.status && <span style={{ color: REPORT_STATUS_COLOR[p.status] || "var(--series-red)" }}>· {p.status}</span>}
                  </span>
                </span>
                {scope === "nfl" && p.value > 0 && <span className="text-xs tabular-nums shrink-0" style={{ color: "var(--text-secondary)" }}>{fmtValue(p.value)}</span>}
              </button>
            </li>
          ))}
          {!query.trim() && <li className="px-3 py-4 text-sm" style={muted}>Type a name to open any player's file.</li>}
          {query.trim() && !results.length && (
            <li className="px-3 py-4 text-sm" style={muted}>{nbaLoading ? "Loading basketball players…" : "No players match that name."}</li>
          )}
        </ul>
        <div className="flex items-center justify-between gap-3 px-3 py-2 border-t text-[11px]" style={{ borderColor: "var(--border)", ...muted }}>
          <span className="font-display font-semibold tracking-wide">Front Desk</span>
          <span className="hidden sm:inline">↑ ↓ to move · Enter to open · Esc to close</span>
        </div>
      </div>
    </div>
  );
}

// Phones get an app-style bar of the rooms people open most; the hamburger
// still lists every room.
const TAB_BAR = {
  nfl: ["weekly", "waivers", "nfl-rankings", "trade", "leagues"],
  nba: ["nba-weekly", "nba-waivers", "nba-rankings", "nba-trade", "nba-injuries"],
};
function MobileTabBar({ sport, page, navigate }) {
  return (
    <nav className="tab-bar md:hidden fixed bottom-0 inset-x-0 z-40 grid grid-cols-5" aria-label="Quick links">
      {TAB_BAR[sport].map((key) => {
        const p = PAGE_BY_KEY[key];
        return (
          <a key={key} href={p.hash} aria-current={page === key ? "page" : undefined}
            onClick={(e) => { e.preventDefault(); navigate(key); }}
            className="flex flex-col items-center gap-1 pt-2 pb-1.5 px-0.5 text-[10.5px] font-semibold min-w-0">
            <Svg size={20}>{PAGE_STYLE[key].icon}</Svg>
            <span className="truncate max-w-full">{p.short}</span>
          </a>
        );
      })}
    </nav>
  );
}

function SiteHeader({ page, navigate, sport, setSport, theme, toggleTheme, onSearch }) {
  const [open, setOpen] = useState(false);
  const go = (key) => { setOpen(false); navigate(key); };
  return (
    <header className="site-header sticky top-0 z-40">
      <div className="max-w-6xl mx-auto px-4 h-14 flex items-center gap-3">
        <Logo onClick={() => go("home")} />
        <div className="hidden md:block">
          <SportSwitch sport={sport} page={page} navigate={go} setSport={setSport} />
        </div>
        <nav className="hidden md:flex items-center gap-1" aria-label="Main">
          {SPORT_GROUPS[sport].map((g) => <NavDropdown key={g} sport={sport} group={g} page={page} navigate={go} />)}
        </nav>
        <div className="ml-auto flex items-center gap-1">
          <button type="button" onClick={onSearch} className="search-trigger hidden lg:inline-flex items-center gap-2 rounded-md pl-2.5 pr-1.5 py-1.5 text-sm mr-1">
            <Svg size={16}>{Icon.search}</Svg>Search players<kbd className="kbd">Ctrl K</kbd>
          </button>
          <button type="button" onClick={onSearch} className="nav-link rounded-md p-2 lg:hidden" aria-label="Search players">
            <Svg>{Icon.search}</Svg>
          </button>
          <a href={PAGE_BY_KEY[SPORT_TRADE_PAGE[sport]].hash} onClick={(e) => { e.preventDefault(); go(SPORT_TRADE_PAGE[sport]); }}
            className="btn-primary hidden lg:inline-flex rounded-md px-3 py-1.5 text-sm font-semibold mr-1">Trade Desk</a>
          <button type="button" onClick={toggleTheme} className="nav-link rounded-md p-2"
            aria-label={theme === "dark" ? "Switch to light mode" : "Switch to dark mode"}>
            <Svg>{theme === "dark" ? Icon.sun : Icon.moon}</Svg>
          </button>
          <button type="button" onClick={() => setOpen(!open)} className="nav-link rounded-md p-2 md:hidden"
            aria-label={open ? "Close menu" : "Open menu"} aria-expanded={open}>
            <Svg>{open ? Icon.close : Icon.menu}</Svg>
          </button>
        </div>
      </div>
      {open && (
        <nav className="md:hidden border-t px-4 py-3 flex flex-col gap-3" style={{ borderColor: "rgba(255, 255, 255, 0.12)" }}
          aria-label="Main">
          <SportSwitch sport={sport} page={page} navigate={go} setSport={setSport} />
          {SPORT_GROUPS[sport].map((g) => (
            <div key={g} className="flex flex-col">
              <span className="nav-group text-[11px] font-semibold uppercase tracking-wider px-3 pb-1">{g}</span>
              {sportPages(sport, g).map((p) => <NavLink key={p.key} p={p} page={page} navigate={go} className="block" />)}
            </div>
          ))}
        </nav>
      )}
    </header>
  );
}

function FeatureCard({ p, navigate }) {
  const { hue, icon } = PAGE_STYLE[p.key];
  return (
    <a href={p.hash} onClick={(e) => { e.preventDefault(); navigate(p.key); }}
      className="card-link folder rounded-xl border p-5 flex flex-col gap-3" data-tab={p.short}
      style={{ borderColor: "var(--border)", "--card-hue": hue }}>
      <span className="w-10 h-10 rounded-lg flex items-center justify-center"
        style={{ background: `color-mix(in srgb, ${hue} 16%, transparent)`, color: hue }}>
        <Svg size={20}>{icon}</Svg>
      </span>
      <span className="font-semibold" style={{ color: "var(--text-primary)" }}>{p.label}</span>
      <span className="text-sm flex-1" style={{ color: "var(--text-secondary)" }}>{p.blurb}</span>
      <span className="text-sm font-semibold" style={{ color: hue }}>Open <span className="card-arrow">→</span></span>
    </a>
  );
}

function HomePage({ navigate, scores, dynasty, sport, setSport }) {
  const myLeague = React.useContext(MyLeagueContext);
  const weeks = playedWeeks(scores.scores);
  const latestWeek = weeks[weeks.length - 1];
  const players = dynasty.rows.filter((r) => r.position !== "PICK");
  // Biggest 30-day risers among players worth a real roster spot.
  const risers = players.filter((r) => r.value >= 1500 && r.trend30 > 0).sort((a, b) => b.trend30 - a.trend30).slice(0, 5);

  return (
    <div className="flex flex-col gap-12">
      <section className="hero-glow -mx-4 px-4 pt-10 pb-4 sm:pt-16 text-center flex flex-col items-center gap-5">
        <span className="text-xs font-semibold uppercase tracking-wider rounded-md border px-3 py-1"
          style={{ borderColor: "var(--sport)", color: "var(--sport)", background: "var(--surface-1)" }}>
          Football{latestWeek ? ` · Week ${latestWeek}` : ""} · Basketball
        </span>
        <h1 className="text-4xl sm:text-5xl font-extrabold tracking-tight max-w-3xl" style={{ color: "var(--text-primary)", lineHeight: 1.1 }}>
          Run your fantasy team like a <span className="text-gradient">GM</span>
        </h1>
        <p className="text-base sm:text-lg max-w-2xl" style={{ color: "var(--text-secondary)" }}>
          Welcome to the front office: weekly results, waiver targets and injury reports for fantasy football and
          basketball, plus live dynasty trade values, trade desks tuned to your league and a scouting report on the 2027
          football class.
        </p>
        <div className="flex flex-wrap justify-center gap-3">
          <button type="button" onClick={() => navigate("trade")} className="btn-primary rounded-lg px-5 py-2.5 text-sm font-semibold">
            Open the Trade Desk
          </button>
          <button type="button" onClick={() => navigate("nba-rankings")} className="btn-secondary rounded-lg px-5 py-2.5 text-sm font-semibold">
            Basketball Big Board
          </button>
        </div>
        {myLeague.nfl && (
          <a href={`${LEAGUES_HASH}/${myLeague.nfl.leagueId}`} className="text-sm font-medium" style={{ color: "var(--sport)" }}>
            <span style={{ color: "var(--brass)" }}>★</span> Your league: {myLeague.nfl.name} →
          </a>
        )}
        {/* Phones have no header switch; this one also picks the tab bar's rooms. */}
        <div className="md:hidden">
          <SportSwitch sport={sport} page="home" navigate={navigate} setSport={setSport} />
        </div>
      </section>

      {/* The chosen sport first, matching the phone tab bar. */}
      {[...SPORTS].sort((a, b) => (b.key === sport) - (a.key === sport)).map((s) => (
        <section key={s.key} className="flex flex-col gap-5">
          <div>
            <h2 className="text-2xl font-bold tracking-tight flex items-center gap-2.5" style={{ color: "var(--text-primary)" }}>
              <span className="w-1.5 h-6 rounded-full" style={{ background: s.key === "nfl" ? "var(--hue-blue)" : "var(--hue-orange)" }} />{s.label}
            </h2>
            <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>{s.blurb}</p>
          </div>
          {SPORT_GROUPS[s.key].map((g) => (
            <div key={g} className="flex flex-col gap-1">
              <h3 className="text-xs font-semibold uppercase tracking-wider" style={{ color: "var(--text-muted)" }}>{g}</h3>
              <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
                {sportPages(s.key, g).map((p) => <FeatureCard key={p.key} p={p} navigate={navigate} />)}
              </div>
            </div>
          ))}
        </section>
      ))}

      {risers.length > 0 && (
        <section className="flex flex-col gap-4">
          <div className="flex items-baseline justify-between gap-3 flex-wrap">
            <h2 className="text-xl font-bold tracking-tight flex items-center gap-2.5" style={{ color: "var(--text-primary)" }}>
              <span className="w-1.5 h-5 rounded-full" style={{ background: "var(--trend-up)" }} />Dynasty risers this month
            </h2>
            <a href="#/values" onClick={(e) => { e.preventDefault(); navigate("dynasty"); }}
              className="text-sm font-medium" style={{ color: "var(--sport)" }}>Value Board →</a>
          </div>
          <ol className="rounded-xl border divide-y" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
            {risers.map((r, i) => (
              <li key={r.id} className="flex items-center justify-between gap-3 px-4 py-3" style={{ borderColor: "var(--border)" }}>
                <span className="flex items-center gap-3 min-w-0">
                  <span className="text-sm tabular-nums w-4 text-right" style={{ color: "var(--text-muted)" }}>{i + 1}</span>
                  <span className="min-w-0 truncate">
                    <PlayerLink id={r.id}>{r.name}</PlayerLink>{" "}
                    <span className="text-xs" style={{ color: "var(--text-muted)" }}><PosBadge pos={r.position} /> {r.team || "FA"}</span>
                  </span>
                </span>
                <span className="flex items-center gap-4 shrink-0 tabular-nums text-sm">
                  <span style={{ color: "var(--text-secondary)" }}>{fmtValue(r.value)}</span>
                  <span className="font-semibold" style={{ color: "var(--trend-up)" }}>▲ {r.trend30.toLocaleString()}</span>
                </span>
              </li>
            ))}
          </ol>
          <p className="text-xs" style={{ color: "var(--text-muted)" }}>30-day change in KeepTradeCut football value, {describeSettings(dynasty.settings)}.</p>
        </section>
      )}
    </div>
  );
}

function SiteFooter({ navigate }) {
  return (
    <footer className="border-t mt-16" style={{ borderColor: "var(--border)" }}>
      <div className="max-w-6xl mx-auto px-4 py-10 grid gap-8 sm:grid-cols-3">
        <div className="flex flex-col gap-3">
          <Logo onClick={() => navigate("home")} />
          <p className="text-sm" style={{ color: "var(--text-secondary)" }}>
            Run your fantasy team like a GM. A free front office for fantasy football and basketball.
          </p>
        </div>
        {SPORTS.map((s) => (
          <div key={s.key} className="flex flex-col gap-2">
            <span className="text-xs font-semibold uppercase tracking-wider" style={{ color: "var(--text-muted)" }}>{s.label}</span>
            {sportPages(s.key).map((p) => (
              <a key={p.key} href={p.hash} onClick={(e) => { e.preventDefault(); navigate(p.key); }}
                className="text-sm hover:underline" style={{ color: "var(--text-secondary)" }}>{p.short}</a>
            ))}
          </div>
        ))}
      </div>
      <div className="border-t" style={{ borderColor: "var(--border)" }}>
        <p className="max-w-6xl mx-auto px-4 py-5 text-xs" style={{ color: "var(--text-muted)" }}>
          Scores, stats, injuries and trends from <a href="https://sleeper.com" className="underline" target="_blank" rel="noopener noreferrer">Sleeper</a>.
          Football trade values from <a href="https://keeptradecut.com" className="underline" target="_blank" rel="noopener noreferrer">KeepTradeCut</a> and <a href="https://fantasycalc.com" className="underline" target="_blank" rel="noopener noreferrer">FantasyCalc</a>.
          Prospect rankings from DraftSharks and Yahoo Sports. Not affiliated with the NFL, the NBA or any of these sites.
        </p>
      </div>
    </footer>
  );
}

function App() {
  const [page, navigate] = useRoute();
  const [sport, setSport] = useSport(page);
  const [theme, toggleTheme] = useTheme();
  const players = samplePlayers;
  const liveScores = useLiveScores(players);
  // League settings are shared by every dynasty tab and remembered per browser.
  const [settings, setSettings] = useState(readSavedSettings);
  useEffect(() => {
    try { localStorage.setItem(DYNASTY_SETTINGS_KEY, JSON.stringify(settings)); } catch (e) {}
  }, [settings]);
  const dynasty = useDynastyValues(settings);
  const sleeperPlayers = useSleeperStatuses();
  const resolveNflId = useMemo(() => nflIdResolver(sleeperPlayers), [sleeperPlayers]);
  // The 2027 class is about rookie picks, which only exist in dynasty values,
  // so in redraft mode it loads the dynasty set separately.
  const classSettings = useMemo(() => ({ ...settings, mode: "dynasty", tep: 0 }), [settings]);
  const classValues = useDynastyValues(classSettings, { enabled: settings.mode !== "dynasty" });
  // Basketball: loaded the first time a basketball page opens.
  const [nbaSettings, setNbaSettings] = useState(readSavedNbaSettings);
  useEffect(() => {
    try { localStorage.setItem(NBA_SETTINGS_KEY, JSON.stringify(nbaSettings)); } catch (e) {}
  }, [nbaSettings]);
  const current = PAGE_BY_KEY[page];
  // The player search can ask for basketball data from a football page.
  const [searchOpen, setSearchOpen] = useState(false);
  useSearchShortcut(() => setSearchOpen(true));
  const [nbaWanted, setNbaWanted] = useState(false);
  const nba = useNbaData(current.sport === "nba" || nbaWanted);
  const nbaProps = { data: nba, settings: nbaSettings, setSettings: setNbaSettings };
  const myLeague = useMyLeagueState();

  return (
    <NflIdContext.Provider value={resolveNflId}>
    <MyLeagueContext.Provider value={myLeague}>
    <div className="has-tab-bar min-h-screen flex flex-col">
      <SiteHeader page={page} navigate={navigate} sport={sport} setSport={setSport} theme={theme} toggleTheme={toggleTheme}
        onSearch={() => setSearchOpen(true)} />
      {/* Each page's own color (its folder and nav color) fills its controls. */}
      <main className="flex-1 w-full max-w-6xl mx-auto px-4 py-8 flex flex-col gap-2" style={{ "--page-hue": PAGE_STYLE[page]?.hue }}>
        {current.group && (
          <p className="text-xs font-semibold uppercase tracking-wider" style={{ color: PAGE_STYLE[page].hue }}>
            {current.short} <span style={{ color: "var(--text-muted)" }}>· {SPORT_LABEL[current.sport]} · {current.group}</span>
          </p>
        )}
        {page === "home" && <HomePage navigate={navigate} scores={liveScores} dynasty={dynasty} sport={sport} setSport={setSport} />}
        {page === "weekly" && <WeeklyScores players={liveScores.players} data={liveScores} />}
        {page === "waivers" && <WaiverTargets />}
        {page === "injuries" && <InjuredReserve players={players} reportPlayers={liveScores.players} data={liveScores} />}
        {page === "nfl-rankings" && <NflRankings settings={settings} setSettings={setSettings} scores={liveScores} />}
        {page === "leagues" && <MyLeagues settings={settings} setSettings={setSettings} navigate={navigate} />}
        {page === "dynasty" && <DynastyValues data={dynasty} settings={settings} setSettings={setSettings} />}
        {page === "draftboard" && <DraftBoard data={dynasty} settings={settings} setSettings={setSettings} />}
        {page === "player" && <NflProfile dynasty={dynasty} settings={settings} />}
        {page === "trade" && <TradeCalculator data={dynasty} settings={settings} setSettings={setSettings} />}
        {page === "class2027" && (
          <DynastyClass2027 data={settings.mode === "dynasty" ? dynasty : classValues} settings={settings} setSettings={setSettings} />
        )}
        {current.sport === "nba" && (
          <NbaGate data={nba}>
            {page === "nba-weekly" && <NbaScoreboard {...nbaProps} />}
            {page === "nba-waivers" && <NbaWaivers {...nbaProps} />}
            {page === "nba-injuries" && <NbaInjuries {...nbaProps} />}
            {page === "nba-rankings" && <NbaRankings {...nbaProps} />}
            {page === "nba-projections" && <NbaProjections {...nbaProps} />}
            {page === "nba-draftboard" && <NbaDraftBoard {...nbaProps} />}
            {page === "nba-player" && <NbaProfile {...nbaProps} />}
            {page === "nba-trade" && <NbaTrade {...nbaProps} />}
          </NbaGate>
        )}
      </main>
      <SiteFooter navigate={navigate} />
      <MobileTabBar sport={sport} page={page} navigate={navigate} />
      {searchOpen && (
        <PlayerSearch sport={sport} dynasty={dynasty} sleeperPlayers={sleeperPlayers} nba={nba}
          onNeedNba={() => setNbaWanted(true)} onClose={() => setSearchOpen(false)} />
      )}
    </div>
    </MyLeagueContext.Provider>
    </NflIdContext.Provider>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
