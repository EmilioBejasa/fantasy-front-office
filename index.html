}

function MatchupPoints({ row }) {
  return row.scored
    ? <span className="tabular-nums text-sm font-semibold" style={{ color: "var(--text-primary)" }}>{fmtPts(row.scored)}</span>
    : <span className="tabular-nums text-sm italic" style={{ color: "var(--text-muted)" }} title="Projected">{fmtPts(row.proj)}</span>;
}

function WeekMatchup({ mu, teams, myTeam, team, onView }) {
  const sleeperPlayers = useSleeperStatuses();
  const nameOf = (id) => teams.find((t) => t.rosterId === id)?.name || `Team ${id}`;
  if (mu.status === "loading" || mu.status === "idle") {
    return <ProfileSection title={`Week ${mu.week || ""} matchup`}><p className="text-sm" style={{ color: "var(--text-muted)" }}>Loading this week's lineups from Sleeper…</p></ProfileSection>;
  }
  if (mu.status === "error") {
    return <ProfileSection title={`Week ${mu.week} matchup`}><p className="text-sm" style={{ color: "var(--text-muted)" }}>Couldn't load this week's matchups ({mu.message}).</p></ProfileSection>;
  }
  if (!mu.pairs.length) return null;
  const mine = mu.pairs.find((p) => p.includes(team.rosterId));
  const [a, b] = mine ? (mine[0] === team.rosterId ? mine : [mine[1], mine[0]]) : [];
  const others = mu.pairs.filter((p) => p !== mine);
  const odds = mine ? winOdds(mu.teams[a], mu.teams[b]) : null;
  const who = team === myTeam ? "Your" : `${team.name}'s`;

  return (
    <ProfileSection title={`Week ${mu.week} matchup`} aside="Bold points are in; italic points are Sleeper's projection">
      {mine ? (
        <>
          <div className="grid items-end gap-3" style={{ gridTemplateColumns: "minmax(0, 1fr) auto minmax(0, 1fr)" }}>
            {[a, b].map((id, side) => (
              <div key={id} className={`min-w-0 flex flex-col ${side ? "items-end text-right" : ""}`} style={{ order: side ? 3 : 1 }}>
                <button type="button" onClick={() => onView(id)} className={`text-sm font-semibold truncate max-w-full hover:underline ${side ? "text-right" : "text-left"}`}
                  style={{ color: "var(--text-primary)" }}>{nameOf(id)}{id === myTeam?.rosterId && <span style={{ color: "var(--sport)" }}> (you)</span>}</button>
                <span className="font-display text-3xl font-bold tabular-nums" style={{ color: "var(--text-primary)" }}>{fmtPts(mu.teams[id].mean)}</span>
                <span className="text-xs" style={{ color: "var(--text-muted)" }}>
                  {fmtPts(mu.teams[id].mean - mu.teams[id].open)} in · {fmtPts(mu.teams[id].open)} to come
                </span>
              </div>
            ))}
            <span className="text-xs font-semibold uppercase tracking-wider pb-6" style={{ order: 2, color: "var(--text-muted)" }}>vs</span>
          </div>
          <div className="flex flex-col gap-1">
            <div className="flex h-2.5 rounded-full overflow-hidden" style={{ background: "var(--surface-2)" }}
              role="img" aria-label={`${who} win odds ${fmtOdds(odds)}`}>
              <span style={{ width: `${odds * 100}%`, background: "var(--sport)" }} />
            </div>
            <div className="flex justify-between text-xs font-semibold tabular-nums">
              <span style={{ color: "var(--sport)" }}>{fmtOdds(odds)} to win</span>
              <span style={{ color: "var(--text-muted)" }}>{fmtOdds(1 - odds)}</span>
            </div>
          </div>
          <ul className="flex flex-col">
            {mu.slots.map((slot, i) => {
              const ra = mu.teams[a].rows[i], rb = mu.teams[b].rows[i];
              if (!ra && !rb) return null;
              return (
                <li key={i} className="grid items-center gap-2 py-1.5 border-b last:border-b-0"
                  style={{ gridTemplateColumns: "minmax(0, 1fr) 3rem 4.5rem 3rem minmax(0, 1fr)", borderColor: "var(--border)" }}>
                  <MatchupPlayer id={ra?.id} proj={mu.proj} sleeperPlayers={sleeperPlayers} />
                  <span className="text-right">{ra && <MatchupPoints row={ra} />}</span>
                  <span className="text-[11px] font-semibold uppercase text-center" style={{ color: "var(--text-muted)" }}>{SLOT_LABEL[slot] || slot}</span>
                  <span>{rb && <MatchupPoints row={rb} />}</span>
                  <MatchupPlayer id={rb?.id} proj={mu.proj} sleeperPlayers={sleeperPlayers} align="right" />
                </li>
              );
            })}
          </ul>
        </>
      ) : (
        <p className="text-sm" style={{ color: "var(--text-muted)" }}>{team.name} has no matchup this week.</p>
      )}
      {others.length > 0 && (
        <div className="border-t pt-3 flex flex-col gap-1" style={{ borderColor: "var(--border)" }}>
          <span className="text-xs font-semibold uppercase tracking-wider" style={{ color: "var(--text-muted)" }}>Around the league</span>
          {others.map(([x, y]) => {
            const p = winOdds(mu.teams[x], mu.teams[y]);
            return (
              <div key={`${x}-${y}`} className="grid items-center gap-2 text-sm py-1"
                style={{ gridTemplateColumns: "minmax(0, 1fr) auto auto auto minmax(0, 1fr)" }}>
                <button type="button" onClick={() => onView(x)} className="truncate text-left hover:underline"
                  style={{ color: "var(--text-primary)", fontWeight: p >= 0.5 ? 600 : 400 }}>{nameOf(x)}</button>
                <span className="tabular-nums">{fmtPts(mu.teams[x].mean)}</span>
                <span className="text-xs tabular-nums w-16 text-center" style={{ color: "var(--text-muted)" }}>{fmtOdds(Math.max(p, 1 - p))} {p >= 0.5 ? "◂" : "▸"}</span>
                <span className="tabular-nums">{fmtPts(mu.teams[y].mean)}</span>
                <button type="button" onClick={() => onView(y)} className="truncate text-right hover:underline"
                  style={{ color: "var(--text-primary)", fontWeight: p < 0.5 ? 600 : 400 }}>{nameOf(y)}</button>
              </div>
            );
          })}
        </div>
      )}
    </ProfileSection>
  );
}

function RosterBreakdown({ team, isDynasty }) {
  const groups = POS_KEYS.filter((k) => isDynasty || k !== "PICK")
    .map((k) => [k, team.assets.filter((a) => a.position === k)])
    .filter(([, list]) => list.length);
  return (
    <div className="grid gap-x-6 gap-y-3 sm:grid-cols-2 lg:grid-cols-3 px-1 pt-1 pb-3">
      {groups.map(([k, list]) => (
        <div key={k} className="flex flex-col gap-0.5">
          <span className="text-xs font-semibold uppercase tracking-wider flex items-center gap-1.5" style={{ color: "var(--text-muted)" }}>
            <span className="inline-block w-2 h-2 rounded-sm" style={{ background: POS_COLOR[k] }} />{POS_LABEL[k]}
            <span className="font-normal normal-case tracking-normal">· {fmtValue(sumOf(list.map((a) => a.value)))}</span>
          </span>
          {list.map((a, j) => {
            const why = team.sidelined?.[a.id];
            return (
              <span key={`${a.id}-${j}`} className="flex items-center justify-between gap-2 text-sm">
                <span className="min-w-0 truncate">
                  <PlayerLink id={a.id} pos={a.position} className="">{a.name}</PlayerLink>{" "}
                  {a.position === "PICK" ? null : <PosBadge pos={a.position} rank={a.posRank} />}
                  {isDynasty && a.age && <span className="text-xs" style={{ color: "var(--text-muted)" }}> {a.age}</span>}
                  {why && (
                    <span className="text-xs font-semibold ml-1"
                      style={{ color: why.label === "Bye" ? "var(--text-muted)" : REPORT_STATUS_COLOR[why.label] || "var(--series-red)" }}>
                      {why.label}
                    </span>
                  )}
                </span>
                <span className="tabular-nums text-xs shrink-0" style={{ color: "var(--text-secondary)" }}>{fmtValue(a.value)}</span>
              </span>
            );
          })}
        </div>
      ))}
    </div>
  );
}

function MyLeagues({ settings, setSettings, navigate }) {
  const [input, setInput] = useState(() => { try { return localStorage.getItem(SLEEPER_USER_KEY) || ""; } catch (e) { return ""; } });
  const [user, setUser] = useState(null);
  const [leagues, setLeagues] = useState(null);
  const [listStatus, setListStatus] = useState({ state: "idle" });
  const [raw, setRaw] = useState(null);
  const [status, setStatus] = useState({ state: "idle" });
  // Values follow the league's own type: keepers count as dynasty, guillotine as redraft.
  const mode = raw ? settingsFromLeague(raw.league).mode : "dynasty";
  const [focus, setFocus] = useState(null);
  // #/leagues lists the leagues; #/leagues/<id> is that league's own page.
  const [leagueId, setLeagueId] = useState(leagueIdFromHash);
  useEffect(() => {
    const sync = () => setLeagueId(leagueIdFromHash());
    window.addEventListener("popstate", sync);
    window.addEventListener("hashchange", sync);
    return () => { window.removeEventListener("popstate", sync); window.removeEventListener("hashchange", sync); };
  }, []);
  const goTo = (id) => {
    const hash = id ? `${LEAGUES_HASH}/${id}` : LEAGUES_HASH;
    try { window.history.pushState(null, "", hash); } catch (e) {}
    lastRoom.nfl = { hash, label: "Boardroom" };
    setLeagueId(id ? String(id) : null);
    window.scrollTo(0, 0);
  };

  const loadLeague = async (leagueId) => {
    setStatus({ state: "loading" });
    try {
      const [league, rosters, users, traded] = await Promise.all([
        sleeperGet(`/league/${leagueId}`), sleeperGet(`/league/${leagueId}/rosters`),
        sleeperGet(`/league/${leagueId}/users`), sleeperGet(`/league/${leagueId}/traded_picks`),
      ]);
      if (leagueIdFromHash() !== String(leagueId)) return; // moved on to another page meanwhile
      if (!league) throw new Error("no Sleeper league with that ID");
      setRaw({ league, rosters: rosters || [], users: users || [], traded: traded || [] });
      setFocus(null);
      setOpenTeams(new Set());
      setStatus({ state: "ready" });
    } catch (err) {
      setStatus({ state: "error", message: err.message });
    }
  };

  const loadUser = async (name) => {
    setListStatus({ state: "loading" });
    try {
      const u = await sleeperGet(`/user/${encodeURIComponent(name)}`);
      if (!u) throw new Error(`no Sleeper user named "${name}"`);
      const state = await sleeperGet("/state/nfl");
      const list = (await sleeperGet(`/user/${u.user_id}/leagues/nfl/${state.league_season || state.season}`)) || [];
      if (list.length === 0) throw new Error(`"${name}" isn't in any football leagues this season`);
      setUser(u);
      setLeagues(list);
      setListStatus({ state: "ready" });
    } catch (err) {
      setListStatus({ state: "error", message: err.message });
    }
  };

  // Reopen the saved user's leagues (also how a league page knows which team is yours).
  useEffect(() => {
    if (input.trim() && !/^\d{9,}$/.test(input.trim())) loadUser(input.trim());
  }, []);
  // Load a league when its page opens (kept when going back to the list, so reopening it is instant).
  useEffect(() => {
    if (leagueId && raw?.league.league_id !== leagueId) loadLeague(leagueId);
  }, [leagueId]);
  useEffect(() => {
    document.title = leagueId && raw?.league.league_id === leagueId
      ? `${raw.league.name} · Boardroom · Fantasy Front Office` : "Boardroom · Football · Fantasy Front Office";
  }, [leagueId, raw]);

  const submit = (e) => {
    e.preventDefault();
    const value = input.trim();
    if (!value) return;
    try { localStorage.setItem(SLEEPER_USER_KEY, value); } catch (err) {}
    if (/^\d{9,}$/.test(value)) return goTo(value);
    loadUser(value);
  };

  // This league's own settings, in the chosen context.
  const leagueSettings = useMemo(
    () => (raw ? { ...DEFAULT_DYNASTY_SETTINGS, ...settingsFromLeague(raw.league), mode } : DEFAULT_DYNASTY_SETTINGS),
    [raw, mode]
  );
  const values = useDynastyValues(leagueSettings, { enabled: !!raw });
  const byId = useMemo(() => Object.fromEntries(values.rows.map((r) => [r.id, r])), [values.rows]);
  const resolveNflId = React.useContext(NflIdContext);
  const sleeperPlayers = useSleeperStatuses();
  const seasonOver = useMemo(() => seasonOverIds(sleeperPlayers, resolveNflId), [sleeperPlayers, resolveNflId]);
  const teams = useMemo(() => {
    if (!raw) return [];
    const week = raw.league.settings?.leg;
    return buildLeagueTeams(raw, values.rows, byId, (p) => sidelinedReason(p, sleeperPlayers, seasonOver, week));
  }, [raw, values.rows, byId, sleeperPlayers, seasonOver]);
  // This season's standings and projections (also what the dynasty lean leans on first).
  const showStandings = !!raw && raw.league.settings?.type !== 3 && raw.league.status !== "pre_draft";
  const standings = useProjectedStandings(raw, showStandings);
  const matchups = useWeekMatchups(raw, showStandings);
  const standingOf = useMemo(() => {
    const now = standings.now || [];
    const playoffTeams = Math.min(raw?.league.settings?.playoff_teams || 0, now.length);
    const order = [...now].sort((a, b) => (b.wins + b.ties / 2) - (a.wins + a.ties / 2) || b.pf - a.pf);
    return Object.fromEntries(order.map((t, i) => {
      const games = t.wins + t.losses + t.ties;
      return [t.rosterId, {
        seed: i + 1, games, winPct: games ? (t.wins + t.ties / 2) / games : 0, playoffTeams,
        playoffs: standings.projected?.[t.rosterId]?.playoffs ?? null,
      }];
    }));
  }, [standings, raw]);

  const isDynasty = mode === "dynasty";
  const n = teams.length;
  const ranks = useMemo(() => ({
    total: rankTeams(teams, (t) => t.total),
    starters: rankTeams(teams, (t) => t.starters),
    now: rankTeams(teams, (t) => t.lineup.reduce((s, l) => s + (l.player?.redraftValue || 0), 0)),
    pf: rankTeams(teams, (t) => t.record.pf),
    ...Object.fromEntries(ROOM_POSITIONS.map((p) => [p, rankTeams(teams, (t) => t.byPos[p])])),
  }), [teams]);
  // Dynasty ranks the whole roster (picks too); redraft only this season's lineup.
  const ordered = useMemo(
    () => [...teams].sort(isDynasty ? (a, b) => b.total - a.total : (a, b) => b.starters - a.starters),
    [teams, isDynasty]
  );
  const myTeam = user && teams.find((t) => t.ownerIds.includes(user.user_id));
  const team = myTeam || teams.find((t) => t.rosterId === focus) || ordered[0];
  // Guillotine and other no-matchup leagues score points but have no wins or losses.
  const hasRecord = teams.some((t) => t.record.wins || t.record.losses || t.record.ties);
  const hasPoints = teams.some((t) => t.record.pf > 0);
  const sortValue = (t) => (isDynasty ? t.total : t.starters);
  const leanFor = (t) => teamLean(ranks.now[t.rosterId], ranks.total[t.rosterId], n, standingOf[t.rosterId]);
  const leanOf = (t) => (isDynasty ? leanFor(t) : null);
  const teamLeanLabel = team && leanOf(team)?.label;
  const outForYear = useMemo(() => outForYearIds(values.rows, sleeperPlayers, resolveNflId), [values.rows, sleeperPlayers, resolveNflId]);
  const targets = useMemo(
    () => (team && raw ? suggestTrades(team, teams, raw.league, values.rows, mode, leanOf, outForYear) : null),
    [team, teams, raw, values.rows, mode, teamLeanLabel, outForYear, standingOf]
  );
  // Other teams open as dropdowns in the power rankings; yours is the panel up top.
  const [openTeams, setOpenTeams] = useState(() => new Set());
  const toggleTeam = (rosterId) => setOpenTeams((s) => {
    const next = new Set(s);
    if (next.has(rosterId)) next.delete(rosterId); else next.add(rosterId);
    return next;
  });
  const viewTeam = (rosterId) => {
    if (rosterId === team?.rosterId) return document.getElementById("league-team")?.scrollIntoView({ behavior: "smooth" });
    setOpenTeams((s) => new Set(s).add(rosterId));
    setTimeout(() => document.getElementById(`team-${rosterId}`)?.scrollIntoView({ behavior: "smooth", block: "start" }), 0);
  };
  // Open a suggested trade on the Trade Desk, with this league's settings.
  const openTrade = (s) => {
    setSettings((st) => ({ ...st, ...settingsFromLeague(raw.league), mode }));
    const ids = (list) => list.map((a) => encodeURIComponent(a.id)).join(",");
    window.location.hash = `#trade=${ids(s.get)}|${ids(s.give)}`;
    window.scrollTo(0, 0);
  };
  const maxSort = Math.max(1, ...teams.map(sortValue));

  const posAvg = Object.fromEntries(ROOM_POSITIONS.map((p) => [p, n ? teams.reduce((s, t) => s + t.byPos[p], 0) / n : 0]));

  const leagueLink = (id) => `${LEAGUES_HASH}/${id}`;
  const my = React.useContext(MyLeagueContext);
  const isMyLeague = (id) => my.nfl?.leagueId === String(id);
  const follow = (fn) => (e) => { if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return; e.preventDefault(); fn(); };

  return (
    <div className="flex flex-col gap-5">
      {!leagueId ? (
        <>
          <header>
            <h2 className="text-2xl sm:text-3xl font-bold tracking-tight" style={{ color: "var(--text-primary)" }}>My Leagues</h2>
            <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>
              Load your Sleeper leagues, then open one to see where your team stands and who to trade for, valued with that
              league's own format, size, scoring, TE premium and starting lineup.
            </p>
          </header>

          <form onSubmit={submit} className="flex gap-2 flex-wrap">
            <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Sleeper username or league ID" aria-label="Sleeper username or league ID"
              className="rounded-md border px-3 py-1.5 text-sm flex-1" style={{ ...inputStyle, minWidth: "12rem" }} />
            <button type="submit" className="btn-primary rounded-md px-4 py-1.5 text-sm font-semibold">Load leagues</button>
          </form>

          {listStatus.state === "loading" && <p className="text-sm" style={{ color: "var(--text-muted)" }}>Finding leagues on Sleeper…</p>}
          {listStatus.state === "error" && (
            <p className="text-sm" style={{ color: "var(--text-muted)" }}>
              Couldn't load that ({listStatus.message}). This needs the page served over http(s) with network access.
            </p>
          )}

          {leagues && (
            <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-3">
              {leagues.map((l) => (
                <a key={l.league_id} href={leagueLink(l.league_id)} onClick={follow(() => goTo(l.league_id))}
                  className="row-btn rounded-lg border px-4 py-3 flex flex-col gap-1"
                  style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
                  <span className="text-sm font-semibold truncate" style={{ color: "var(--text-primary)" }}>
                    {l.name}{isMyLeague(l.league_id) && <span className="text-xs font-semibold ml-1.5" style={{ color: "var(--brass)" }}>★ Your league</span>}
                  </span>
                  <span className="text-xs" style={{ color: "var(--text-secondary)" }}>{leagueTags(l)}</span>
                  <span className="text-xs font-semibold mt-1" style={{ color: "var(--sport)" }}>Open league →</span>
                </a>
              ))}
            </div>
          )}
        </>
      ) : (
        <>
          <a href={LEAGUES_HASH} onClick={follow(() => goTo(null))} className="text-sm font-medium self-start" style={{ color: "var(--sport)" }}>
            ← All leagues
          </a>

          {status.state === "loading" && <p className="text-sm py-3" style={{ color: "var(--text-muted)" }}>Loading league from Sleeper…</p>}
          {status.state === "error" && (
            <p className="text-sm py-3" style={{ color: "var(--text-muted)" }}>

                  setSettings((s) => ({ ...s, ...settingsFromLeague(raw.league), mode }));

                Use in Trade Desk

          </header>

            <DynastyStatusLine data={values} />{" "}

            standings first: {Math.round(LEAN_CONTEND_ODDS * 100)}%+ playoff odds makes a contender and{" "}
            {Math.round(LEAN_TANK_ODDS * 100)}% or less a seller, whatever the roster is worth. Otherwise it compares how good

          <section id="league-team" className="flex flex-col gap-3" style={{ scrollMarginTop: "5rem" }}>
            <div className="flex items-end justify-between flex-wrap gap-2">

                <span className="font-normal" style={{ color: "var(--text-muted)" }}> · {team.name}</span>
              </h3>
              {!myTeam && (
                // Opened by league ID with no Sleeper user: pick which team is yours.
                <label className="flex items-center gap-2 text-xs" style={{ color: "var(--text-muted)" }}>
                  Your team
                  <select value={team.rosterId} onChange={(e) => setFocus(Number(e.target.value))}

              )}

            <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
              {isDynasty && <StatTile label="Roster value" value={`${ordinal(ranks.total[team.rosterId])} of ${n}`} sub={`${fmtValue(team.total)} incl. picks`} />}
              <StatTile label={isDynasty ? "Lineup value" : "Lineup strength"} value={`${ordinal(ranks.starters[team.rosterId])} of ${n}`} sub={fmtValue(team.starters)} />
              {isDynasty ? (() => {
                const lean = leanFor(team);
                return <StatTile label="This season" value={`${ordinal(ranks.now[team.rosterId])} of ${n}`} sub={lean.label} subColor={lean.color} />;
              })() : (
                <StatTile label="Depth" value={`${ordinal(rankTeams(teams, (t) => t.total - t.starters)[team.rosterId])} of ${n}`}

              {hasRecord ? (
                <StatTile label="Record" value={`${team.record.wins}-${team.record.losses}${team.record.ties ? `-${team.record.ties}` : ""}`}

                <p className="text-xs -mt-1" style={{ color: "var(--text-muted)" }}>

                {targets.list.length === 0 ? (
                  <p className="text-sm" style={{ color: "var(--text-muted)" }}>
                    No fair upgrades found: nobody available would improve this lineup for what {team === myTeam ? "you" : "they"} can offer.
                  </p>
                ) : targets.positions.map(({ pos, rank }) => {
                  const group = targets.list.filter((s) => s.get[0].position === pos);
                  return (
                  <div key={pos} className="flex flex-col gap-2">

/* ---------------- consensus across calculators ---------------- */
// The same trade judged with each calculator's values: KeepTradeCut (the
// app's default, as on the rest of the page), FantasyCalc (live, in the
// league's size and scoring), and in dynasty DynastyProcess and Dynasty
// Superflex. Each runs through the same formula (evaluateTrade), so only the
// values differ. The consensus averages each calculator's margin (signed,
// as a share of the bigger side) and reads it with the same fair / slight /
// favors thresholds. KTC, DynastyProcess and Dynasty Superflex come from
// data/market-values.js, baked daily from Dynasty Daddy by
// scripts/refresh-market-values.js, since none of these sites let the page
// fetch them directly. They have no league-size, scoring or TE-premium
// options, and no generic "2027 1st" picks: those use the mid pick.
function marketPickKey(name) {
  const p = window.FantasyCalc?.parsePick(name);
  return p && `${p.year}-${p.round}-${p.slot || "mid"}`;
}

const FC_SOURCE = { key: "fc", label: "FantasyCalc", url: "https://fantasycalc.com/trade-calculator" };

// One calculator's verdict on the trade, from `valueOf(row)` (null = no value).
function judgeWith(sides, byId, values, valueOf, settings) {
  const missing = [];
  const sideValues = sides.map((ids) => ids.map((id) => {
    const v = valueOf(byId[id], id);
    if (v == null) missing.push(byId[id]?.name || id);
    return v || 0;
  }));
  const playerValues = values.filter((v) => !v.pick).map((v) => v.value).sort((a, b) => b - a);
  const ctx = { topValue: Math.max(1, ...values.map((v) => v.value)), playerValues, teams: settings.teams, raw: settings.raw };
  return { result: evaluateTrade(sideValues, ctx), missing };
}

// Margin as a signed share: + favors Team A, − Team B.
const signedMargin = (r) => (r.gap >= 0 ? 1 : -1) * r.pct;

function consensusVerdict(margins) {
  const avg = margins.reduce((s, m) => s + m, 0) / Math.max(1, margins.length);
  const pct = Math.abs(avg);
  return {
    pct, winner: avg >= 0 ? 0 : 1,
    verdict: pct <= TRADE_FAIR_PCT ? "fair" : pct <= TRADE_SLIGHT_PCT ? "slight" : "favors",
  };
}

function MarketComparison({ sides, byId, rows, settings, result, source }) {
  const bundle = window.MARKET_VALUES;
  const markets = (window.DynastyDaddy?.MARKETS || [])
    .filter((m) => m.mode === settings.mode && !(source && m.key === (settings.mode === "dynasty" ? "ktc" : "ktcRedraft")));

  const judged = useMemo(() => {
    const main = { m: source || FC_SOURCE, result, missing: [], main: true };
    const out = [main];
    // FantasyCalc's own values, when KTC is the main source.
    if (source) {
      const fcValues = rows.filter((r) => r.fcValue != null).map((r) => ({ value: r.fcValue, pick: r.position === "PICK" }));
      out.push({ m: FC_SOURCE, ...judgeWith(sides, byId, fcValues, (r) => r?.fcValue ?? null, settings) });
    }
    if (bundle) {
      for (const m of markets) {
        const vals = bundle.values[m.key]?.[settings.qb] || {};
        const list = Object.entries(vals).map(([k, v]) => ({ value: v, pick: k.includes("-") }));
        const valueOf = (r, id) => vals[r?.position === "PICK" ? marketPickKey(r.name) : id] ?? null;
        out.push({ m, ...judgeWith(sides, byId, list, valueOf, settings) });
      }
    }
    return out;
  }, [bundle, settings.mode, settings.qb, settings.teams, settings.raw, sides, byId, rows, result, source]);

  if (!sides[0].length || !sides[1].length) return null;

  const consensus = consensusVerdict(judged.map((j) => signedMargin(j.result)));
  const sameCall = (r) => r.verdict === consensus.verdict && (r.verdict === "fair" || r.winner === consensus.winner);
  const agree = judged.filter((j) => sameCall(j.result)).length;
  const verdictText = (r) => {
    if (r.verdict === "fair") return "Fair";
    const who = `Team ${TRADE_SIDES[r.winner]}`;
    return `${r.verdict === "slight" ? "Slightly favors" : "Favors"} ${who} by ${Math.round(r.pct * 100)}%`;
  };
  const verdictColor = (r) => (r.verdict === "fair" ? "var(--text-primary)" : SIDE_COLOR[TRADE_SIDES[r.winner]]);
  const mainLabel = (source || FC_SOURCE).label;

  return (
    <div className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
      <div className="flex items-baseline justify-between flex-wrap gap-2">
        <h3 className="text-base font-semibold" style={{ color: "var(--text-primary)" }}>Consensus across calculators</h3>
        <p className="text-xs" style={{ color: "var(--text-muted)" }}>{agree} of {judged.length} calculators make the same call</p>
      </div>
      <div className="rounded-md px-3 py-2 flex items-baseline justify-between flex-wrap gap-2" style={{ background: "var(--surface-2)" }}>
        <span className="text-lg font-semibold" style={{ color: verdictColor(consensus) }}>{verdictText(consensus)}</span>
        <span className="text-xs" style={{ color: "var(--text-muted)" }}>
          {sameCall(result) ? `${mainLabel} agrees` : `${mainLabel} alone says: ${verdictText(result).toLowerCase()}`}
        </span>
      </div>
      <div className="overflow-x-auto">
        <table className="w-full text-sm tabular-nums">
          <thead>
            <tr className="text-xs text-left" style={{ color: "var(--text-muted)" }}>
              <th className="font-medium py-1 pr-3">Calculator</th>
              <th className="font-medium py-1 pr-3 text-right">Team A</th>
              <th className="font-medium py-1 pr-3 text-right">Team B</th>
              <th className="font-medium py-1">Verdict</th>
            </tr>
          </thead>
          <tbody>
            {judged.map(({ m, result: r, missing, main }) => (
              <tr key={m.key} className="border-t" style={{ borderColor: "var(--border)" }}>
                <td className="py-1.5 pr-3 whitespace-nowrap">
                  <a href={m.url} target="_blank" rel="noopener noreferrer" className="underline" style={{ color: "var(--text-primary)" }}>{m.label}</a>
                  {main && <span className="text-xs" style={{ color: "var(--text-muted)" }}> (above)</span>}
                  {missing.length > 0 && (
                    <span className="block text-xs" style={{ color: "var(--text-muted)" }} title={missing.join(", ")}>
                      No value for {missing.length === 1 ? missing[0] : `${missing.length} assets`}
                    </span>
                  )}
                </td>
                <td className="py-1.5 pr-3 text-right">{fmtValue(Math.round(r.adjusted[0]))}</td>
                <td className="py-1.5 pr-3 text-right">{fmtValue(Math.round(r.adjusted[1]))}</td>
                <td className="py-1.5 font-medium" style={{ color: verdictColor(r) }}>{verdictText(r)}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        Each calculator's {settings.qb === "sf" ? "Superflex" : "1QB"} {settings.mode} values run through this page's
        {settings.raw ? " raw sums" : " adjustments"}, so the verdicts differ only by whose values are used; each site's own
        calculator adjusts a bit differently. The consensus is the average of their margins. FantasyCalc's values match your
        league size and scoring; the others don't change with them (no TE premium either), and come via{" "}
        <a href="https://dynasty-daddy.com" target="_blank" rel="noopener noreferrer" className="underline">Dynasty Daddy</a>,
        updated {bundle?.updatedOn || "never"}.
      </p>
    </div>
  );
}

function TradeCalculator({ data, settings, setSettings }) {
  const [sides, setSides] = useState(readTradeHash);
  useEffect(() => { writeTradeHash(sides); }, [sides]);

  const byId = useMemo(() => Object.fromEntries(data.rows.map((r) => [r.id, r])), [data.rows]);
  // A player can only be in the deal once; generic picks ("2027 1st") can repeat.
  const inDeal = useMemo(() => new Set([...sides[0], ...sides[1]].filter((id) => byId[id]?.position !== "PICK")), [sides, byId]);

  const ctx = useMemo(() => ({
    topValue: data.rows[0]?.value || 1,
    playerValues: data.rows.filter((r) => r.position !== "PICK").map((r) => r.value),
    teams: settings.teams,
    raw: settings.raw,
  }), [data.rows, settings.teams, settings.raw]);
  const result = useMemo(
    () => evaluateTrade(sides.map((ids) => ids.map((id) => byId[id]?.value || 0)), ctx),
    [sides, byId, ctx]
  );

  const add = (si, id) => {
    if (inDeal.has(id)) return;
    setSides((s) => s.map((ids, i) => (i === si ? [...ids, id] : ids)));
  };
  const remove = (si, idx) => setSides((s) => s.map((ids, i) => (i === si ? ids.filter((_, j) => j !== idx) : ids)));

  return (
    <div className="flex flex-col gap-5">
      <header>
        <h2 className="text-2xl sm:text-3xl font-bold tracking-tight" style={{ color: "var(--text-primary)" }}>Trade Calculator</h2>

// Which 2027 rookie pick a prospect at a given rank would cost in a
// 12-team league: ranks 1-4 are early 1sts, 5-8 mid, 9-12 late, then the
// same thirds of round 2 and 3.
const CLASS_LEAGUE_SIZE = 12;
function pickSlotForRank(rank) {
  if (!rank) return null;
  const round = Math.ceil(rank / CLASS_LEAGUE_SIZE);
  const third = Math.ceil(((rank - 1) % CLASS_LEAGUE_SIZE + 1) / (CLASS_LEAGUE_SIZE / 3));
  return { round, slot: ["early", "mid", "late"][third - 1] };
}
const CLASS_POSITIONS = [{ key: "ALL", label: "ALL" }, ...["RB", "WR", "QB", "TE"].map((p) => ({ key: p, label: p }))];

// FantasyCalc's 2027 pick rows, by "<round>-<slot>" ("1-early", "2-null").
function class2027Picks(rows) {
  const out = {};
  for (const r of rows) {
    const p = r.position === "PICK" && window.FantasyCalc?.parsePick(r.name);
    if (p && p.year === 2027) out[`${p.round}-${p.slot}`] = r;
  }
  return out;
}

// Each prospect's college seasons (data/prospects-2027.js, written by
// scripts/refresh-prospects.js from ESPN's college stats), keyed by the
// `espnId` in CLASS_2027. Shares are of the player's own team's totals for
// that season, postseason included: the dominator rating is the average of
// his share of the team's receiving yards and receiving TDs.
const loadProspectStats = () => loadDataScript("data/prospects-2027.js", "PROSPECTS_2027");
function useProspectStats() {
  const [file, setFile] = useState(undefined);
  useEffect(() => {
    let cancelled = false;
    loadProspectStats().then((f) => { if (!cancelled) setFile(f); });
    return () => { cancelled = true; };
  }, []);
  return file;
}
// The breakout line for receivers, the same 20% scripts/lib/espn-college.js uses.

const perGame = (n, g) => (n != null && g ? n / g : null);
const ratio = (a, b) => (a != null && b ? a / b : null);
const fmtInt = (n) => (n == null ? "–" : Math.round(n).toLocaleString());
const fmtPct = (n) => (n == null ? "–" : `${fmtStat(n, 1)}%`);
const scrimmage = (s) => (s.rushYds != null || s.recYds != null ? (s.rushYds || 0) + (s.recYds || 0) : null);

// The production table's columns for each position. `v` is the raw number;
// `f` formats it (default: whole number).
const PROSPECT_COLUMNS = {
  QB: [
    { label: "G", v: (s) => s.g },
    { label: "CMP-ATT", v: (s) => s.att, f: (_, s) => `${fmtInt(s.cmp)}-${fmtInt(s.att)}` },
    { label: "CMP%", v: (s) => ratio(s.cmp, s.att) * 100 || null, f: fmtPct },
    { label: "YDS", v: (s) => s.passYds, f: fmtInt },
    { label: "Y/A", v: (s) => ratio(s.passYds, s.att), f: (n) => fmtStat(n, 1) },
    { label: "TD", v: (s) => s.passTd },
    { label: "INT", v: (s) => s.int },
    { label: "QBR", v: (s) => s.qbr, f: (n) => fmtStat(n, 1), title: "ESPN's adjusted QBR, regular season" },
    { label: "RUSH YDS", v: (s) => s.rushYds, f: fmtInt },
    { label: "RUSH TD", v: (s) => s.rushTd },
  ],
  RB: [
    { label: "G", v: (s) => s.g },
    { label: "CAR", v: (s) => s.car },
    { label: "YDS", v: (s) => s.rushYds, f: fmtInt },
    { label: "YPC", v: (s) => ratio(s.rushYds, s.car), f: (n) => fmtStat(n, 1) },
    { label: "TD", v: (s) => s.rushTd },
    { label: "REC", v: (s) => s.rec },
    { label: "REC YDS", v: (s) => s.recYds, f: fmtInt },
    { label: "SCRIM/G", v: (s) => perGame(scrimmage(s), s.g), f: (n) => fmtStat(n, 1), title: "Rushing plus receiving yards per game" },
    { label: "RUSH SHARE", v: (s) => s.shares?.rushYds, f: fmtPct, title: "Share of his team's rushing yards" },
    { label: "SCRIM SHARE", v: (s) => s.shares?.scrimmage, f: fmtPct, title: "Share of his team's total yards" },
  ],
  WR: [
    { label: "G", v: (s) => s.g },
    { label: "REC", v: (s) => s.rec },
    { label: "YDS", v: (s) => s.recYds, f: fmtInt },

    { label: "TD", v: (s) => s.recTd },

    { label: "DOMINATOR", v: (s) => s.shares?.dominator, f: fmtPct, title: "Average of his yards share and TD share" },
  ],
};

// A prospect's latest season in one line for the class table:
// { line: "52-984-12", sub: "49% dominator", season: "2026 · 7 G" }.
function prospectHeadline(pos, s) {
  if (!s) return null;
  const season = `${s.year}${s.g ? ` · ${s.g} G` : ""}`;
  if (pos === "QB") {
    return { line: `${fmtInt(s.passYds)} yds, ${fmtInt(s.passTd)} TD, ${fmtInt(s.int)} INT`, sub: s.qbr != null ? `${fmtStat(s.qbr, 1)} QBR` : null, season };
  }
  if (pos === "RB") {
    return { line: `${fmtInt(s.car)}-${fmtInt(s.rushYds)}-${fmtInt(s.rushTd)}`, sub: s.shares?.rushYds != null ? `${fmtPct(s.shares.rushYds)} of team rush yds` : null, season };
  }
  return { line: `${fmtInt(s.rec)}-${fmtInt(s.recYds)}-${fmtInt(s.recTd)}`, sub: s.shares?.dominator != null ? `${fmtPct(s.shares.dominator)} dominator` : null, season };
}

// The season with the highest value of `get`, for "career best" lines.
const bestSeason = (seasons, get) => seasons.reduce((best, s) => (get(s) != null && (!best || get(s) > get(best)) ? s : best), null);

        "Projected pick" is the 2027 rookie pick that rank lines up with in a 12-team league (ranks 1-4 are early 1sts,
        5-8 mid, 9-12 late, and so on), at its current value. Sources:{" "}
        {CLASS_2027_SOURCES.map((s, i) => (
          <span key={s.url}>
            {i > 0 && "; "}
            <a href={s.url} target="_blank" rel="noopener noreferrer" className="underline">{s.label}</a>
          </span>
        ))}.
      </p>
    </div>
  );
}

// A prospect's own page (#/prospect/<espnId>): rookie-draft ranks and the pick

function ProspectProfile({ data, settings }) {
  const id = usePlayerIdFromHash("prospect");
  const back = { hash: PAGE_BY_KEY.class2027.hash, label: PAGE_BY_KEY.class2027.short }; // the only tab that links here

  if (!p) return <ProfileMessage back={back}>This prospect isn't on the 2027 Class list.</ProfileMessage>;

  const college = stats?.players?.[id];

  const rankOf = (stat) => college?.ranks?.find((r) => r.stat === stat)?.rank;
  const best = (get) => {
    const s = bestSeason(seasons, get);

    { label: "Yards / attempt", value: fmtStat(ratio(latest.passYds, latest.att), 1) },

    { label: "QBR", value: fmtStat(latest.qbr, 1), sub: rankOf("QBR") && `${rankOf("QBR")} nationally` },

    { label: "Scrimmage share", value: fmtPct(latest.shares?.scrimmage), sub: best((s) => s.shares?.scrimmage) },

    { label: "Scrimmage yds / game", value: fmtStat(perGame(scrimmage(latest), latest.g), 1) },

    { label: "Receiving yards share", value: fmtPct(latest.shares?.recYds), sub: best((s) => s.shares?.recYds) },
    { label: "Yards / catch", value: fmtStat(ratio(latest.recYds, latest.rec), 1), sub: rankOf("AVG") && `${rankOf("AVG")} nationally` },
    { label: "Breakout season", value: college.breakout ?? "Not yet", sub: `First season at a ${BREAKOUT_DOMINATOR}%+ dominator rating` },
  ];

  return (
    <div className="flex flex-col gap-6">
      <ProfileHero sport="nfl" id={id} photo={prospectHeadshot(id)} name={p.name} pos={pos} team={p.school} back={back}

        <StatTile label="Superflex rookie rank" value={p.rankSf ?? "–"} sub={p.rankSf == null ? "Outside the top 30" : null} />
        <StatTile label={`Projected pick · ${settings.qb === "sf" ? "SF" : "1QB"}`} value={pick ? fmtValue(pick.value) : "–"}
          sub={pick ? pick.name : slot ? `Round ${slot.round}+` : "Unranked in this format"} />
      </div>

      {!college ? (

      ) : (

              <div className="grid gap-3 grid-cols-2 sm:grid-cols-4">

              </div>

          {metrics.length > 0 && (
            <ProfileSection title="Underlying metrics" aside={pos === "QB" ? `${latest.year}` : `${latest.year} · shares are of ${latest.team}'s totals`}>
              <div className="grid gap-3 grid-cols-2 sm:grid-cols-4">
                {metrics.map((m) => <StatTile key={m.label} label={m.label} value={m.value} sub={m.sub} />)}

          <ProfileSection title="College production" aside={`${seasons.length} season${seasons.length === 1 ? "" : "s"} · postseason included`}>
            <div className="overflow-x-auto -mx-4 px-4">
              <table className="w-full border-collapse text-sm">
                <thead>
                  <tr style={{ borderBottom: "1px solid var(--border)" }}>
                    <th className="text-left px-2 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>SEASON</th>
                    <th className="text-left px-2 py-2 text-xs font-semibold" style={{ color: "var(--text-muted)" }}>TEAM</th>
                    {columns.map((c) => (
                      <th key={c.label} title={c.title} className="text-right px-2 py-2 text-xs font-semibold whitespace-nowrap" style={{ color: "var(--text-muted)" }}>{c.label}</th>

            College stats from ESPN, refreshed every Sunday (last {stats.updatedOn}). Shares compare him with his own team's
            season totals; the dominator rating is the average of his share of team receiving yards and receiving TDs.
            QBR is ESPN's adjusted QBR for the regular season.

/* ---------------- basketball (season-long / redraft) ---------------- */
// The basketball side: points leagues only, season-long (no dynasty). All of
// it is live from Sleeper (scripts/lib/sleeper-nba.js); there's no baked
// snapshot, so it needs the page served over http(s) with network access.

const NBA_SETTINGS_KEY = "ff-valuediff:nba-settings-v1";
const DEFAULT_NBA_SETTINGS = { scoring: "standard", teams: 12, raw: false };
const NBA_SETTING_OPTIONS = {
  scoring: [{ key: "standard", label: "Standard" }, { key: "espn", label: "ESPN" }],
  teams: [8, 10, 12, 14, 16].map((n) => ({ key: n, label: String(n) })),
};
const NBA_SCORING_NOTE = {
  standard: "Standard scoring is the NBA's official fantasy scoring, which Yahoo uses by default: points 1, rebounds 1.2, assists 1.5, steals 3, blocks 3, turnovers −1.",
  espn: "ESPN scoring is ESPN's default points league, which also charges for misses: points 1, 3-pointers made 1, field goals made 2, field goal attempts −1, free throws made 1, free throw attempts −1, rebounds 1, assists 2, steals 4, blocks 4, turnovers −2.",
};

function readSavedNbaSettings() {
  try {
    const saved = JSON.parse(localStorage.getItem(NBA_SETTINGS_KEY) || "null");
    if (saved) return { ...DEFAULT_NBA_SETTINGS, ...saved };
  } catch (e) {}
  return DEFAULT_NBA_SETTINGS;
}

// Sleeper names a season by the year it starts: "2025" is 2025-26.
const nbaSeasonLabel = (s) => `${s}-${String(Number(s) + 1).slice(2)}`;
// A full regular season is 25 Sleeper fantasy weeks (Monday to Sunday) and 82
// games per team.
const NBA_SEASON_WEEKS = 25;
const NBA_TEAM_GAMES = 82;

const NBA_CACHE = (k) => `ff-valuediff:nba-v1:${k}`;
function nbaCacheGet(key, ttl) {
  try {
    const c = JSON.parse(localStorage.getItem(NBA_CACHE(key)) || "null");
    if (c && Date.now() - c.at < ttl) return c.data;
  } catch (e) {}
  return null;
}
function nbaCacheSet(key, data) {
  try { localStorage.setItem(NBA_CACHE(key), JSON.stringify({ at: Date.now(), data })); } catch (e) {}
}
// The daily snapshot baked by scripts/refresh-nba.js, loaded only the first
// time Sleeper can't be reached (so football visitors never download it).
let nbaSnapshotUsed = null; // its date, once any page has fallen back to it
const loadNbaSnapshot = () => loadDataScript("data/nba-snapshot.js", "NBA_SNAPSHOT");

async function nbaCached(key, ttl, load) {
  const hit = nbaCacheGet(key, ttl);
  if (hit) return hit;
  try {
    const data = await load();
    nbaCacheSet(key, data);
    return data;
  } catch (err) {
    // Not cached, so the next refresh tries Sleeper again.
    const snap = await loadNbaSnapshot();
    if (snap && snap.data[key]) {
      nbaSnapshotUsed = snap.updatedOn;
      return snap.data[key];
    }
    throw err;
  }
}

// Everything the basketball pages share, loaded the first time one of them
// opens: Sleeper's current NBA state, season totals for this season and last
// (this season is empty until tip-off, so last season fills in until then),
// and the trimmed player list (injuries, current teams, ages). While a
// basketball page stays open it re-checks on useRefreshTick; anything whose
// cache has expired is fetched again and swapped in without a loading screen.
function useNbaData(enabled) {
  const [data, setData] = useState({ status: "idle", seasons: {}, players: {} });
  const tick = useRefreshTick();
  const loaded = useRef(false);
  const busy = useRef(false);
  useEffect(() => {
    if (!enabled || busy.current) return;
    if (!window.SleeperNBA) {
      setData((d) => ({ ...d, status: "error", message: "scripts/lib/sleeper-nba.js didn't load" }));
      return;
    }
    const N = window.SleeperNBA;
    const refreshing = loaded.current;
    busy.current = true;
    if (!refreshing) setData((d) => ({ ...d, status: "loading" }));
    (async () => {
      // On a background refresh, only re-render if something actually expired.
      let fetched = false;
      const get = (k, ttl, load) => nbaCached(k, ttl, () => { fetched = true; return load(); });
      const state = await get("state", 10 * 60 * 1000, N.fetchState);
      const seasons = {};
      await Promise.all([state.season, state.previous_season].map(async (s) => {
        const ttl = s === state.season ? 60 * 60 * 1000 : 24 * 60 * 60 * 1000;
        seasons[s] = await get(`season-${s}`, ttl, () => N.fetchSeason(s));
      }));
      const players = await get("players", 6 * 60 * 60 * 1000, N.fetchPlayers);
      // Optional: the pages work without it, minus the games-per-week counts.
      const schedule = await get(`schedule-${state.season}`, 6 * 60 * 60 * 1000, () => N.fetchSchedule(state.season)).catch(() => []);
      if (refreshing && !fetched) return;
      loaded.current = true;
      setData({ status: "live", state, seasons, players, schedule, updatedOn: new Date().toLocaleString(), snapshotOn: nbaSnapshotUsed });
    })()
      // A failed background refresh just leaves the last data up.
      .catch((err) => { if (!refreshing) setData((d) => ({ ...d, status: "error", message: err.message })); })
      .finally(() => { busy.current = false; });
  }, [enabled, tick]);

  // The season the pages default to: this one once it has games, else last.
  const ready = data.status === "live";
  const currentHasGames = ready && (data.seasons[data.state.season] || []).length > 0;
  const activeSeason = ready ? (currentHasGames ? data.state.season : data.state.previous_season) : null;
  return { ...data, activeSeason, currentHasGames };
}

// Fantasy weeks played in a season (1 … n).
function nbaWeeksFor(data, season) {
  if (season !== data.state.season) return NBA_SEASON_WEEKS;
  const type = data.state.season_type;
  if (type === "regular") return Math.max(0, data.state.week);
  return type === "post" ? NBA_SEASON_WEEKS : 0;
}

// One fantasy week's games, fetched on demand and cached (past weeks for a
// day, the current week for ten minutes).
function useNbaWeek(data, season, week, enabled = true) {
  const [res, setRes] = useState({ status: "idle", players: [] });
  useEffect(() => {
    if (!enabled || !season || !week || !window.SleeperNBA) return;
    let cancelled = false;
    const live = season === data.state?.season && week >= nbaWeeksFor(data, season);
    setRes({ status: "loading", players: [] });
    nbaCached(`week-${season}-${week}`, live ? 10 * 60 * 1000 : 24 * 60 * 60 * 1000,
      () => window.SleeperNBA.fetchWeek(season, week))
      .then((players) => { if (!cancelled) setRes({ status: "live", players }); })
      .catch((err) => { if (!cancelled) setRes({ status: "error", players: [], message: err.message }); });
    return () => { cancelled = true; };
  }, [season, week, enabled]);
  return res;
}

// Games per team for the current fantasy week and the next: { [team]: { left,
// week, next } }, `left` being this week's games not yet played. In a weekly
// points league, more games is more points, so this matters for pickups.
function nbaTeamGames(data) {
  const out = {};
  if (data.state?.season_type !== "regular") return out;
  const wk = data.state.week;
  const today = new Date().toISOString().slice(0, 10);
  for (const g of data.schedule || []) {
    if (g.week !== wk && g.week !== wk + 1) continue;
    for (const t of [g.home, g.away]) {
      const c = out[t] || (out[t] = { left: 0, week: 0, next: 0 });
      if (g.week === wk) { c.week++; if (!g.done && g.date >= today) c.left++; } else c.next++;
    }
  }
  return out;
}
// A small "3 games left · 4 next" note for a team.
function NbaGamesNote({ games, team }) {
  const g = games[team];
  if (!g) return null;
  return (
    <span className="text-xs tabular-nums whitespace-nowrap" style={{ color: g.left >= 4 ? "var(--trend-up)" : "var(--text-muted)" }}
      title={`${team}: ${g.week} games this fantasy week (${g.left} still to play), ${g.next} next week`}>
      {g.left} G left · {g.next} next
    </span>
  );
}

const nbaPoints = (stats, scoring) => window.SleeperNBA.fantasyPoints(stats, scoring);
const nbaFpg = (p, scoring) => (p && p.gp ? nbaPoints(p.stats, scoring) / p.gp : 0);
const fmt1 = (n) => (n == null || Number.isNaN(n) ? "–" : n.toFixed(1));

const NBA_POSITIONS = ["PG", "SG", "SF", "PF", "C"];
const NBA_POSITION_OPTIONS = [{ key: "ALL", label: "ALL" }, ...NBA_POSITIONS.map((p) => ({ key: p, label: p }))];
const nbaPosMatch = (p, pos) => pos === "ALL" || p.position === pos || (p.positions || []).includes(pos);

// Shown on every basketball page until the data arrives (or if it can't).
function NbaGate({ data, children }) {
  if (data.status === "live") return !data.snapshotOn ? children : (
    <>
      <div className="rounded-lg border px-4 py-3 mb-5 text-sm" style={{ borderColor: "var(--series-amber)", background: "var(--surface-1)", color: "var(--text-secondary)" }}>
        Couldn't reach Sleeper, so this is the saved {data.snapshotOn} snapshot. Live data comes back on its own once Sleeper does.
      </div>
      {children}
    </>
  );
  return (
    <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-muted)" }}>
      {data.status === "error"
        ? <>Couldn't reach Sleeper ({data.message}), and there's no saved copy of this data in data/nba-snapshot.js
            to fall back on. Try again with network access.</>
        : "Loading basketball data from Sleeper…"}
    </div>
  );
}

function NbaSeasonNote({ data }) {
  if (data.currentHasGames) return null;
  const start = data.state.season_start_date;
  return (
    <div className="rounded-lg border px-4 py-3 text-sm" style={{ borderColor: "var(--sport)", background: "var(--surface-1)", color: "var(--text-secondary)" }}>
      The {nbaSeasonLabel(data.state.season)} season hasn't tipped off yet{start ? ` (opening night is ${new Date(start + "T12:00:00").toLocaleDateString(undefined, { month: "long", day: "numeric" })})` : ""}, so
      this shows last season, {nbaSeasonLabel(data.state.previous_season)}. It switches over on its own once games are played.
    </div>
  );
}

function NbaPageHeader({ title, lead, children }) {
  return (
    <header>
      <h2 className="text-2xl sm:text-3xl font-bold tracking-tight" style={{ color: "var(--text-primary)" }}>{title}</h2>
      <p className="text-sm mt-1" style={{ color: "var(--text-secondary)" }}>{lead}</p>
      <AboutData>{children}</AboutData>
    </header>
  );
}

const NbaInjuryTag = ({ status }) => status ? (
  <span className="text-xs font-semibold ml-1.5" style={{ color: NBA_STATUS_COLOR[status] || "var(--series-amber)" }}>{status}</span>
) : null;

// Most to least serious. GTD is game-time decision, DTD day-to-day.
const NBA_STATUSES = ["Out", "IR", "Sus", "Doubtful", "Questionable", "GTD", "DTD", "NA"];
const NBA_STATUS_COLOR = { Out: "var(--series-red)", IR: "var(--series-red)", Sus: "var(--series-red)", Doubtful: "var(--series-red)" };
const NBA_STATUS_LABEL = { GTD: "Game-time decision", DTD: "Day-to-day", Sus: "Suspended", NA: "Not active" };

/* ---------- Scoreboard ---------- */

function NbaScoreboard({ data, settings, setSettings }) {
  const seasons = [data.state.season, data.state.previous_season].filter((s) => nbaWeeksFor(data, s) > 0);
  const [pickedSeason, setSeason] = useState(null);
  const season = pickedSeason ?? data.activeSeason;
  const weeks = nbaWeeksFor(data, season);
  const [pickedWeek, setWeek] = useState(null);
  const week = pickedWeek && pickedWeek <= weeks ? pickedWeek : weeks;
  const [pos, setPos] = useState("ALL");
  const [view, setView] = useState("week");
  const [sortBy, setSortBy] = useState("total");
  const res = useNbaWeek(data, season, week, view === "week");
  // A new fantasy week opens Monday before its first game, so until then open
  // on last week rather than an empty table.
  useEffect(() => {
    if (!pickedWeek && res.status === "live" && res.players.length === 0 && week > 1) setWeek(week - 1);
  }, [res, pickedWeek, week]);

  const rows = useMemo(() => res.players
    .filter((p) => nbaPosMatch(p, pos))
    .map((p) => {
      const games = p.games.map((g) => ({ ...g, fp: nbaPoints(g.stats, settings.scoring) }));
      const total = games.reduce((s, g) => s + g.fp, 0);
      return { ...p, games, total, fpg: total / games.length };
    })
    .sort(sortBy === "fpg" ? (a, b) => b.fpg - a.fpg || b.total - a.total : (a, b) => b.total - a.total),
  [res.players, pos, settings.scoring, sortBy]);

  const day = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { weekday: "short", month: "numeric", day: "numeric" });
  const gameChips = (games) => games.map((g) => (
    <span key={g.date} className="text-[11px] tabular-nums rounded px-1.5 py-0.5 whitespace-nowrap"
      title={`${day(g.date)} vs ${g.opp || "?"}: ${fmt1(g.fp)} pts`}
      style={{ background: "var(--surface-2)", color: "var(--text-secondary)" }}>
      {day(g.date).split(",")[0]} <strong style={{ color: "var(--text-primary)" }}>{fmt1(g.fp)}</strong>
    </span>
  ));

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Weekly Scores" lead={view === "week"
        ? "Every player's fantasy points for one fantasy week (Monday to Sunday), game by game."
        : `The season's top fantasy scorers so far in ${settings.scoring === "espn" ? "ESPN" : "Standard"} scoring.`}>
        Live from Sleeper's NBA stats. A fantasy week runs Monday to Sunday, so players can have anywhere from zero to
        four or five games; the total is what counts in a weekly head-to-head points matchup. Top scorers ranks season
        totals instead. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="View">
          <PillGroup options={[{ key: "week", label: "Week" }, { key: "leaders", label: "Top scorers" }]} value={view} onChange={setView} />
        </LabeledControl>
        <LabeledControl label="Season">
          <PillGroup options={seasons.map((s) => ({ key: s, label: nbaSeasonLabel(s) }))} value={season} onChange={(s) => { setSeason(s); setWeek(null); }} />
        </LabeledControl>
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring}
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
      </div>
      {view === "week" && (
        <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
          <LabeledControl label="Week">
            <PillGroup options={Array.from({ length: weeks }, (_, i) => ({ key: i + 1, label: `Wk ${i + 1}` }))} value={week} onChange={setWeek} scroll />
          </LabeledControl>
          <LabeledControl label="Sort">
            <PillGroup options={[{ key: "total", label: "Total" }, { key: "fpg", label: "Average" }]} value={sortBy} onChange={setSortBy} />
          </LabeledControl>
        </div>
      )}

      {view === "leaders" && <NbaTopScorers data={data} season={season} pos={pos} scoring={settings.scoring} />}
      {view === "week" && <>
      {res.status === "loading" && <p className="text-sm py-6 text-center" style={{ color: "var(--text-muted)" }}>Loading Week {week}…</p>}
      {res.status === "error" && <p className="text-sm py-6 text-center" style={{ color: "var(--text-muted)" }}>Couldn't load Week {week} ({res.message}).</p>}
      {res.status === "live" && (
        <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
          <table className="w-full border-collapse text-sm">
            <thead>
              <tr>
                {["RK", "Player", "Pos", "Games", "GP"].map((h, i) => (
                  <th key={h} className={`px-3 py-2 text-xs font-semibold sticky top-0 z-10 ${i >= 4 || i === 0 ? "text-right" : "text-left"} ${i >= 2 ? "hidden sm:table-cell" : ""}`}
                    style={{ color: "var(--text-muted)" }}>{h}</th>

                {/* On phones the FPG column is hidden, so Total shows the average when that's the sort. */}
                <SortHeader label={<><span className="sm:hidden">{sortBy === "fpg" ? "FPG" : "Total"}</span><span className="hidden sm:inline">Total</span></>}
                  active={sortBy === "total"} onClick={() => setSortBy("total")} />
              </tr>
            </thead>
            <tbody>
              {rows.length === 0 && (

                <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                  <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                  <td className="px-3 py-1.5 sm:whitespace-nowrap">
                    <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                    <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>
                    {/* Phones: the hidden columns' details go on a line under the name. */}
                    <div className="sm:hidden flex items-center gap-1 flex-wrap mt-1">
                      <PosBadge pos={r.position} />{gameChips(r.games)}
                    </div>
                  </td>
                  <td className="px-3 py-1.5 hidden sm:table-cell"><PosBadge pos={r.position} /></td>
                  <td className="px-3 py-1.5 hidden sm:table-cell">
                    <span className="flex gap-1 flex-wrap">{gameChips(r.games)}</span>
                  </td>
                  <td className="px-3 py-1.5 text-right tabular-nums hidden sm:table-cell" style={{ color: "var(--text-secondary)" }}>{r.games.length}</td>
                  <td className={`px-3 py-1.5 text-right tabular-nums hidden sm:table-cell ${sortBy === "fpg" ? "font-semibold" : ""}`}
                    style={{ color: sortBy === "fpg" ? "var(--text-primary)" : "var(--text-secondary)" }}>{fmt1(r.fpg)}</td>
                  <td className={`px-3 py-1.5 text-right tabular-nums ${sortBy === "total" ? "font-semibold" : ""}`}
                    style={{ color: sortBy === "total" ? "var(--text-primary)" : "var(--text-secondary)" }}>
                    <span className="sm:hidden">{fmt1(sortBy === "fpg" ? r.fpg : r.total)}</span><span className="hidden sm:inline">{fmt1(r.total)}</span>
                  </td>
                </tr>
              ))}
            </tbody>
          </table>
        </div>
      )}
      </>}
    </div>
  );
}

// Season-to-date leaders for the Scoreboard's Top scorers view. Total ranks
// everyone who has played; FPG and PPG need the same games as the Big Board,
// so one big night doesn't top the list.
const NBA_LEADER_SORTS = {
  total: (a, b) => b.total - a.total,
  fpg: (a, b) => b.fpg - a.fpg,
  ppg: (a, b) => b.ppg - a.ppg,
};

function NbaTopScorers({ data, season, pos, scoring }) {
  const [sortBy, setSortBy] = useState("total");
  const all = data.seasons[season] || [];
  const minGp = sortBy === "total" ? 1 : nbaMinGames(all, season, data);
  const rows = useMemo(() => all
    .filter((p) => p.gp >= minGp && nbaPosMatch(p, pos))
    .map((p) => ({ ...p, total: nbaPoints(p.stats, scoring), fpg: nbaFpg(p, scoring), ppg: (p.stats.pts || 0) / p.gp }))
    .sort(NBA_LEADER_SORTS[sortBy])
    .slice(0, 50), [all, minGp, pos, sortBy, scoring]);

  return (
    <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
      <table className="w-full border-collapse text-sm">
        <thead>
          <tr>
            {["RK", "Player", "Pos", "GP"].map((h, i) => (
              <th key={h} className={`px-3 py-2 text-xs font-semibold sticky top-0 z-10 ${i === 1 || i === 2 ? "text-left" : "text-right"}`}
                style={{ color: "var(--text-muted)" }}>{h}</th>
            ))}
            <SortHeader label="Total" active={sortBy === "total"} onClick={() => setSortBy("total")} />
            <SortHeader label="FPG" active={sortBy === "fpg"} onClick={() => setSortBy("fpg")} />
            <SortHeader label="PPG" active={sortBy === "ppg"} onClick={() => setSortBy("ppg")} />
            {["REB", "AST"].map((h) => (
              <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>{h}</th>
            ))}
          </tr>
        </thead>
        <tbody>
          {rows.length === 0 && (
            <tr><td colSpan={9} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No games yet.</td></tr>
          )}
          {rows.map((r, i) => (
            <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
              <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
              <td className="px-3 py-1.5 whitespace-nowrap">
                <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                <span className="text-xs" style={{ color: "var(--text-muted)" }}>{data.players[r.id]?.team || r.team}</span>
                <NbaInjuryTag status={data.players[r.id]?.status} />
              </td>
              <td className="px-3 py-1.5"><PosBadge pos={r.position} /></td>
              <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.gp}</td>
              {[["total", r.total], ["fpg", r.fpg], ["ppg", r.ppg]].map(([k, v]) => (
                <td key={k} className={`px-3 py-1.5 text-right tabular-nums ${sortBy === k ? "font-semibold" : ""}`}
                  style={{ color: sortBy === k ? "var(--text-primary)" : "var(--text-secondary)" }}>{fmt1(v)}</td>
              ))}
              {["reb", "ast"].map((k) => (
                <td key={k} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmt1((r.stats[k] || 0) / r.gp)}</td>
              ))}
            </tr>
          ))}
        </tbody>
      </table>
    </div>
  );
}

function LabeledControl({ label, children }) {
  return (
    <div className="flex flex-col gap-1">

/* ---------- Big Board (rankings) ---------- */

const NBA_RANK_SORTS = {
  fpg: (a, b) => b.fpg - a.fpg,
  total: (a, b) => b.total - a.total,
  gp: (a, b) => b.gp - a.gp || b.fpg - a.fpg,
};
const NBA_PER_GAME = [["pts", "PTS"], ["reb", "REB"], ["ast", "AST"], ["stl", "STL"], ["blk", "BLK"], ["tpm", "3PM"], ["to", "TO"]];

// Enough games to rank: 20 for a finished season, a third of the games played
// so far in a season in progress.
function nbaMinGames(rows, season, data) {
  if (season !== data.state.season || data.state.season_type !== "regular") return 20;
  return Math.max(1, Math.round(Math.max(0, ...rows.map((p) => p.gp)) / 3));
}

function NbaRankings({ data, settings, setSettings }) {
  const seasons = [data.state.season, data.state.previous_season].filter((s) => (data.seasons[s] || []).length > 0);
  const [pickedSeason, setSeason] = useState(null);
  const season = pickedSeason ?? data.activeSeason;
  const [pos, setPos] = useState("ALL");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("fpg");
  const all = data.seasons[season] || [];
  const minGp = nbaMinGames(all, season, data);
  // Only meaningful for the season being played.
  const games = useMemo(() => (season === data.state.season ? nbaTeamGames(data) : {}), [data, season]);
  const hasGames = Object.keys(games).length > 0;

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return all
      .filter((p) => p.gp >= minGp && nbaPosMatch(p, pos))
      .filter((p) => !q || p.name.toLowerCase().includes(q) || (p.team || "").toLowerCase() === q)
      .map((p) => ({ ...p, fpg: nbaFpg(p, settings.scoring), total: nbaPoints(p.stats, settings.scoring) }))
      .sort(NBA_RANK_SORTS[sortBy]);
  }, [all, minGp, pos, query, sortBy, settings.scoring]);

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Player Rankings" lead={`Every player ranked by fantasy points per game in ${settings.scoring === "espn" ? "ESPN" : "Standard"} scoring.`}>
        Season totals live from Sleeper. Players need at least {minGp} games to be ranked. Per-game columns are real
        averages for the season shown. "G left" is how many games the player's team still has this fantasy week (green at
        4 or more) and "Next" its games next week, from Sleeper's schedule. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="Season">
          <PillGroup options={seasons.map((s) => ({ key: s, label: nbaSeasonLabel(s) }))} value={season} onChange={setSeason} />
        </LabeledControl>
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring}
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
        <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search player or team" aria-label="Search player or team"
          className="rounded-md border px-3 py-1.5 text-sm w-full sm:w-56 sm:ml-auto" style={inputStyle} />
      </div>

      <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr>
              <th className="text-right px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>RK</th>
              <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>Player</th>
              <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>Pos</th>
              <SortHeader label="GP" active={sortBy === "gp"} onClick={() => setSortBy("gp")} />
              {hasGames && ["G left", "Next"].map((h) => (
                <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10 whitespace-nowrap" style={{ color: "var(--text-muted)" }}
                  title={h === "G left" ? "Games the team still has this fantasy week" : "Games next fantasy week"}>{h}</th>
              ))}
              <SortHeader label="FPG" active={sortBy === "fpg"} onClick={() => setSortBy("fpg")} />
              <SortHeader label="Total" active={sortBy === "total"} onClick={() => setSortBy("total")} />
              {NBA_PER_GAME.map(([, h]) => (
                <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr><td colSpan={15} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No matches.</td></tr>
            )}
            {rows.map((r, i) => (
              <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                <td className="px-3 py-1.5 whitespace-nowrap">
                  <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{data.players[r.id]?.team || r.team}</span>
                  <NbaInjuryTag status={data.players[r.id]?.status} />
                </td>
                <td className="px-3 py-1.5"><PosBadge pos={r.position} /></td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.gp}</td>
                {hasGames && (() => {
                  const g = games[data.players[r.id]?.team || r.team];
                  return <>
                    <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: g?.left >= 4 ? "var(--trend-up)" : "var(--text-secondary)" }}>{g ? g.left : "–"}</td>
                    <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{g ? g.next : "–"}</td>
                  </>;
                })()}
                <td className="px-3 py-1.5 text-right tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{fmt1(r.fpg)}</td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{Math.round(r.total).toLocaleString()}</td>
                {NBA_PER_GAME.map(([k]) => (
                  <td key={k} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmt1((r.stats[k] || 0) / r.gp)}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Waiver Desk ---------- */

// Today's pickup list, re-picked every morning by scripts/refresh-nba-waivers.js
// (see lib/nba-waivers.js). Older than this and the page says it's out of date.
const loadNbaWaivers = () => loadDataScript("data/nba-waivers.js", "NBA_WAIVERS");
const NBA_WAIVERS_STALE_DAYS = 2;

function NbaPickups({ games, ownerOf, hideRostered }) {
  const [list, setList] = useState(undefined);
  useEffect(() => {
    let cancelled = false;
    loadNbaWaivers().then((l) => { if (!cancelled) setList(l); });
    return () => { cancelled = true; };
  }, []);
  if (list === undefined) return null;
  const targets = list?.targets || [];
  const age = list ? (Date.now() - new Date(list.updatedOn + "T12:00:00").getTime()) / 86400000 : Infinity;
  const updated = list && new Date(list.updatedOn + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });
  const shown = targets.filter((t) => !(hideRostered && ownerOf(t.id)));
  return (
    <section className="flex flex-col gap-2">
      <div className="flex items-center gap-2 flex-wrap">
        <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>Today's pickups</h3>
        {list && <span className="text-xs" style={{ color: "var(--text-muted)" }}>updated {updated} · re-picked every morning</span>}
      </div>
      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        Picked from each player's last five games (20+ minutes a night), Sleeper adds, injured teammates and games left this
        week. Players drafted inside the top 130 are left out as likely rostered. Points in the notes are Standard scoring.
      </p>
      {age > NBA_WAIVERS_STALE_DAYS && (
        <p className="text-xs" style={{ color: "var(--series-amber)" }}>
          {list ? `This list hasn't been re-picked since ${updated}, so some notes may be out of date.` : "Today's list couldn't be loaded."}
        </p>
      )}
      {list && (
        <PickTable sport="nba" rows={shown} ownerOf={(t) => ownerOf(t.id)}
          emptyText={targets.length ? "Everyone on this list is already rostered in your league." : "No pickups stand out today."}
          extra={(t) => <NbaGamesNote games={games} team={t.team} />} />
      )}
    </section>
  );
}

function NbaWaivers({ data, settings }) {
  const [direction, setDirection] = useState("add");
  const [trend, setTrend] = useState({ status: "loading", rows: [] });
  const season = data.activeSeason;
  const byId = useMemo(() => Object.fromEntries((data.seasons[season] || []).map((p) => [p.id, p])), [data, season]);
  const games = useMemo(() => nbaTeamGames(data), [data]);
  const { ownerOf, hideRostered } = useRostered("nba");

  useEffect(() => {
    let cancelled = false;
    setTrend({ status: "loading", rows: [] });
    window.SleeperNBA.fetchTrending(direction, 60)
      .then((list) => { if (!cancelled) setTrend({ status: "live", rows: list.filter((t) => data.players[t.player_id]) }); })
      .catch((err) => { if (!cancelled) setTrend({ status: "error", rows: [], message: err.message }); });
    return () => { cancelled = true; };
  }, [direction]);

  // Heating up: biggest jump in fantasy points per game over the last two
  // fantasy weeks that have games, versus the player's games before them. A
  // player with fewer than 3 earlier games (early in the season) is measured
  // against last season instead, so the two numbers are never the same games.
  const weeks = data.currentHasGames ? nbaWeeksFor(data, data.state.season) : 0;
  const w0 = useNbaWeek(data, data.state.season, weeks, weeks >= 1);
  const w1 = useNbaWeek(data, data.state.season, weeks - 1, weeks >= 2);
  const w2 = useNbaWeek(data, data.state.season, weeks - 2, weeks >= 3);
  const lastSeason = useMemo(() => Object.fromEntries((data.seasons[data.state.previous_season] || []).map((p) => [p.id, p])), [data]);
  const span = [w0, w1, w2].slice(0, weeks);
  const windowReady = weeks > 0 && span.every((w) => w.status === "live");
  const hot = useMemo(() => {
    if (!windowReady) return [];
    // A week before its first game is empty, so skip it.
    const recentWeeks = span.filter((w) => w.players.length > 0).slice(0, 2);
    const recent = {};
    for (const w of recentWeeks) for (const p of w.players) {
      const r = recent[p.id] || (recent[p.id] = { p, pts: 0, gp: 0 });
      for (const g of p.games) { r.pts += nbaPoints(g.stats, settings.scoring); r.gp++; }
    }
    return Object.values(recent)
      .filter((r) => r.gp >= 2 && r.pts / r.gp >= 20)
      .map((r) => {
        const s = byId[r.p.id];
        const earlierGp = s ? s.gp - r.gp : 0;
        const base = earlierGp >= 3
          ? { before: (nbaPoints(s.stats, settings.scoring) - r.pts) / earlierGp, vs: "before" }
          : lastSeason[r.p.id] ? { before: nbaFpg(lastSeason[r.p.id], settings.scoring), vs: "last season" } : null;
        return base && { ...r.p, recent: r.pts / r.gp, gp: r.gp, ...base, jump: r.pts / r.gp - base.before };
      })
      .filter((r) => r && r.jump > 0)
      .sort((a, b) => b.jump - a.jump)
      .slice(0, 12);
  }, [windowReady, w0, w1, w2, settings.scoring, byId, lastSeason]);

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Waiver Wire" lead="Today's best pickups, who Sleeper managers are adding and dropping right now, and who's heating up.">
        Today's pickups are re-picked every morning from Sleeper's data. Trending adds and drops are live from Sleeper (last 24 hours across real Sleeper leagues). FPG is fantasy points
        per game for {nbaSeasonLabel(season)} in {settings.scoring === "espn" ? "ESPN" : "Standard"} scoring. "G left" is
        how many games the player's team still has this fantasy week (green at 4 or more), and "next" its games next week,
        from Sleeper's schedule. "Heating up"
        compares each player's last two fantasy weeks of games (2+ games, 20+ points per game) with his games before
        them, or with last season while he has fewer than 3 earlier games.
      </NbaPageHeader>

      <MyLeagueBar sport="nba" />

      <NbaPickups games={games} ownerOf={ownerOf} hideRostered={hideRostered} />

      <section className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
            Trending on Sleeper <span className="font-normal" style={{ color: "var(--text-muted)" }}>· live</span>
          </h3>
          <PillGroup options={[{ key: "add", label: "Adds" }, { key: "drop", label: "Drops" }]} value={direction} onChange={setDirection} />
        </div>
        {trend.status === "loading" && <p className="text-sm py-3 text-center" style={{ color: "var(--text-muted)" }}>Loading…</p>}
        {trend.status === "error" && <p className="text-sm py-3 text-center" style={{ color: "var(--text-muted)" }}>Couldn't reach Sleeper ({trend.message}).</p>}
        {trend.status === "live" && (
          <ol className="grid gap-x-6 sm:grid-cols-2">
            {trend.rows.filter((t) => !(hideRostered && ownerOf(t.player_id))).slice(0, 20).map((t, i) => {
              const p = data.players[t.player_id];
              const s = byId[t.player_id];
              return (
                <li key={t.player_id} className="flex items-center justify-between gap-3 py-1.5 border-b text-sm" style={{ borderColor: "var(--border)" }}>
                  <span className="min-w-0 truncate">
                    <span className="tabular-nums text-xs mr-2" style={{ color: "var(--text-muted)" }}>{i + 1}</span>
                    <PlayerLink sport="nba" id={t.player_id}>{p.name}</PlayerLink>{" "}
                    <PosBadge pos={p.position} /> <span className="text-xs" style={{ color: "var(--text-muted)" }}>{p.team}</span>
                    <NbaInjuryTag status={p.status} /><RosteredTag owner={ownerOf(t.player_id)} />
                  </span>
                  <span className="flex items-center gap-3 shrink-0 tabular-nums">
                    <span className="hidden sm:inline"><NbaGamesNote games={games} team={p.team} /></span>
                    <span className="text-xs" style={{ color: "var(--text-secondary)" }}>{s ? `${fmt1(nbaFpg(s, settings.scoring))} FPG` : "no games"}</span>
                    <span className="font-semibold" style={{ color: direction === "add" ? "var(--trend-up)" : "var(--series-red)" }}>
                      {t.count.toLocaleString()}
                    </span>
                  </span>
                </li>
              );
            })}
          </ol>
        )}
      </section>
