/* ---------- Big Board (rankings) ---------- */

const NBA_RANK_SORTS = {
  fpg: (a, b) => b.fpg - a.fpg,
  total: (a, b) => b.total - a.total,
  gp: (a, b) => b.gp - a.gp || b.fpg - a.fpg,
};
const NBA_PER_GAME = [["pts", "PTS"], ["reb", "REB"], ["ast", "AST"], ["stl", "STL"], ["blk", "BLK"], ["tpm", "3PM"], ["to", "TO"]];

// Enough games to rank: 20 for a finished season, a third of the games played
// so far in a season in progress.
function nbaMinGames(rows, season, data) {
  if (season !== data.state.season || data.state.season_type !== "regular") return 20;
  return Math.max(1, Math.round(Math.max(0, ...rows.map((p) => p.gp)) / 3));
}

function NbaRankings({ data, settings, setSettings }) {
  const seasons = [data.state.season, data.state.previous_season].filter((s) => (data.seasons[s] || []).length > 0);
  const [pickedSeason, setSeason] = useState(null);
  const season = pickedSeason ?? data.activeSeason;
  const [pos, setPos] = useState("ALL");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("fpg");
  const all = data.seasons[season] || [];
  const minGp = nbaMinGames(all, season, data);
  // Only meaningful for the season being played.
  const games = useMemo(() => (season === data.state.season ? nbaTeamGames(data) : {}), [data, season]);
  const hasGames = Object.keys(games).length > 0;

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return all
      .filter((p) => p.gp >= minGp && nbaPosMatch(p, pos))
      .filter((p) => !q || p.name.toLowerCase().includes(q) || (p.team || "").toLowerCase() === q)
      .map((p) => ({ ...p, fpg: nbaFpg(p, settings.scoring), total: nbaPoints(p.stats, settings.scoring) }))
      .sort(NBA_RANK_SORTS[sortBy]);
  }, [all, minGp, pos, query, sortBy, settings.scoring]);

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Player Rankings" lead={`Every player ranked by fantasy points per game in ${settings.scoring === "espn" ? "ESPN" : "Standard"} scoring.`}>
        Season totals live from Sleeper. Players need at least {minGp} games to be ranked. Per-game columns are real
        averages for the season shown. "G left" is how many games the player's team still has this fantasy week (green at
        4 or more) and "Next" its games next week, from Sleeper's schedule. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="Season">
          <PillGroup options={seasons.map((s) => ({ key: s, label: nbaSeasonLabel(s) }))} value={season} onChange={setSeason} />
        </LabeledControl>
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring}
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
        <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search player or team"
          className="rounded-md border px-3 py-1.5 text-sm w-full sm:w-56 sm:ml-auto" style={inputStyle} />
      </div>

      <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
        <table className="w-full border-collapse text-sm">
          <thead>
            <tr>
              <th className="text-right px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>RK</th>
              <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>Player</th>
              <th className="text-left px-3 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>Pos</th>
              <SortHeader label="GP" active={sortBy === "gp"} onClick={() => setSortBy("gp")} />
              {hasGames && ["G left", "Next"].map((h) => (
                <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10 whitespace-nowrap" style={{ color: "var(--text-muted)" }}
                  title={h === "G left" ? "Games the team still has this fantasy week" : "Games next fantasy week"}>{h}</th>
              ))}
              <SortHeader label="FPG" active={sortBy === "fpg"} onClick={() => setSortBy("fpg")} />
              <SortHeader label="Total" active={sortBy === "total"} onClick={() => setSortBy("total")} />
              {NBA_PER_GAME.map(([, h]) => (
                <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {rows.length === 0 && (
              <tr><td colSpan={15} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No matches.</td></tr>
            )}
            {rows.map((r, i) => (
              <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                <td className="px-3 py-1.5 whitespace-nowrap">
                  <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{data.players[r.id]?.team || r.team}</span>
                  <NbaInjuryTag status={data.players[r.id]?.status} />
                </td>
                <td className="px-3 py-1.5"><PosBadge pos={r.position} /></td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.gp}</td>
                {hasGames && (() => {
                  const g = games[data.players[r.id]?.team || r.team];
                  return <>
                    <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: g?.left >= 4 ? "var(--trend-up)" : "var(--text-secondary)" }}>{g ? g.left : "–"}</td>
                    <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{g ? g.next : "–"}</td>
                  </>;
                })()}
                <td className="px-3 py-1.5 text-right tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{fmt1(r.fpg)}</td>
                <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{Math.round(r.total).toLocaleString()}</td>
                {NBA_PER_GAME.map(([k]) => (
                  <td key={k} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmt1((r.stats[k] || 0) / r.gp)}</td>
                ))}
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Waiver Desk ---------- */

function NbaWaivers({ data, settings }) {
  const [direction, setDirection] = useState("add");
  const [trend, setTrend] = useState({ status: "loading", rows: [] });
  const season = data.activeSeason;
  const byId = useMemo(() => Object.fromEntries((data.seasons[season] || []).map((p) => [p.id, p])), [data, season]);
  const games = useMemo(() => nbaTeamGames(data), [data]);
  const { ownerOf, hideRostered } = useRostered("nba");

  useEffect(() => {
    let cancelled = false;
    setTrend({ status: "loading", rows: [] });
    window.SleeperNBA.fetchTrending(direction, 60)
      .then((list) => { if (!cancelled) setTrend({ status: "live", rows: list.filter((t) => data.players[t.player_id]) }); })
      .catch((err) => { if (!cancelled) setTrend({ status: "error", rows: [], message: err.message }); });
    return () => { cancelled = true; };
  }, [direction]);

  // Heating up: biggest jump in fantasy points per game over the last two
  // fantasy weeks that have games, versus the player's games before them. A
  // player with fewer than 3 earlier games (early in the season) is measured
  // against last season instead, so the two numbers are never the same games.
  const weeks = data.currentHasGames ? nbaWeeksFor(data, data.state.season) : 0;
  const w0 = useNbaWeek(data, data.state.season, weeks, weeks >= 1);
  const w1 = useNbaWeek(data, data.state.season, weeks - 1, weeks >= 2);
  const w2 = useNbaWeek(data, data.state.season, weeks - 2, weeks >= 3);
  const lastSeason = useMemo(() => Object.fromEntries((data.seasons[data.state.previous_season] || []).map((p) => [p.id, p])), [data]);
  const span = [w0, w1, w2].slice(0, weeks);
  const windowReady = weeks > 0 && span.every((w) => w.status === "live");
  const hot = useMemo(() => {
    if (!windowReady) return [];
    // A week before its first game is empty, so skip it.
    const recentWeeks = span.filter((w) => w.players.length > 0).slice(0, 2);
    const recent = {};
    for (const w of recentWeeks) for (const p of w.players) {
      const r = recent[p.id] || (recent[p.id] = { p, pts: 0, gp: 0 });
      for (const g of p.games) { r.pts += nbaPoints(g.stats, settings.scoring); r.gp++; }
    }
    return Object.values(recent)
      .filter((r) => r.gp >= 2 && r.pts / r.gp >= 20)
      .map((r) => {
        const s = byId[r.p.id];
        const earlierGp = s ? s.gp - r.gp : 0;
        const base = earlierGp >= 3
          ? { before: (nbaPoints(s.stats, settings.scoring) - r.pts) / earlierGp, vs: "before" }
          : lastSeason[r.p.id] ? { before: nbaFpg(lastSeason[r.p.id], settings.scoring), vs: "last season" } : null;
        return base && { ...r.p, recent: r.pts / r.gp, gp: r.gp, ...base, jump: r.pts / r.gp - base.before };
      })
      .filter((r) => r && r.jump > 0)
      .sort((a, b) => b.jump - a.jump)
      .slice(0, 12);
  }, [windowReady, w0, w1, w2, settings.scoring, byId, lastSeason]);

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Waiver Wire" lead="Who Sleeper managers are adding and dropping right now, and who's heating up.">
        Trending adds and drops are live from Sleeper (last 24 hours across real Sleeper leagues). FPG is fantasy points
        per game for {nbaSeasonLabel(season)} in {settings.scoring === "espn" ? "ESPN" : "Standard"} scoring. "G left" is
        how many games the player's team still has this fantasy week (green at 4 or more), and "next" its games next week,
        from Sleeper's schedule. "Heating up"
        compares each player's last two fantasy weeks of games (2+ games, 20+ points per game) with his games before
        them, or with last season while he has fewer than 3 earlier games.
      </NbaPageHeader>

      <MyLeagueBar sport="nba" />

      <section className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
        <div className="flex items-center justify-between flex-wrap gap-2">
          <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>
            Trending on Sleeper <span className="font-normal" style={{ color: "var(--text-muted)" }}>· live</span>
          </h3>
          <PillGroup options={[{ key: "add", label: "Adds" }, { key: "drop", label: "Drops" }]} value={direction} onChange={setDirection} />
        </div>
        {trend.status === "loading" && <p className="text-sm py-3 text-center" style={{ color: "var(--text-muted)" }}>Loading…</p>}
        {trend.status === "error" && <p className="text-sm py-3 text-center" style={{ color: "var(--text-muted)" }}>Couldn't reach Sleeper ({trend.message}).</p>}
        {trend.status === "live" && (
          <ol className="grid gap-x-6 sm:grid-cols-2">
            {trend.rows.filter((t) => !(hideRostered && ownerOf(t.player_id))).slice(0, 20).map((t, i) => {
              const p = data.players[t.player_id];
              const s = byId[t.player_id];
              return (
                <li key={t.player_id} className="flex items-center justify-between gap-3 py-1.5 border-b text-sm" style={{ borderColor: "var(--border)" }}>
                  <span className="min-w-0 truncate">
                    <span className="tabular-nums text-xs mr-2" style={{ color: "var(--text-muted)" }}>{i + 1}</span>
                    <PlayerLink sport="nba" id={t.player_id}>{p.name}</PlayerLink>{" "}
                    <PosBadge pos={p.position} /> <span className="text-xs" style={{ color: "var(--text-muted)" }}>{p.team}</span>
                    <NbaInjuryTag status={p.status} /><RosteredTag owner={ownerOf(t.player_id)} />
                  </span>
                  <span className="flex items-center gap-3 shrink-0 tabular-nums">
                    <span className="hidden sm:inline"><NbaGamesNote games={games} team={p.team} /></span>
                    <span className="text-xs" style={{ color: "var(--text-secondary)" }}>{s ? `${fmt1(nbaFpg(s, settings.scoring))} FPG` : "no games"}</span>
                    <span className="font-semibold" style={{ color: direction === "add" ? "var(--trend-up)" : "var(--series-red)" }}>
                      {t.count.toLocaleString()}
                    </span>
                  </span>
                </li>
              );
            })}
          </ol>
        )}
      </section>

      <section className="rounded-lg border p-4 flex flex-col gap-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>
        <h3 className="text-sm font-semibold" style={{ color: "var(--text-primary)" }}>Heating up <span className="font-normal" style={{ color: "var(--text-muted)" }}>· last two weeks vs. before</span></h3>
        {weeks < 1 ? (
          <p className="text-sm" style={{ color: "var(--text-muted)" }}>
            Shows up once the {nbaSeasonLabel(data.state.season)} season has games.
          </p>
        ) : hot.length === 0 ? (
          <p className="text-sm" style={{ color: "var(--text-muted)" }}>{windowReady ? "Nobody's jumped enough to list yet." : "Loading…"}</p>
        ) : (
          <ol className="flex flex-col">
            {hot.filter((r) => !(hideRostered && ownerOf(r.id))).map((r) => (
              <li key={r.id} className="flex items-center justify-between gap-3 py-1.5 border-b text-sm" style={{ borderColor: "var(--border)" }}>
                <span className="min-w-0 truncate">
                  <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                  <PosBadge pos={r.position} /> <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>
                  <RosteredTag owner={ownerOf(r.id)} />
                </span>
                <span className="flex items-center gap-3 shrink-0 tabular-nums text-xs">
                  <span className="hidden sm:inline"><NbaGamesNote games={games} team={r.team} /></span>
                  <span style={{ color: "var(--text-secondary)" }}>{fmt1(r.recent)} FPG in {r.gp} games · {r.vs} {fmt1(r.before)}</span>
                  <span className="font-semibold text-sm" style={{ color: "var(--trend-up)" }}>▲ {fmt1(r.jump)}</span>
                </span>
              </li>
            ))}
          </ol>
        )}
      </section>
    </div>
  );
}

/* ---------- Training Room (injuries) ---------- */

function NbaInjuries({ data, settings }) {

  const byId = useMemo(() => Object.fromEntries((data.seasons[season] || []).map((p) => [p.id, p])), [data, season]);
  // The Trade Desk's FPG, which blends in last season until a player has
  // enough games, so injured regulars still count early in the season.
  const fpgById = useMemo(
    () => Object.fromEntries(nbaTradeRows(data, settings.scoring).rows.map((r) => [r.id, r.fpg])),
    [data, settings.scoring]

  const rows = useMemo(() => Object.entries(data.players)
    .filter(([, p]) => NBA_STATUSES.includes(p.status) && nbaPosMatch(p, pos))

    .filter((r) => scope === "all" || r.fpg >= 15)
    .sort((a, b) => NBA_STATUSES.indexOf(a.status) - NBA_STATUSES.indexOf(b.status) || (b.fpg ?? 0) - (a.fpg ?? 0)),
  [data.players, byId, fpgById, pos, scope]);

  return (
    <div className="flex flex-col gap-5">

        points per game ({settings.scoring === "espn" ? "ESPN" : "Standard"} scoring), the same blend the Trade Desk uses:
        this season, with last season mixed in until a player has {NBA_BLEND_GAMES} games. GP is games played
        in {nbaSeasonLabel(season)}.

        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
      </div>

      <div className="rounded-lg border overflow-x-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)" }}>

            )}
            {rows.map((r) => (
              <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                <td className="px-3 py-2 whitespace-nowrap">
                  <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                  <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>
                </td>
                <td className="px-3 py-2"><PosBadge pos={r.position} /></td>
                <td className="px-3 py-2 whitespace-nowrap">
                  <span className="text-xs font-semibold" style={{ color: NBA_STATUS_COLOR[r.status] || "var(--series-amber)" }}>
                    {NBA_STATUS_LABEL[r.status] || r.status}
                  </span>
                </td>
                <td className="px-3 py-2" style={{ color: "var(--text-secondary)" }}>
                  {[r.injury, r.notes].filter(Boolean).join(" — ") || "–"}

                <td className="px-3 py-2 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.season ? r.season.gp : r.fpg != null ? 0 : "–"}</td>
              </tr>
            ))}
          </tbody>
        </table>
      </div>
    </div>
  );
}

/* ---------- Trade Desk (season-long) ---------- */

// Trade value for a season-long league: projected fantasy points for the
// rest of the season = points per game × team games left × how often the
// player actually plays.
// - Points per game blends this season with last: last season counts as
//   (15 − games played this season) games of weight, so it fades out after
//   15 games. Before tip-off it's simply last season.
// - Availability is games played ÷ team games (this season once he's played
//   10, otherwise last season), kept between 50% and 100%.
// Rookies and anyone without NBA games yet have no value until they play.
const NBA_BLEND_GAMES = 15;
const NBA_ROSTER_SPOTS = 13;

function nbaTradeRows(data, scoring) {
  const { state, seasons, players } = data;
  const cur = seasons[state.season] || [];
  const prev = seasons[state.previous_season] || [];
  const curById = Object.fromEntries(cur.map((p) => [p.id, p]));
  const prevById = Object.fromEntries(prev.map((p) => [p.id, p]));
  const teamGames = Math.max(0, ...cur.map((p) => p.gp));
  const inSeason = state.season_type === "regular" && teamGames > 0;
  const gamesLeft = inSeason ? Math.max(NBA_TEAM_GAMES - teamGames, 1) : NBA_TEAM_GAMES;

  const rows = [];
  for (const id of new Set([...cur.map((p) => p.id), ...prev.map((p) => p.id)])) {
    const c = curById[id], p = prevById[id];
    const curGp = c ? c.gp : 0;
    const prevFpg = p ? nbaFpg(p, scoring) : null;
    const k = prevFpg != null ? Math.max(0, NBA_BLEND_GAMES - curGp) : 0;
    if (curGp + k === 0) continue;
    const fpg = ((c ? nbaPoints(c.stats, scoring) : 0) + (prevFpg || 0) * k) / (curGp + k);
    const avail = Math.min(1, Math.max(0.5, curGp >= 10 && teamGames ? curGp / teamGames : p ? p.gp / NBA_TEAM_GAMES : 0.8));
    const base = c || p;
    const now = players[id];
    rows.push({
      id, name: base.name, position: now?.position || base.position, team: now?.team || base.team, age: now?.age || null,
      fpg, avail, value: Math.round(fpg * gamesLeft * avail),
    });
  }
  rows.sort((a, b) => b.value - a.value);
  const posCount = {};
  return { rows: rows.map((r) => ({ ...r, posRank: (posCount[r.position] = (posCount[r.position] || 0) + 1) })), gamesLeft };
}

function NbaTrade({ data, settings, setSettings }) {
  const [sides, setSides] = useState(() => readTradeHash("nbatrade"));
  useEffect(() => { writeTradeHash(sides, "nbatrade", "#/nba/trade"); }, [sides]);

  const { rows, gamesLeft } = useMemo(() => nbaTradeRows(data, settings.scoring), [data, settings.scoring]);
  const byId = useMemo(() => Object.fromEntries(rows.map((r) => [r.id, r])), [rows]);
  const inDeal = useMemo(() => new Set([...sides[0], ...sides[1]]), [sides]);
  const ctx = useMemo(() => ({
    topValue: rows[0]?.value || 1,
    playerValues: rows.map((r) => r.value),
    teams: settings.teams,
    raw: settings.raw,
    rosterSpots: NBA_ROSTER_SPOTS,
    fairMin: 100,
  }), [rows, settings.teams, settings.raw]);
  const result = useMemo(() => evaluateTrade(sides.map((ids) => ids.map((id) => byId[id]?.value || 0)), ctx), [sides, byId, ctx]);

  const add = (si, id) => { if (!inDeal.has(id)) setSides((s) => s.map((ids, i) => (i === si ? [...ids, id] : ids))); };
  const remove = (si, idx) => setSides((s) => s.map((ids, i) => (i === si ? ids.filter((_, j) => j !== idx) : ids)));

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Trade Analyzer" lead={`See who wins a season-long trade in a ${settings.teams >= 16 ? "16+" : settings.teams}-team ${settings.scoring === "espn" ? "ESPN" : "Standard"} points league.`}>
        Each player's value is his projected fantasy points for the rest of the season: points per game × the {gamesLeft} team
        games left × how often he plays (games played ÷ team games, 50-100%). Points per game blends this season with last
        season until he's played {NBA_BLEND_GAMES} games; before tip-off it's last season's. Rookies and anyone without NBA
        games yet aren't valued until they play. Trades that aren't one-for-one get the same stud adjustment and roster spot
        credit as the football Trade Desk, with {NBA_ROSTER_SPOTS}-man rosters. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>
      <NbaSeasonNote data={data} />

      <div className="flex items-end justify-between flex-wrap gap-3">
        <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
          <LabeledControl label="Scoring">
            <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring}
              onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
          </LabeledControl>
          <LabeledControl label="Teams">
            <PillGroup options={NBA_SETTING_OPTIONS.teams} value={settings.teams}
              onChange={(v) => setSettings((s) => ({ ...s, teams: v }))} />
          </LabeledControl>
        </div>
        <div className="flex items-center gap-2">
          <button type="button" onClick={() => setSettings((s) => ({ ...s, raw: !s.raw }))}
            className="pill text-xs rounded-full px-3 py-1 font-medium" aria-pressed={settings.raw}
            title="Compare plain sums, with no stud adjustment or roster spot credit"
>Raw values</button>
          {(sides[0].length > 0 || sides[1].length > 0) && (
            <button type="button" onClick={() => setSides([[], []])} className="pill text-xs rounded-full px-3 py-1 font-medium"
              style={{ "--pill-accent": "var(--series-red)" }}>Clear trade</button>
          )}
        </div>
      </div>

      <div className="grid gap-4 md:grid-cols-2">
        {TRADE_SIDES.map((s, si) => (
          <TradeSide key={s} sport="nba" label={`Team ${s}`} color={SIDE_COLOR[s]} ids={sides[si]} byId={byId} rows={rows}
            exclude={inDeal} onAdd={(id) => add(si, id)} onRemove={(idx) => remove(si, idx)} result={result} index={si} />
        ))}
      </div>

      <TradeVerdict sport="nba" sides={sides} byId={byId} rows={rows} ctx={ctx} result={result} />
    </div>
  );
}

/* ---------- Projected Rankings ---------- */
// Sleeper's season projections, ranked in the league's scoring. Each
// projection is a per-game stat line, so projected points = projected FPG ×
// the team games left × how often the player has played (the same
// availability the Trade Analyzer uses; 80% for anyone with no NBA games).
// Only players on an NBA roster are kept, which also keeps the cache small.
function useNbaProjections(data, enabled) {
  const season = data.state?.season;
  const [state, setState] = useState({ status: "loading", rows: [] });
  const tick = useRefreshTick();
  useEffect(() => {
    if (!enabled || !season) return;
    let cancelled = false;
    nbaCached(`proj-${season}`, 6 * 60 * 60 * 1000, async () =>
      (await window.SleeperNBA.fetchProjections(season)).filter((r) => data.players[r.id]))
      .then((rows) => { if (!cancelled) setState({ status: "live", rows }); })
      // A failed background refresh keeps the last list up.
      .catch((err) => { if (!cancelled) setState((s) => (s.rows.length ? s : { status: "error", message: err.message, rows: [] })); });
    return () => { cancelled = true; };
  }, [season, enabled, tick]);
  return state;
}

const NBA_PROJ_SORTS = {
  total: (a, b) => b.total - a.total,
  fpg: (a, b) => b.fpg - a.fpg,
  adp: (a, b) => (a.adp ?? 999) - (b.adp ?? 999),
};

function NbaProjections({ data, settings, setSettings }) {
  const proj = useNbaProjections(data, true);
  const [pos, setPos] = useState("ALL");
  const [query, setQuery] = useState("");
  const [sortBy, setSortBy] = useState("total");
  const scoringLabel = settings.scoring === "espn" ? "ESPN" : "Standard";
  const season = data.state.season;
  // Compare against this season's real FPG once games are played, else last season's.
  const cmpSeason = data.currentHasGames ? season : data.state.previous_season;

  const { rows: valueRows, gamesLeft } = useMemo(() => nbaTradeRows(data, settings.scoring), [data, settings.scoring]);
  const ranked = useMemo(() => {
    const avail = Object.fromEntries(valueRows.map((r) => [r.id, r.avail]));
    const cmp = Object.fromEntries((data.seasons[cmpSeason] || []).map((p) => [p.id, p]));
    return proj.rows
      .map((p) => {
        const fpg = nbaPoints(p.stats, settings.scoring);
        const games = Math.round(gamesLeft * (avail[p.id] ?? 0.8));
        const now = data.players[p.id];
        return {
          ...p, position: now?.position || p.position, positions: now?.positions || p.positions, team: now?.team || p.team,
          fpg, games, total: fpg * games, lastFpg: cmp[p.id] ? nbaFpg(cmp[p.id], settings.scoring) : null,
        };
      })
      .sort(NBA_PROJ_SORTS.total)
      .map((r, i) => ({ ...r, projRank: i + 1 }));
  }, [proj.rows, valueRows, gamesLeft, data, cmpSeason, settings.scoring]);

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    return ranked
      .filter((r) => nbaPosMatch(r, pos))
      .filter((r) => !q || r.name.toLowerCase().includes(q) || (r.team || "").toLowerCase() === q)
      .sort(NBA_PROJ_SORTS[sortBy]);
  }, [ranked, pos, query, sortBy]);

  const th = (label, align = "right") => (
    <th className={`text-${align} px-3 py-2 text-xs font-semibold sticky top-0 z-10`} style={{ color: "var(--text-muted)" }}>{label}</th>
  );

  return (
    <div className="flex flex-col gap-5">
      <NbaPageHeader title="Projected Rankings"
        lead={`Every player ranked by projected ${nbaSeasonLabel(season)} fantasy points in ${scoringLabel} scoring, with Sleeper's ADP to spot bargains.`}>
        Projections are Sleeper's per-game stat lines for the {nbaSeasonLabel(season)} season, scored in your league's
        settings. Projected points = projected FPG × the {gamesLeft} team games left × how often he's played (games played ÷
        team games, 50-100%, from this season once he's played 10 games, otherwise last season; 80% for players without
        NBA games). <strong>vs ADP</strong> compares his projected rank with where he goes in Sleeper drafts: green means
        he's projected to outscore his draft spot. {NBA_SCORING_NOTE[settings.scoring]}
      </NbaPageHeader>

      <div className="flex items-end flex-wrap gap-x-4 gap-y-3">
        <LabeledControl label="Scoring">
          <PillGroup options={NBA_SETTING_OPTIONS.scoring} value={settings.scoring}
            onChange={(v) => setSettings((s) => ({ ...s, scoring: v }))} />
        </LabeledControl>
        <LabeledControl label="Position">
          <PillGroup options={NBA_POSITION_OPTIONS} value={pos} onChange={setPos} />
        </LabeledControl>
        <input type="search" value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Search player or team"
          className="rounded-md border px-3 py-1.5 text-sm w-full sm:w-56 sm:ml-auto" style={inputStyle} />
      </div>

      {proj.status === "error" ? (
        <div className="rounded-lg border p-8 text-center text-sm" style={{ borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-muted)" }}>
          Couldn't load projections from Sleeper ({proj.message}).
        </div>
      ) : (
        <div className="rounded-lg border overflow-auto" style={{ borderColor: "var(--border)", background: "var(--surface-1)", maxHeight: "75vh" }}>
          <table className="w-full border-collapse text-sm">
            <thead>
              <tr>
                {th("RK")}{th("Player", "left")}{th("Pos", "left")}
                <SortHeader label="Proj Pts" active={sortBy === "total"} onClick={() => setSortBy("total")} />
                <SortHeader label="Proj FPG" active={sortBy === "fpg"} onClick={() => setSortBy("fpg")} />
                {th("Games")}
                {th(`${nbaSeasonLabel(cmpSeason)} FPG`)}
                <SortHeader label="ADP" active={sortBy === "adp"} onClick={() => setSortBy("adp")} />
                {th("vs ADP")}
                {NBA_PER_GAME.map(([, h]) => <th key={h} className="text-right px-2 py-2 text-xs font-semibold sticky top-0 z-10" style={{ color: "var(--text-muted)" }}>{h}</th>)}
              </tr>
            </thead>
            <tbody>
              {proj.status === "loading" && (
                <tr><td colSpan={16} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>Loading projections from Sleeper…</td></tr>
              )}
              {proj.status === "live" && rows.length === 0 && (
                <tr><td colSpan={16} className="px-3 py-6 text-center" style={{ color: "var(--text-muted)" }}>No matches.</td></tr>
              )}
              {rows.map((r, i) => {
                const diff = r.adp != null ? Math.round(r.adp) - r.projRank : null;
                const change = r.lastFpg != null ? r.fpg - r.lastFpg : null;
                return (
                  <tr key={r.id} className="border-b row-hover" style={{ borderColor: "var(--border)" }}>
                    <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{i + 1}</td>
                    <td className="px-3 py-1.5 whitespace-nowrap">
                      <PlayerLink sport="nba" id={r.id}>{r.name}</PlayerLink>{" "}
                      <span className="text-xs" style={{ color: "var(--text-muted)" }}>{r.team}</span>
                      <NbaInjuryTag status={data.players[r.id]?.status} />
                    </td>
                    <td className="px-3 py-1.5"><PosBadge pos={r.position} /></td>
                    <td className="px-3 py-1.5 text-right tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{Math.round(r.total).toLocaleString()}</td>
                    <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-primary)" }}>{fmt1(r.fpg)}</td>
                    <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.games}</td>
                    <td className="px-3 py-1.5 text-right tabular-nums whitespace-nowrap" style={{ color: "var(--text-secondary)" }}>
                      {r.lastFpg != null ? fmt1(r.lastFpg) : "–"}
                      {change != null && Math.abs(change) >= 0.5 && (
                        <span className="text-xs ml-1" style={{ color: change > 0 ? "var(--trend-up)" : "var(--series-red)" }}
                          title={`Projected ${change > 0 ? "up" : "down"} ${fmt1(Math.abs(change))} FPG`}>
                          {change > 0 ? "▲" : "▼"}
                        </span>
                      )}
                    </td>
                    <td className="px-3 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{r.adp != null ? fmt1(r.adp) : "–"}</td>
                    <td className="px-3 py-1.5 text-right tabular-nums text-xs"
                      style={{ color: diff == null || Math.abs(diff) < 5 ? "var(--text-muted)" : diff > 0 ? "var(--trend-up)" : "var(--series-red)" }}>
                      {diff == null ? "–" : diff > 0 ? `+${diff}` : diff}
                    </td>
                    {NBA_PER_GAME.map(([k]) => (
                      <td key={k} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{fmt1(r.stats[k] || 0)}</td>
                    ))}
                  </tr>
                );
              })}
            </tbody>
          </table>
        </div>
      )}
    </div>
  );
}

/* ---------------- player profiles ---------------- */
// Every player gets a profile page at #/player/<Sleeper id> (football) or
// #/nba/player/<id> (basketball). Nothing is written per player: the page
// pulls the player's own game log, projections and bio from Sleeper, and his
// value from the same lists the other tabs use. There's no directory page:
// every tab links player names here through PlayerLink.
const PLAYER_HASH = { nfl: "#/player/", nba: "#/nba/player/" };
const playerHash = (sport, id) => `${PLAYER_HASH[sport]}${encodeURIComponent(id)}`;
const headshotUrl = (sport, id) => `https://sleepercdn.com/content/${sport}/players/thumb/${id}.jpg`;

// The id in a profile URL, kept in sync with back/forward and link clicks.
function usePlayerIdFromHash(sport) {
  const read = () => {
    const h = window.location.hash;
    return h.startsWith(PLAYER_HASH[sport]) ? decodeURIComponent(h.slice(PLAYER_HASH[sport].length)) : null;
  };
  const [id, setId] = useState(read);
  useEffect(() => {
    const sync = () => setId(read());
    window.addEventListener("hashchange", sync);
    window.addEventListener("popstate", sync);
    return () => { window.removeEventListener("hashchange", sync); window.removeEventListener("popstate", sync); };
  }, [sport]);
  return id;
}

// Football tabs carry three kinds of player id: Sleeper's own ("4984"),
// extras from the live scores ("sl-4984"), and this app's short ids for the
// shared player pool ("gibbs"). The short ones are matched to Sleeper by name
// and position, the same way the live scores and injury report match them.
function nflIdResolver(sleeperPlayers) {
  const S = window.SleeperScores;
  const byName = new Map();
  if (S) for (const id in sleeperPlayers) byName.set(`${S.normalizeName(sleeperPlayers[id].name)}|${sleeperPlayers[id].position}`, id);
  return (id, name, pos) => {
    if (!id) return null;
    id = String(id);
    if (/^\d+$/.test(id)) return id;
    if (id.startsWith("sl-")) return id.slice(3);
    if (!S) return null;
    return S.SLEEPER_ID_OVERRIDES[id] || byName.get(`${S.normalizeName(name)}|${pos}`) || null;
  };
}
const NflIdContext = React.createContext(nflIdResolver({}));

// A player's name as a link to his profile. Pass `name` and `pos` for
// football short ids so they can be matched; picks and anyone who can't be
// matched stay plain text.
// Players on your own team (see "My league" below) get a brass star.
function PlayerLink({ sport = "nfl", id, name, pos, children, className = "font-medium" }) {
  const resolve = React.useContext(NflIdContext);
  const my = React.useContext(MyLeagueContext);
  const target = pos === "PICK" ? null : sport === "nfl" ? resolve(id, name, pos) : id;
  const star = target && my[sport]?.mine?.has(String(target)) ? <MineStar /> : null;
  if (!target) return <span className={className} style={{ color: "var(--text-primary)" }}>{children}</span>;
  return <><a href={playerHash(sport, target)} className={`player-link ${className}`} onClick={() => window.scrollTo(0, 0)}>{children}</a>{star}</>;
}
const MineStar = () => <span className="ml-1 text-xs" title="On your team" aria-label="On your team" style={{ color: "var(--brass)" }}>★</span>;

/* ---------- my league (both sports) ---------- */
// Your own Sleeper league for each sport, saved in the browser
// ({ nfl: { leagueId, name, userId, availableOnly }, nba: … }). Your players get
// a ★ wherever a PlayerLink shows them, the Waiver Desks can hide everyone
// already on a roster, and the home page links to your Boardroom league.
const MY_LEAGUE_KEY = "ff-valuediff:my-league";
const MyLeagueContext = React.createContext({ save: () => {} });

// Only these are saved; the rosters are fetched fresh each visit.
const myLeagueFields = (l) => l && l.leagueId
  ? { leagueId: String(l.leagueId), name: l.name || "", userId: l.userId || null, availableOnly: !!l.availableOnly } : null;

function readMyLeagues() {
  try {
    const saved = JSON.parse(localStorage.getItem(MY_LEAGUE_KEY) || "{}") || {};
    const out = {};
    for (const sport of ["nfl", "nba"]) if (myLeagueFields(saved[sport])) out[sport] = myLeagueFields(saved[sport]);
    return out;
  } catch (e) { return {}; }
}

// App-level: the saved leagues plus who's on whose roster (Sleeper ids), kept
// current on useRefreshTick so waiver moves show up.
function useMyLeagueState() {
  const [saved, setSaved] = useState(readMyLeagues);
  const [rosters, setRosters] = useState({});
  const tick = useRefreshTick();
  const save = (sport, league) => setSaved((s) => {
    const next = { ...s };
    if (myLeagueFields(league)) next[sport] = myLeagueFields(league); else delete next[sport];
    try { localStorage.setItem(MY_LEAGUE_KEY, JSON.stringify(next)); } catch (e) {}
    return next;
  });
  useEffect(() => {
    for (const sport of ["nfl", "nba"]) {
      const l = saved[sport];
      if (!l) { setRosters((r) => ({ ...r, [sport]: null })); continue; }
      Promise.all([sleeperGet(`/league/${l.leagueId}/rosters`), sleeperGet(`/league/${l.leagueId}/users`)])
        .then(([list, users]) => {
          const names = Object.fromEntries((users || []).map((u) => [u.user_id, u.metadata?.team_name || u.display_name]));
          const rosteredBy = {};
          const mine = new Set();
          for (const r of list || []) {
            const owner = names[r.owner_id] || `Team ${r.roster_id}`;
            const isMine = l.userId && (r.owner_id === l.userId || (r.co_owners || []).includes(l.userId));
            for (const pid of [...(r.players || []), ...(r.reserve || []), ...(r.taxi || [])]) {
              rosteredBy[pid] = owner;
              if (isMine) mine.add(String(pid));
            }
          }
          setRosters((r) => ({ ...r, [sport]: { rosteredBy, mine } }));
        })
        .catch(() => {}); // keeps the last rosters up
    }
  }, [saved.nfl?.leagueId, saved.nba?.leagueId, tick]);
  return useMemo(() => ({
    nfl: saved.nfl && { ...saved.nfl, ...rosters.nfl },
    nba: saved.nba && { ...saved.nba, ...rosters.nba },
    save,
  }), [saved, rosters]);
}

// The "Your league" bar on the Waiver Desks: connect a Sleeper league once,
// then toggle between everyone and only the players still available in it.
function MyLeagueBar({ sport }) {
  const my = React.useContext(MyLeagueContext);
  const l = my[sport];
  const [input, setInput] = useState(() => { try { return localStorage.getItem(SLEEPER_USER_KEY) || ""; } catch (e) { return ""; } });
  const [found, setFound] = useState({ state: "idle" });
  const sportName = sport === "nba" ? "basketball" : "football";
  const pick = (league, userId) => {
    my.save(sport, { leagueId: league.league_id, name: league.name, userId: userId || null, availableOnly: true });
    setFound({ state: "idle" });
  };
  const find = async (e) => {
    e.preventDefault();
    const value = input.trim();
    if (!value) return;
    try { localStorage.setItem(SLEEPER_USER_KEY, value); } catch (err) {}
    setFound({ state: "loading" });
    try {
      // A league ID works too, but without a user there's no "your team" star.
      if (/^\d{9,}$/.test(value)) {
        const league = await sleeperGet(`/league/${value}`);
        if (!league || league.sport !== sport) throw new Error(`no Sleeper ${sportName} league with that ID`);
        return pick(league, null);
      }
      const u = await sleeperGet(`/user/${encodeURIComponent(value)}`);
      if (!u) throw new Error(`no Sleeper user named "${value}"`);
      const st = await sleeperGet(`/state/${sport}`);
      const list = (await sleeperGet(`/user/${u.user_id}/leagues/${sport}/${st.league_season || st.season}`)) || [];
      if (list.length === 0) throw new Error(`"${value}" isn't in any ${sportName} leagues this season`);
      if (list.length === 1) return pick(list[0], u.user_id);
      setFound({ state: "ready", list, userId: u.user_id });
    } catch (err) {
      setFound({ state: "error", message: err.message });
    }
  };

  const box = "rounded-lg border px-4 py-3 flex flex-col gap-2 text-sm";
  const boxStyle = { borderColor: "var(--border)", background: "var(--surface-1)" };
  if (l) return (
    <div className={`${box} sm:flex-row sm:items-center sm:justify-between`} style={boxStyle}>
      <span style={{ color: "var(--text-secondary)" }}>
        Your league: <strong style={{ color: "var(--text-primary)" }}>{l.name}</strong>
        {l.userId && <span className="text-xs" style={{ color: "var(--text-muted)" }}> · your players are starred <MineStar /></span>}
      </span>
      <span className="flex items-center gap-3">
        <PillGroup options={[{ key: "all", label: "Everyone" }, { key: "free", label: "Available only" }]}
          value={l.availableOnly ? "free" : "all"} onChange={(v) => my.save(sport, { ...l, availableOnly: v === "free" })} />
        <button type="button" className="text-xs font-medium" style={{ color: "var(--sport)" }} onClick={() => my.save(sport, null)}>Change</button>
      </span>
    </div>
  );
  return (
    <div className={box} style={boxStyle}>
      <form onSubmit={find} className="flex flex-col sm:flex-row sm:items-center gap-2">
        <span className="sm:mr-1" style={{ color: "var(--text-secondary)" }}>See who's actually available in your Sleeper league:</span>
        <span className="flex gap-2 flex-1">
          <input value={input} onChange={(e) => setInput(e.target.value)} placeholder="Sleeper username or league ID"
            className="rounded-md border px-3 py-1.5 text-sm flex-1 min-w-0" style={inputStyle} />
          <button type="submit" className="btn-primary rounded-md px-4 py-1.5 text-sm font-semibold">Connect</button>
        </span>
      </form>
      {found.state === "loading" && <p className="text-xs" style={{ color: "var(--text-muted)" }}>Finding your leagues on Sleeper…</p>}
      {found.state === "error" && <p className="text-xs" style={{ color: "var(--text-muted)" }}>Couldn't connect ({found.message}).</p>}
      {found.state === "ready" && (
        <div className="flex flex-wrap gap-2 items-center">
          <span className="text-xs" style={{ color: "var(--text-muted)" }}>Pick one:</span>
          {found.list.map((league) => (
            <button key={league.league_id} type="button" className="pill rounded-md px-2.5 py-1 text-xs" onClick={() => pick(league, found.userId)}>
              {league.name}
            </button>
          ))}
        </div>
      )}
    </div>
  );
}

// Per-player Sleeper feeds, kept in memory for 10 minutes so flipping between
// profiles doesn't refetch. useFeeds re-checks on useRefreshTick.
const feedCache = new Map();
const FEED_TTL_MS = 10 * 60 * 1000;
function fetchFeed(url) {
  const hit = feedCache.get(url);
  if (hit && Date.now() - hit.at < FEED_TTL_MS) return hit.promise;
  const promise = fetch(url).then((r) => {
    if (!r.ok) throw new Error(`Sleeper request failed (${r.status})`);
    return r.json();
  });
  promise.catch(() => feedCache.delete(url));
  feedCache.set(url, { at: Date.now(), promise });
  return promise;
}

function useFeeds(urls) {
  const key = urls ? urls.join("|") : "";
  const tick = useRefreshTick();
  const [state, setState] = useState({ key: "", status: "loading", data: null });
  useEffect(() => {
    if (!urls) return;
    let cancelled = false;
    Promise.all(urls.map(fetchFeed))
      .then((data) => { if (!cancelled) setState({ key, status: "live", data }); })
      // A failed background refresh keeps what's on screen.
      .catch((err) => { if (!cancelled) setState((s) => (s.key === key && s.data ? s : { key, status: "error", message: err.message, data: null })); });
    return () => { cancelled = true; };
  }, [key, tick]);
  return state.key === key ? state : { status: "loading", data: null };
}

// Fantasy points per game (or week) as bars, with an optional projection
// tick on each and a dashed line at the average. Hovering a bar (or focusing
// it) fills the readout line underneath; it starts on the latest game.
// items: [{ key, label, actual, proj, detail }] — actual null = no game.
function PointsChart({ items, color, showProj }) {
  const played = items.filter((it) => it.actual != null);
  const avg = played.length ? played.reduce((t, it) => t + it.actual, 0) / played.length : null;
  const max = Math.max(1, ...items.map((it) => Math.max(it.actual || 0, showProj ? it.proj || 0 : 0)));
  const [hover, setHover] = useState(null);
  const latest = played[played.length - 1] || items[0];
  const shown = items.find((it) => it.key === hover) || latest;
  const pct = (v) => `${(v / max) * 100}%`;

  return (
    <div className="flex flex-col gap-2">
      <div className="flex items-center gap-4 text-xs" style={{ color: "var(--text-secondary)" }}>
        <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-3 rounded-sm" style={{ background: color }} />Fantasy points</span>
        {showProj && <span className="flex items-center gap-1.5"><span className="inline-block w-3 h-0.5" style={{ background: "var(--text-primary)" }} />Projected</span>}
        {avg != null && <span className="flex items-center gap-1.5"><span className="inline-block w-3 border-t border-dashed" style={{ borderColor: "var(--text-muted)" }} />Average {fmt1(avg)}</span>}
      </div>
      <div className="pts-chart" onMouseLeave={() => setHover(null)}>
        {avg != null && <div className="pts-avg" style={{ bottom: pct(avg) }} />}
        {items.map((it) => (
          <button key={it.key} type="button" className="pts-col" aria-label={`${it.label}: ${it.detail}`}
            onMouseEnter={() => setHover(it.key)} onFocus={() => setHover(it.key)} data-active={shown && shown.key === it.key}>
            {it.actual != null && <span className="pts-bar" style={{ height: pct(it.actual), background: color }} />}
            {showProj && it.proj != null && <span className="pts-proj" style={{ bottom: pct(it.proj) }} />}
            {it.actual == null && it.proj == null && <span className="pts-none">–</span>}
          </button>
        ))}
      </div>
      <div className="pts-labels">
        {items.map((it) => <span key={it.key}>{it.short || it.label}</span>)}
      </div>
      {shown && (
        <p className="text-sm tabular-nums" style={{ color: "var(--text-secondary)" }}>
          <span className="font-semibold" style={{ color: "var(--text-primary)" }}>{shown.label}</span> · {shown.detail}
        </p>
      )}
    </div>
  );
}

/* ---------- value history graph ---------- */
// A player's dynasty value over time, one line per site. FantasyCalc comes
// live from its value-history endpoint (CORS-open, daily since Jan 1, in the
// current league settings; keyed by FantasyCalc's own id, the row's fcId):
// - api.fantasycalc.com/trades/implied/<fcId>?isDynasty=true&numQbs=<1|2>&numTeams=<8-14>&ppr=<0|0.5|1>
// KeepTradeCut, DynastyProcess and Dynasty Superflex are weekly points from
// data/market-history.js (baked daily by scripts/refresh-market-values.js),
// loaded the first time a profile opens. Redraft history isn't kept, so this
// is always dynasty value, and none of it includes TE premium.
const VALUE_LINES = [
  { key: "fc", label: "FantasyCalc", color: "var(--hue-blue)" },
  { key: "ktc", label: "KeepTradeCut", color: "var(--hue-orange)" },
  { key: "dp", label: "DynastyProcess", color: "var(--hue-aqua)" },
  { key: "dsf", label: "Dynasty Superflex", color: "var(--hue-yellow)" },
];
const VALUE_RANGES = [
  { key: 30, label: "1M" }, { key: 91, label: "3M" }, { key: 182, label: "6M" }, { key: 0, label: "All" },
];
const fcHistoryUrl = (fcId, s) =>
  `https://api.fantasycalc.com/trades/implied/${fcId}?isDynasty=true&numQbs=${s.qb === "sf" ? 2 : 1}` +
  `&numTeams=${Math.min(s.teams, 14)}&ppr=${s.ppr}`;

let marketHistoryPromise = null;
function loadMarketHistory() {
  if (window.MARKET_HISTORY) return Promise.resolve(window.MARKET_HISTORY);
  marketHistoryPromise ||= new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = "data/market-history.js";
    s.onload = () => (window.MARKET_HISTORY ? resolve(window.MARKET_HISTORY) : reject(new Error("empty history file")));
    s.onerror = () => { marketHistoryPromise = null; reject(new Error("data/market-history.js didn't load")); };
    document.head.appendChild(s);
  });
  return marketHistoryPromise;
}

function useMarketHistory() {
  const [history, setHistory] = useState(window.MARKET_HISTORY || null);
  useEffect(() => {
    if (history) return;
    let cancelled = false;
    loadMarketHistory().then((h) => { if (!cancelled) setHistory(h); }).catch(() => {});
    return () => { cancelled = true; };
  }, []);
  return history;
}

// Width of an element, kept up to date, so SVG text stays undistorted. A
// callback ref, so it attaches whenever the element first renders.
function useWidth() {
  const [el, setEl] = useState(null);
  const [width, setWidth] = useState(0);
  useEffect(() => {
    if (!el) return;
    const ro = new ResizeObserver(([e]) => setWidth(Math.round(e.contentRect.width)));
    ro.observe(el);
    return () => ro.disconnect();
  }, [el]);
  return [setEl, width];
}

const DAY_MS = 24 * 60 * 60 * 1000;
const dayOf = (t) => new Date(t).toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" });
// "Round" axis steps: 1, 2 or 5 × a power of ten.
function niceStep(span, count) {
  const raw = span / count;
  const pow = Math.pow(10, Math.floor(Math.log10(raw)));
  return [1, 2, 5, 10].map((m) => m * pow).find((s) => s >= raw);
}

function ValueHistory({ id, fcId, settings }) {
  const fcFeed = useFeeds(fcId ? [fcHistoryUrl(fcId, settings)] : null);
  const market = useMarketHistory();
  const [range, setRange] = useState(182);
  const [hover, setHover] = useState(null);
  const [wrapRef, width] = useWidth();

  // { key: [{ t, v }] }, oldest first.
  const series = useMemo(() => {
    const out = {};
    const fc = fcFeed.data?.[0]?.historicalValues || [];
    out.fc = fc.filter((p) => p.value > 0).map((p) => {
      const [m, d, y] = p.date.split("/").map(Number);
      return { t: Date.UTC(y, m - 1, d), v: p.value };
    });
    const mine = market?.players?.[settings.qb]?.[id] || {};
    for (const k of ["ktc", "dp", "dsf"]) {
      out[k] = (mine[k] || []).map((v, i) => ({ t: Date.parse(market.dates[i]), v })).filter((p) => p.v != null);
    }
    return out;
  }, [fcFeed.data, market, id, settings.qb]);

  const lines = VALUE_LINES.filter((l) => series[l.key]?.length > 1);
  const allPoints = lines.flatMap((l) => series[l.key]);
  const end = Math.max(...allPoints.map((p) => p.t));
  const first = Math.min(...allPoints.map((p) => p.t));
  const start = range ? Math.max(first, end - range * DAY_MS) : first;
  const visible = Object.fromEntries(lines.map((l) => {
    const pts = series[l.key];
    // Keep the last point before the window so the line starts at its edge.
    const i = pts.findIndex((p) => p.t >= start);
    return [l.key, i < 0 ? [] : pts.slice(Math.max(0, i - 1))];
  }));

  const loading = fcFeed.status === "loading" && !market;
  if (!lines.length) {
    return (
      <ProfileSection title="Dynasty value over time">
        <p className="text-sm" style={{ color: "var(--text-muted)" }}>
          {loading ? "Loading value history…" : "No value history for this player."}
        </p>
      </ProfileSection>
    );
  }

  // Chart geometry.
  const H = 240, padL = 48, padR = 12, padT = 12, padB = 26;
  const W = Math.max(width, 280);
  const vals = lines.flatMap((l) => visible[l.key].map((p) => p.v));
  const step = niceStep(Math.max(1, Math.max(...vals) - Math.min(...vals)), 4);
  const yMin = Math.max(0, Math.floor(Math.min(...vals) / step) * step);
  const yMax = Math.ceil(Math.max(...vals) / step) * step || step;
  const x = (t) => padL + ((Math.max(t, start) - start) / Math.max(end - start, DAY_MS)) * (W - padL - padR);
  const y = (v) => padT + (1 - (v - yMin) / Math.max(yMax - yMin, 1)) * (H - padT - padB);
  const yTicks = [];
  for (let v = yMin; v <= yMax + 1e-6; v += step) yTicks.push(v);
  const xTicks = [];
  for (let d = new Date(start); d.getTime() <= end; d.setUTCDate(1), d.setUTCMonth(d.getUTCMonth() + 1)) {
    const t = Date.UTC(d.getUTCFullYear(), d.getUTCMonth(), 1);
    if (t >= start) xTicks.push(t);
  }
  const everyOther = xTicks.length > 7;

  // Value of a line at (on or before) time t.
  const valueAt = (key, t) => {
    let v = null;
    for (const p of series[key]) { if (p.t > t) break; v = p.v; }
    return v;
  };
  const hoverT = hover == null ? end : hover;
  const onMove = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const px = ((e.clientX - r.left) / r.width) * W;
    const t = start + ((px - padL) / (W - padL - padR)) * (end - start);
    // Snap to the nearest FantasyCalc day (or market week).
    const snaps = (visible.fc?.length ? visible.fc : visible[lines[0].key]).map((p) => p.t);
    setHover(snaps.reduce((b, s) => (Math.abs(s - t) < Math.abs(b - t) ? s : b), snaps[0]));
  };

  return (
    <ProfileSection title="Dynasty value over time"
      aside={`${settings.qb === "sf" ? "Superflex" : "1QB"} · FantasyCalc daily in your league size and scoring, others weekly`}>
      <div className="flex items-center justify-between flex-wrap gap-2">
        <ul className="flex flex-wrap gap-x-4 gap-y-1 text-xs" style={{ color: "var(--text-secondary)" }}>
          {lines.map((l) => {
            const pts = visible[l.key];
            const change = pts.length > 1 ? pts[pts.length - 1].v - pts[0].v : 0;
            return (
              <li key={l.key} className="flex items-center gap-1.5">
                <span className="inline-block w-3 h-0.5 rounded" style={{ background: l.color }} />
                {l.label}
                <span className="tabular-nums" style={{ color: change > 0 ? "var(--trend-up)" : change < 0 ? "var(--series-red)" : "var(--text-muted)" }}>
                  {change > 0 ? "+" : ""}{change.toLocaleString()}
                </span>
              </li>
            );
          })}
        </ul>
        <PillGroup options={VALUE_RANGES} value={range} onChange={setRange} />
      </div>

      <div ref={wrapRef} className="w-full">
        {width > 0 && (
          <svg width={W} height={H} role="img" className="block select-none" style={{ touchAction: "pan-y" }}
            aria-label={`Value over time: ${lines.map((l) => `${l.label} ${fmtValue(valueAt(l.key, end))}`).join(", ")}`}
            onMouseMove={onMove} onMouseLeave={() => setHover(null)}
            onTouchStart={(e) => onMove({ clientX: e.touches[0].clientX, currentTarget: e.currentTarget })}>
            {yTicks.map((v) => (
              <g key={v}>
                <line x1={padL} x2={W - padR} y1={y(v)} y2={y(v)} stroke="var(--border)" strokeWidth="1" />
                <text x={padL - 6} y={y(v)} dy="0.32em" textAnchor="end" fontSize="11" fill="var(--text-muted)" className="tabular-nums">
                  {v >= 1000 ? `${(v / 1000).toFixed(v % 1000 ? 1 : 0)}k` : v}
                </text>
              </g>
            ))}
            {xTicks.map((t, i) => (everyOther && i % 2 ? null : (
              <text key={t} x={x(t)} y={H - 8} textAnchor="middle" fontSize="11" fill="var(--text-muted)">
                {new Date(t).toLocaleDateString(undefined, { month: "short", timeZone: "UTC" })}
              </text>
            )))}
            {lines.map((l) => (
              <polyline key={l.key} fill="none" stroke={l.color} strokeWidth="2" strokeLinejoin="round" strokeLinecap="round"
                points={visible[l.key].map((p) => `${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ")} />
            ))}
            {hover != null && (
              <g>
                <line x1={x(hoverT)} x2={x(hoverT)} y1={padT} y2={H - padB} stroke="var(--text-muted)" strokeWidth="1" strokeDasharray="3 3" />
                {lines.map((l) => {
                  const v = valueAt(l.key, hoverT);
                  return v == null ? null : (
                    <circle key={l.key} cx={x(hoverT)} cy={y(v)} r="4" fill={l.color} stroke="var(--surface-1)" strokeWidth="2" />
                  );
                })}
              </g>
            )}
          </svg>
        )}
      </div>

      <p className="text-sm tabular-nums flex flex-wrap gap-x-4 gap-y-1" style={{ color: "var(--text-secondary)" }}>
        <span className="font-semibold" style={{ color: "var(--text-primary)" }}>{hover == null ? "Latest" : dayOf(hoverT)}</span>
        {lines.map((l) => (
          <span key={l.key} className="flex items-center gap-1.5">
            <span className="inline-block w-2 h-2 rounded-full" style={{ background: l.color }} />
            {l.label} {fmtValue(valueAt(l.key, hoverT))}
          </span>
        ))}
      </p>
    </ProfileSection>
  );
}

/* ---------- football profile ---------- */
const NFL_STATE_URL = "https://api.sleeper.app/v1/state/nfl";
const nflPlayerUrl = (kind, id, season, grouping) =>
  `https://api.sleeper.com/${kind}/nfl/player/${id}?season_type=regular&season=${season}&grouping=${grouping}`;
const PTS_KEY = { 1: "pts_ppr", 0.5: "pts_half_ppr", 0: "pts_std" };
const POS_RANK_KEY = { 1: "pos_rank_ppr", 0.5: "pos_rank_half_ppr", 0: "pos_rank_std" };
const SCORING_LABEL = { 1: "PPR", 0.5: "half-PPR", 0: "standard" };

// Game log columns by position: [header, stat key or (stats) => text].
const NFL_RECEIVING = [["Tgt", "rec_tgt"], ["Rec", "rec"], ["Rec Yd", "rec_yd"], ["Rec TD", "rec_td"], ["Rush Yd", "rush_yd"]];
const NFL_LOG_COLUMNS = {
  QB: [["Cmp/Att", (s) => (s.pass_att ? `${s.pass_cmp || 0}/${s.pass_att}` : "–")], ["Pass Yd", "pass_yd"], ["Pass TD", "pass_td"],
    ["INT", "pass_int"], ["Rush Yd", "rush_yd"], ["Rush TD", "rush_td"]],
  RB: [["Car", "rush_att"], ["Rush Yd", "rush_yd"], ["Rush TD", "rush_td"], ["Tgt", "rec_tgt"], ["Rec", "rec"], ["Rec Yd", "rec_yd"], ["Rec TD", "rec_td"]],
  WR: NFL_RECEIVING,
  TE: NFL_RECEIVING,
};
const logCell = (s, col) => (typeof col === "function" ? col(s) : fmtStat(s[col] || 0));

// A season's headline totals, by position.
function nflSeasonLine(pos, s) {
  if (pos === "QB") return `${fmtStat(s.pass_yd)} pass yd, ${fmtStat(s.pass_td)} TD, ${fmtStat(s.pass_int)} INT, ${fmtStat(s.rush_yd)} rush yd, ${fmtStat(s.rush_td)} rush TD`;
  if (pos === "RB") return `${fmtStat(s.rush_yd)} rush yd, ${fmtStat(s.rush_td)} rush TD, ${fmtStat(s.rec)} rec, ${fmtStat(s.rec_yd)} rec yd, ${fmtStat(s.rec_td)} rec TD`;
  return `${fmtStat(s.rec)} rec on ${fmtStat(s.rec_tgt)} targets, ${fmtStat(s.rec_yd)} yd, ${fmtStat(s.rec_td)} TD`;
}

function NflProfile({ dynasty, settings }) {
  const id = usePlayerIdFromHash("nfl");
  const back = lastRoom.nfl;
  const statuses = useSleeperStatuses();
  const bio = statuses[id];

  const stateFeed = useFeeds([NFL_STATE_URL]);
  const season = stateFeed.data?.[0]?.season;
  const feeds = useFeeds(id && season ? [
    nflPlayerUrl("stats", id, season, "week"),
    nflPlayerUrl("projections", id, season, "week"),
    nflPlayerUrl("stats", id, season, "season"),
    nflPlayerUrl("stats", id, Number(season) - 1, "season"),
  ] : null);

  // Value-list neighbors and draft-board slot, in the current league settings.
  const players = useMemo(() => dynasty.rows.filter((r) => r.position !== "PICK").sort((a, b) => b.value - a.value), [dynasty.rows]);
  const index = players.findIndex((r) => r.id === id);
  const row = players[index];

  const name = row?.name || bio?.name;
  const pos = row?.position || bio?.position;
  useEffect(() => { if (name) document.title = `${name} · Football · Fantasy Front Office`; }, [name]);

  if (!id) return <ProfileMessage back={back}>No player picked.</ProfileMessage>;
  if (!name) {
    return <ProfileMessage back={back}>{Object.keys(statuses).length ? "This player isn't on an NFL roster or the value list." : "Loading player…"}</ProfileMessage>;
  }

  const ptsKey = PTS_KEY[settings.ppr];
  const scoring = SCORING_LABEL[settings.ppr];
  const [weekStats, weekProj, seasonStats, lastSeason] = feeds.data || [];
  const currentWeek = stateFeed.data?.[0]?.week || 0;

  // One entry per week 1-18: actual (if he played), projection, opponent.
  const weeks = Array.from({ length: 18 }, (_, i) => {
    const w = String(i + 1);
    const st = weekStats?.[w];
    const pr = weekProj?.[w];
    const playedGame = st && st.stats && st.stats.gp > 0;
    const opp = (st || pr)?.opponent;
    const away = (st || pr)?.is_away_team;
    const actual = playedGame ? st.stats[ptsKey] || 0 : null;
    const proj = pr?.stats?.[ptsKey] ?? null;
    const oppText = opp ? `${away ? "@" : "vs"} ${opp}` : "Bye";
    const detail = playedGame
      ? `${oppText}: ${fmt1(actual)} pts${proj != null ? ` (projected ${fmt1(proj)})` : ""}`
      : opp
        ? (i + 1 < currentWeek ? `${oppText}: didn't play` : `${oppText}: projected ${proj != null ? fmt1(proj) : "–"}`)
        : "Bye week";
    return { key: w, week: i + 1, label: `Week ${i + 1}`, short: String(i + 1), actual, proj, opp, away, oppText, stats: playedGame ? st.stats : null, detail };
  });
  const played = weeks.filter((w) => w.stats);
  const totals = sumStats(played.map((w) => w.stats));
  const totalPts = played.reduce((t, w) => t + w.actual, 0);
  const upcoming = weeks.filter((w) => w.week >= Math.max(currentWeek, (played[played.length - 1]?.week || 0) + 1) && w.opp).slice(0, 3);
  const posRank = seasonStats?.stats?.[POS_RANK_KEY[settings.ppr]];
  const last = lastSeason?.stats;
  const columns = NFL_LOG_COLUMNS[pos] || NFL_RECEIVING;
  const color = posPillColor(pos);
  const age = row?.age ?? bio?.age;

  return (
    <div className="flex flex-col gap-6">
      <ProfileHero sport="nfl" id={id} name={name} pos={pos} team={row?.team || bio?.team} number={bio?.number}
        status={bio?.status} statusColor={REPORT_STATUS_COLOR[bio?.status]} back={back}
        facts={[
          age && `Age ${Math.floor(age)}`,
          bio?.height && `${fmtHeight(bio.height)}${bio.weight ? `, ${bio.weight} lb` : ""}`,
          bio?.college,
          bio?.exp != null && (bio.exp === 0 ? "Rookie" : `${ordinal(bio.exp + 1)} season`),
        ]} />

      {bio?.status && (bio.injury || bio.notes) && (
        <p className="text-sm rounded-lg border px-4 py-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-secondary)" }}>
          <span className="font-semibold" style={{ color: REPORT_STATUS_COLOR[bio.status] || "var(--series-amber)" }}>{bio.status}</span>
          {bio.injury && <> · {bio.injury}</>}{bio.notes && <> · {bio.notes}</>}
        </p>
      )}

      <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
        <StatTile label={settings.mode === "dynasty" ? "Dynasty value" : "Redraft value"} value={row ? fmtValue(row.value) : "–"}
          sub={row ? `#${index + 1} overall · ${pos}${row.posRank}` : "Not on the value list"} />
        <StatTile label="30-day trend" value={row ? (row.trend30 > 0 ? `+${row.trend30.toLocaleString()}` : row.trend30.toLocaleString()) : "–"}
          sub={row ? (row.trend30 > 0 ? "Rising" : row.trend30 < 0 ? "Falling" : "Holding steady") : null}
          subColor={row && row.trend30 > 0 ? "var(--trend-up)" : row && row.trend30 < 0 ? "var(--series-red)" : undefined} />
        <StatTile label={`${season || ""} ${scoring} points`} value={feeds.data ? fmt1(totalPts) : "…"}
          sub={feeds.data ? `${played.length ? fmt1(totalPts / played.length) : "–"} per game · ${played.length} games${posRank ? ` · ${pos}${posRank}` : ""}` : "Loading from Sleeper"} />
        <StatTile label="Draft Board slot" value={row ? boardPick(index, settings.teams) : "–"}
          sub={row ? `In a ${settings.teams >= 16 ? "16+" : settings.teams}-team ${settings.mode === "dynasty" ? "startup" : "draft"}` : null} />
      </div>

      <ValueHistory id={id} fcId={row?.fcId} settings={settings} />

      {feeds.status === "error" && (
        <p className="text-sm" style={{ color: "var(--series-red)" }}>Couldn't load stats from Sleeper ({feeds.message}).</p>
      )}

      {feeds.data && (
        <ProfileSection title={`${season} fantasy points by week`} aside={`${scoring} scoring · projections from Sleeper`}>
          <PointsChart items={weeks} color={color} showProj />
        </ProfileSection>
      )}

      <div className="grid gap-6 lg:grid-cols-3">
        <div className="lg:col-span-2 flex flex-col gap-6">
          {feeds.data && (
            <ProfileSection title="Game log" aside={played.length ? nflSeasonLine(pos, totals) : null}>
              <div className="overflow-x-auto">
                <table className="w-full border-collapse text-sm">
                  <thead>
                    <tr>
                      {["Wk", "Opp", ...columns.map((c) => c[0]), "Proj", "Pts"].map((h, i) => (
                        <th key={h} className={`px-2 py-1.5 text-xs font-semibold ${i < 2 ? "text-left" : "text-right"}`} style={{ color: "var(--text-muted)" }}>{h}</th>
                      ))}
                    </tr>
                  </thead>
                  <tbody>
                    {weeks.filter((w) => w.week < currentWeek || w.stats).map((w) => (
                      <tr key={w.key} className="border-t" style={{ borderColor: "var(--border)" }}>
                        <td className="px-2 py-1.5 tabular-nums" style={{ color: "var(--text-muted)" }}>{w.week}</td>
                        <td className="px-2 py-1.5 whitespace-nowrap" style={{ color: "var(--text-secondary)" }}>{w.oppText}</td>
                        {w.stats
                          ? columns.map((c) => <td key={c[0]} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{logCell(w.stats, c[1])}</td>)
                          : <td colSpan={columns.length} className="px-2 py-1.5 text-right text-xs" style={{ color: "var(--text-muted)" }}>{w.opp ? "Did not play" : "Bye"}</td>}
                        <td className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-muted)" }}>{w.proj != null ? fmt1(w.proj) : "–"}</td>
                        <td className="px-2 py-1.5 text-right tabular-nums font-semibold"
                          style={{ color: w.actual == null ? "var(--text-muted)" : w.proj != null && w.actual >= w.proj ? "var(--trend-up)" : "var(--text-primary)" }}>
                          {w.actual != null ? fmt1(w.actual) : "–"}
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </ProfileSection>
          )}
        </div>

        <div className="flex flex-col gap-6">
          {upcoming.length > 0 && (
            <ProfileSection title="Next up">
              <ul className="flex flex-col">
                {upcoming.map((w) => (
                  <li key={w.key} className="flex justify-between gap-3 py-1.5 border-b text-sm last:border-b-0" style={{ borderColor: "var(--border)" }}>
                    <span style={{ color: "var(--text-secondary)" }}>Week {w.week} <span style={{ color: "var(--text-primary)" }}>{w.oppText}</span></span>
                    <span className="tabular-nums" style={{ color: "var(--text-primary)" }}>{w.proj != null ? `${fmt1(w.proj)} proj` : "–"}</span>
                  </li>
                ))}
              </ul>
            </ProfileSection>
          )}
          {last && last.gp > 0 && (
            <ProfileSection title={`${Number(season) - 1} season`}>
              <div className="grid grid-cols-3 gap-2 text-center">
                {[["Games", fmtStat(last.gp)], ["Points", fmt1(last[ptsKey] || 0)], ["Per game", fmt1((last[ptsKey] || 0) / last.gp)]].map(([l, v]) => (
                  <div key={l}>
                    <div className="text-lg font-semibold tabular-nums" style={{ color: "var(--text-primary)" }}>{v}</div>
                    <div className="text-xs" style={{ color: "var(--text-muted)" }}>{l}</div>
                  </div>
                ))}
              </div>
              <p className="text-xs" style={{ color: "var(--text-secondary)" }}>
                {last[POS_RANK_KEY[settings.ppr]] ? `Finished ${pos}${last[POS_RANK_KEY[settings.ppr]]}. ` : ""}{nflSeasonLine(pos, last)}.
              </p>
            </ProfileSection>
          )}
          <SimilarPlayers sport="nfl" list={players} index={index} fmt={(r) => fmtValue(r.value)} />
        </div>
      </div>

      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        Stats, projections, injuries and bio from Sleeper. Value from KeepTradeCut (FantasyCalc where KTC has none) for {describeSettings(settings)} leagues;
        change the league settings on the <a href="#/values" className="underline">Value Board</a>.
      </p>
    </div>
  );
}

/* ---------- basketball profile ---------- */
const nbaPlayerLogUrl = (id, season) => `https://api.sleeper.com/stats/nba/player/${id}?season_type=regular&season=${season}&grouping=week`;
const NBA_LOG_COLUMNS = [["Min", (s) => fmtStat((s.sp || 0) / 60)], ["Pts", "pts"], ["Reb", "reb"], ["Ast", "ast"], ["Stl", "stl"], ["Blk", "blk"], ["3PM", "tpm"], ["TO", "to"]];
const NBA_LOG_PREVIEW = 15;
const fmtGameDate = (d) => new Date(d + "T12:00:00").toLocaleDateString(undefined, { month: "short", day: "numeric" });

function NbaProfile({ data, settings }) {
  const id = usePlayerIdFromHash("nba");
  const back = lastRoom.nba;
  const [showAll, setShowAll] = useState(false);
  useEffect(() => setShowAll(false), [id]);

  const { rows } = useMemo(() => nbaTradeRows(data, settings.scoring), [data, settings.scoring]);
  const index = rows.findIndex((r) => r.id === id);
  const row = rows[index];
  const info = data.players[id];
  const season = data.activeSeason;
  const feeds = useFeeds(id && season ? [nbaPlayerLogUrl(id, season)] : null);

  const name = info?.name || row?.name;
  const pos = info?.position || row?.position;
  useEffect(() => { if (name) document.title = `${name} · Basketball · Fantasy Front Office`; }, [name]);

  if (!id) return <ProfileMessage back={back}>No player picked.</ProfileMessage>;
  if (!name) return <ProfileMessage back={back}>This player isn't on an NBA roster or the value list.</ProfileMessage>;

  const scoringLabel = settings.scoring === "espn" ? "ESPN" : "Standard";
  const seasonRow = (s) => (data.seasons[s] || []).find((p) => p.id === id);
  const cur = seasonRow(season);
  const other = season === data.state.season ? seasonRow(data.state.previous_season) : null;
  const otherSeason = data.state.previous_season;

  // Game log, oldest first, only games he actually played.
  const games = feeds.data
    ? Object.values(feeds.data[0] || {}).flat()
      .filter((g) => g && g.stats && g.stats.sp > 0)
      .sort((a, b) => (a.date < b.date ? -1 : 1))
      .map((g) => ({ ...g, fpts: nbaPoints(g.stats, settings.scoring) }))
    : [];
  const recent = games.slice(-20);
  const chartItems = recent.map((g) => ({
    key: g.date, label: fmtGameDate(g.date), short: fmtGameDate(g.date).replace(/^\w+ /, ""), actual: g.fpts, proj: null,
    detail: `${g.is_away_team ? "@" : "vs"} ${g.opponent}: ${fmt1(g.fpts)} pts (${fmtStat(g.stats.pts)} pts, ${fmtStat(g.stats.reb)} reb, ${fmtStat(g.stats.ast)} ast)`,
  }));
  const log = [...games].reverse();
  const perGame = (p, k) => (p && p.gp ? fmt1((p.stats[k] || 0) / p.gp) : "–");
  const color = posPillColor(pos);

  return (
    <div className="flex flex-col gap-6">
      <ProfileHero sport="nba" id={id} name={name} pos={pos} posLabel={(info?.positions || [pos]).join("/")} team={info?.team || row?.team}
        status={info?.status} statusColor={NBA_STATUS_COLOR[info?.status]} back={back}
        facts={[info?.age && `Age ${info.age}`]} />

      {info?.status && (info.injury || info.notes) && (
        <p className="text-sm rounded-lg border px-4 py-3" style={{ borderColor: "var(--border)", background: "var(--surface-1)", color: "var(--text-secondary)" }}>
          <span className="font-semibold" style={{ color: NBA_STATUS_COLOR[info.status] || "var(--series-amber)" }}>{info.status}</span>
          {info.injury && <> · {info.injury}</>}{info.notes && <> · {info.notes}</>}
        </p>
      )}
      <NbaSeasonNote data={data} />

      <div className="grid gap-3 grid-cols-2 lg:grid-cols-4">
        <StatTile label="Trade value" value={row ? row.value.toLocaleString() : "–"}
          sub={row ? `#${index + 1} overall · ${row.position}${row.posRank} · projected points left` : "Not valued until he plays"} />
        <StatTile label={`${nbaSeasonLabel(season)} FPG`} value={cur ? fmt1(nbaFpg(cur, settings.scoring)) : "–"}
          sub={cur ? `${scoringLabel} scoring · ${cur.gp} games` : "No games this season"} />
        <StatTile label="Plays" value={row ? `${Math.round(row.avail * 100)}%` : "–"} sub="of his team's games" />
        <StatTile label="Draft Board slot" value={row ? boardPick(index, settings.teams) : "–"}
          sub={row ? `In a ${settings.teams >= 16 ? "16+" : settings.teams}-team draft` : null} />
      </div>

      {feeds.status === "error" && (
        <p className="text-sm" style={{ color: "var(--series-red)" }}>Couldn't load the game log from Sleeper ({feeds.message}).</p>
      )}
      {chartItems.length > 0 && (
        <ProfileSection title={`Last ${chartItems.length} games`} aside={`${scoringLabel} fantasy points`}>
          <PointsChart items={chartItems} color={color} />
        </ProfileSection>
      )}

      <div className="grid gap-6 lg:grid-cols-3">
        <div className="lg:col-span-2 flex flex-col gap-6">
          {feeds.data && (
            <ProfileSection title={`${nbaSeasonLabel(season)} game log`} aside={`${games.length} games`}>
              {games.length === 0 ? (
                <p className="text-sm" style={{ color: "var(--text-muted)" }}>No games played this season.</p>
              ) : (
                <div className="overflow-x-auto">
                  <table className="w-full border-collapse text-sm">
                    <thead>
                      <tr>
                        {["Date", "Opp", ...NBA_LOG_COLUMNS.map((c) => c[0]), "FPts"].map((h, i) => (
                          <th key={h} className={`px-2 py-1.5 text-xs font-semibold ${i < 2 ? "text-left" : "text-right"}`} style={{ color: "var(--text-muted)" }}>{h}</th>
                        ))}
                      </tr>
                    </thead>
                    <tbody>
                      {(showAll ? log : log.slice(0, NBA_LOG_PREVIEW)).map((g) => (
                        <tr key={g.date} className="border-t" style={{ borderColor: "var(--border)" }}>
                          <td className="px-2 py-1.5 whitespace-nowrap" style={{ color: "var(--text-muted)" }}>{fmtGameDate(g.date)}</td>
                          <td className="px-2 py-1.5 whitespace-nowrap" style={{ color: "var(--text-secondary)" }}>{g.is_away_team ? "@" : "vs"} {g.opponent}</td>
                          {NBA_LOG_COLUMNS.map((c) => (
                            <td key={c[0]} className="px-2 py-1.5 text-right tabular-nums" style={{ color: "var(--text-secondary)" }}>{logCell(g.stats, c[1])}</td>
                          ))}
                          <td className="px-2 py-1.5 text-right tabular-nums font-semibold" style={{ color: "var(--text-primary)" }}>{fmt1(g.fpts)}</td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              )}
              {log.length > NBA_LOG_PREVIEW && (
                <button type="button" onClick={() => setShowAll(!showAll)} className="btn-secondary rounded-md px-3 py-1.5 text-sm font-medium w-fit">
                  {showAll ? "Show fewer" : `Show all ${log.length} games`}
                </button>
              )}
            </ProfileSection>
          )}
        </div>

        <div className="flex flex-col gap-6">
          {[[season, cur], [otherSeason, other]].filter(([, p]) => p).map(([s, p]) => (
            <ProfileSection key={s} title={`${nbaSeasonLabel(s)} averages`} aside={`${p.gp} games`}>
              <div className="grid grid-cols-4 gap-2 text-center">
                {[["FPG", fmt1(nbaFpg(p, settings.scoring))], ...NBA_PER_GAME.map(([k, l]) => [l, perGame(p, k)])].map(([l, v]) => (

          ))}

      </div>

      <p className="text-xs" style={{ color: "var(--text-muted)" }}>
        Stats, injuries and bio from Sleeper. Trade value is the Trade Analyzer's projected rest-of-season points in
        {" "}{scoringLabel} scoring. {NBA_SCORING_NOTE[settings.scoring]}
      </p>
    </div>
  );
}

function pageFromHash(hash) {
  if (hash.startsWith("#trade=")) return "trade";
  if (hash.startsWith("#nbatrade=")) return "nba-trade";
  if (hash.startsWith(PLAYER_HASH.nba)) return "nba-player";
  if (hash.startsWith(PLAYER_HASH.nfl)) return "player";
  if (hash.startsWith(`${LEAGUES_HASH}/`)) return "leagues";
  return (PAGES.find((p) => p.hash === hash) || PAGE_BY_KEY.home).key;
}

function useRoute() {
  const [page, setPage] = useState(() => pageFromHash(window.location.hash));
  useEffect(() => {
    const sync = () => setPage(pageFromHash(window.location.hash));
    window.addEventListener("popstate", sync);
    window.addEventListener("hashchange", sync);
    return () => { window.removeEventListener("popstate", sync); window.removeEventListener("hashchange", sync); };
  }, []);
  useEffect(() => {
    const p = PAGE_BY_KEY[page];
    if (p.hidden) return; // profiles title themselves with the player's name
    lastRoom[p.sport || "nfl"] = { hash: window.location.hash || p.hash, label: p.short };
    document.title = page === "home" ? "Fantasy Front Office — run your team like a GM"
      : `${p.short} · ${SPORT_LABEL[p.sport]} · Fantasy Front Office`;
  }, [page]);
  const navigate = (key) => {
    const tradeKey = TRADE_HASH_KEY[key];
    const target = (tradeKey && lastTradeHashes[tradeKey]) || PAGE_BY_KEY[key].hash;
    if (target !== window.location.hash) {
      try { window.history.pushState(null, "", target); } catch (e) { window.location.hash = target; }
      window.dispatchEvent(new PopStateEvent("popstate")); // pushState doesn't fire it; pages watching the hash need it
    }
    setPage(key);
    window.scrollTo(0, 0);
  };
  return [page, navigate];
}

function useSport(page) {
